<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>명찰</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    background:#fff;color:#111;
    transition:background .2s,color .2s;
    -webkit-user-select:none;user-select:none;
  }
  body.dark{background:#000;color:#fff;}

  /* ── 표시 화면 ── */
  #show{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 6px max(8px,env(safe-area-inset-bottom));
  }
  #name{
    font-weight:900;line-height:1;text-align:center;
    letter-spacing:-.03em;white-space:nowrap;
  }
  #tel{
    text-align:center;font-weight:900;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .telline{line-height:1.0;white-space:nowrap;}
  #empty{
    font-size:5vw;opacity:.35;text-align:center;line-height:1.7;font-weight:600;
  }

  /* ── 코너 버튼 (사진 방해 최소화) ── */
  .btns{position:fixed;inset:0;pointer-events:none;transition:opacity .35s;}
  .btns.hidden{opacity:0;}
  .btns.hidden .btn{pointer-events:none;}   /* 안 보일 땐 눌리지도 않게 */
  .btn{
    position:absolute;pointer-events:auto;
    background:rgba(128,128,128,.16);
    color:inherit;border:none;border-radius:999px;
    font-size:14px;font-weight:700;font-family:inherit;
    padding:10px 16px;cursor:pointer;backdrop-filter:blur(4px);
  }
  #bEdit{top:max(10px,env(safe-area-inset-top));left:10px;}
  #bTheme{top:max(10px,env(safe-area-inset-top));right:10px;}
  #bFull{bottom:max(10px,env(safe-area-inset-bottom));right:10px;}
  #bClear{bottom:max(10px,env(safe-area-inset-bottom));left:10px;}

  /* ── 편집 화면 ── */
  #edit{
    position:fixed;inset:0;z-index:10;background:#fff;color:#111;
    display:none;flex-direction:column;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    gap:16px;overflow-y:auto;
  }
  #edit.on{display:flex;}
  #edit h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  label{font-size:15px;font-weight:700;color:#555;margin-bottom:-8px;}
  input{
    width:100%;font-family:inherit;font-size:30px;font-weight:800;
    padding:16px 18px;border:2.5px solid #ddd;border-radius:14px;
    background:#fafafa;color:#111;
  }
  input:focus{outline:none;border-color:#1E3A5F;background:#fff;}
  #tel_i{font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:10px;}
  .go{
    flex:1;font-family:inherit;font-size:20px;font-weight:800;
    padding:20px;border:none;border-radius:14px;cursor:pointer;
    background:#1E3A5F;color:#fff;
  }
  .sub{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:20px 22px;border:2px solid #ddd;border-radius:14px;
    background:#fff;color:#666;cursor:pointer;
  }
  .recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
  .chip{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:9px 15px;border-radius:999px;border:1.5px solid #ddd;
    background:#f5f5f5;color:#333;cursor:pointer;
  }
  .hint{font-size:13px;color:#999;line-height:1.6;margin-top:2px;}
</style>
</head>
<body>

<!-- 표시 화면 -->
<div id="show">
  <div id="name"></div>
  <div id="tel"></div>
  <div id="empty">이름과 전화번호를 입력하세요<br>왼쪽 위 <b>편집</b> 버튼</div>
</div>

<div class="btns" id="btns">
  <button class="btn" id="bEdit">✏️ 편집</button>
  <button class="btn" id="bTheme">◐ 배경</button>
  <button class="btn" id="bClear">✕ 지우기</button>
  <button class="btn" id="bFull">⛶ 전체화면</button>
</div>

<!-- 편집 화면 -->
<div id="edit">
  <h1>🏷️ 명찰 입력</h1>
  <label for="name_i">이름</label>
  <input id="name_i" type="text" placeholder="김재식" autocomplete="off" enterkeyhint="next">
  <label for="tel_i">전화번호</label>
  <input id="tel_i" type="tel" inputmode="numeric" placeholder="01012345678" autocomplete="off" enterkeyhint="done">
  <div class="row">
    <button class="go" id="bShow">전체화면 보기</button>
    <button class="sub" id="bReset">비우기</button>
  </div>
  <label style="margin-top:8px">최근 입력</label>
  <div class="recent" id="recent"></div>
  <div class="hint">
    · 숫자만 입력하면 하이픈이 자동으로 붙습니다<br>
    · 버튼을 누르면 바로 전체화면으로 크게 표시됩니다<br>
    · 세로로 들면 전화번호가 3줄로 나뉘어 더 크게 보입니다<br>
    · 표시 중에는 화면이 꺼지지 않습니다<br>
    · 표시 중 버튼은 완전히 숨겨집니다 → 화면을 한 번 터치하면 나타남<br>
    · 나가기: 화면 터치 → 우측 아래 <b>✕ 나가기</b> (또는 뒤로가기 제스처)<br>
    <span style="color:#bbb">버전 v8 (2026-07-26)</span>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const showEl=$('show'), nameEl=$('name'), telEl=$('tel'), emptyEl=$('empty');
  const editEl=$('edit'), nameI=$('name_i'), telI=$('tel_i'), recentEl=$('recent');
  const btns=$('btns');
  const LS='nametag_v1';

  let data={name:'',tel:'',dark:false,recent:[]};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    const d=(v||'').replace(/\D/g,'').slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  /* 전화번호 줄 구성 */
  function setTelLines(lines){
    telEl.innerHTML='';
    lines.forEach(t=>{
      const d=document.createElement('div');
      d.className='telline'; d.textContent=t;
      telEl.appendChild(d);
    });
    telEl.style.display = lines.length ? 'block' : 'none';
  }

  /* 이름과 전화번호를 "같은 글자 크기"로, 화면에 최대한 크게 */
  function fitBoth(availW, availH, gap){
    const hasName = !!nameEl.textContent;
    const hasTel  = telEl.children.length > 0;
    nameEl.style.display = hasName ? 'block' : 'none';
    if(!hasName && !hasTel) return 0;

    let lo=10, hi=1000;
    for(let i=0;i<24;i++){
      const mid=(lo+hi)/2;
      nameEl.style.fontSize=mid+'px';
      telEl.style.fontSize=mid+'px';

      let ok=true;
      if(hasName && nameEl.scrollWidth>availW) ok=false;
      if(ok && hasTel){
        for(const d of telEl.children) if(d.scrollWidth>availW){ ok=false; break; }
      }
      if(ok){
        const h=(hasName?nameEl.scrollHeight:0)
              + (hasTel ?telEl.scrollHeight :0)
              + ((hasName&&hasTel)?gap:0);
        if(h>availH) ok=false;
      }
      if(ok) lo=mid; else hi=mid;
    }
    const s=Math.floor(lo);
    nameEl.style.fontSize=s+'px';
    telEl.style.fontSize=s+'px';
    return s;
  }

  /* 전화번호를 줄로 분할: 010- / 9198- / 2020 */
  function telLines(tel){
    if(!tel) return [];
    const parts=tel.split('-').filter(Boolean);
    if(parts.length<=1) return parts;
    return parts.map((p,i)=> i<parts.length-1 ? p+'-' : p);
  }

  function render(){
    document.body.classList.toggle('dark', !!data.dark);
    document.querySelector('meta[name=theme-color]')
      .setAttribute('content', data.dark ? '#000000' : '#ffffff');

    const has=!!(data.name||data.tel);
    emptyEl.style.display = has ? 'none' : 'block';
    nameEl.textContent = data.name||'';
    if(!has){ setTelLines([]); nameEl.style.display='none'; return; }

    const W=window.innerWidth, H=window.innerHeight;
    const availW = W*0.97;
    const portrait = H >= W;          // 세로 모드

    // 이름과 전화번호 사이 여백
    const gap = portrait ? H*0.07 : H*0.06;
    showEl.style.gap = gap+'px';

    // 세로면 번호를 3줄로, 가로면 한 줄로
    setTelLines(data.tel ? (portrait ? telLines(data.tel) : [data.tel]) : []);

    // 이름 · 전화번호를 같은 크기로 최대한 크게
    fitBoth(availW, H*0.88, gap);

    renderRecent();
  }

  function renderRecent(){
    recentEl.innerHTML='';
    (data.recent||[]).slice(0,8).forEach(r=>{
      const b=document.createElement('button');
      b.className='chip'; b.textContent=r.name||r.tel;
      b.onclick=()=>{ nameI.value=r.name; telI.value=r.tel; };
      recentEl.appendChild(b);
    });
  }
  function pushRecent(name,tel){
    if(!name&&!tel) return;
    data.recent=(data.recent||[]).filter(r=>!(r.name===name&&r.tel===tel));
    data.recent.unshift({name,tel});
    data.recent=data.recent.slice(0,8);
  }

  /* 화면 꺼짐 방지 */
  let wl=null;
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wl){
        wl=await navigator.wakeLock.request('screen');
        wl.addEventListener('release',()=>{wl=null;});
      } else if(!on && wl){ await wl.release(); wl=null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && !editEl.classList.contains('on')) keepAwake(true);
  });

  /* 버튼: 평소엔 완전히 숨김, 화면을 터치하면 나타남 */
  let hideT;
  function hideBtns(){ clearTimeout(hideT); btns.classList.add('hidden'); }
  function poke(){                       // 터치 시 4초간 표시
    clearTimeout(hideT);
    btns.classList.remove('hidden');
    if (data.name || data.tel) hideT=setTimeout(()=>btns.classList.add('hidden'),4000);
  }
  showEl.addEventListener('pointerdown',poke);

  function openEdit(){
    nameI.value=data.name; telI.value=data.tel;
    editEl.classList.add('on'); keepAwake(false);
    setTimeout(()=>nameI.focus(),60);
  }
  /* 홈 화면 앱으로 실행 중이면 이미 전체화면 → 크롬 안내문구 안 뜸 */
  function isAppMode(){
    return window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }
  function goFull(){
    if(document.fullscreenElement || isAppMode()) return;
    try{
      const p = document.documentElement.requestFullscreen?.({navigationUI:'hide'});
      if(p && p.catch) p.catch(()=>{});
    }catch(e){}
  }

  function applyEdit(){
    data.name=nameI.value.trim();
    data.tel=fmtTel(telI.value);
    pushRecent(data.name,data.tel);
    save();
    editEl.classList.remove('on');
    nameI.blur(); telI.blur();          // 키보드 내리기
    goFull();                           // 입력 즉시 전체화면
    render(); keepAwake(true);
    hideBtns();                         // 버튼 바로 숨김 (사진에 안 나오게)
    setTimeout(()=>{ render(); hideBtns(); }, 400);  // 전체화면 전환 후 재계산
  }

  $('bEdit').onclick=openEdit;
  $('bShow').onclick=applyEdit;
  $('bReset').onclick=()=>{ nameI.value=''; telI.value=''; nameI.focus(); };
  $('bClear').onclick=()=>{ data.name=''; data.tel=''; save(); render(); poke(); };
  $('bTheme').onclick=()=>{ data.dark=!data.dark; save(); render(); poke(); };
  /* 우하단 버튼: 현재 상태에 따라 들어가기 / 나가기 */
  const bFullEl=$('bFull');
  function updateFullBtn(){
    if(isAppMode())                     bFullEl.textContent='✕ 앱 닫기';
    else if(document.fullscreenElement) bFullEl.textContent='✕ 나가기';
    else                                bFullEl.textContent='⛶ 전체화면';
  }
  function exitFull(){
    if(document.fullscreenElement){
      const p=document.exitFullscreen?.();
      if(p&&p.catch) p.catch(()=>{});
    }
  }
  bFullEl.onclick=()=>{
    if(isAppMode()){                    // 홈 화면 앱으로 실행 중 → 앱 종료 시도
      try{ window.close(); }catch(e){}
      setTimeout(()=>{ alert('뒤로가기 제스처(화면 가장자리에서 안쪽으로 쓸기)로 나갈 수 있습니다.'); },400);
      return;
    }
    if(document.fullscreenElement) exitFull(); else goFull();
    poke();
  };
  document.addEventListener('fullscreenchange',()=>{
    updateFullBtn();
    if(document.fullscreenElement) hideBtns();  // 들어갈 땐 계속 숨김
    else poke();                                // 나왔을 때만 잠시 표시
    setTimeout(render,300);             // 화면 크기 바뀌었으니 글자 재계산
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && document.fullscreenElement) exitFull();
  });
  updateFullBtn();

  telI.addEventListener('input',e=>{ e.target.value=fmtTel(e.target.value); });
  nameI.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); telI.focus(); } });
  telI.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyEdit(); } });

  window.addEventListener('resize',render);
  window.addEventListener('orientationchange',()=>setTimeout(render,250));

  render();
  keepAwake(true);
  // 처음 열 때: 내용이 있으면 버튼 숨김, 비어 있으면 안내를 위해 표시
  if (data.name || data.tel) hideBtns(); else poke();

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
