<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- interactive-widget: 키보드가 올라오면 화면 영역 자체를 줄여서,
     가운데 놓인 입력·저장 패널이 키보드에 가리지 않고 위로 올라오게 한다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#D1C7B7">

<title>새가족 사진촬영</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">

<style>
  /* 빙그레체 — 눈누(noonnu.cc)에서 배포하는 상업용 무료 폰트, CDN에서 불러온다.
     본문 index.html 자체는 서비스워커가 접속할 때마다 새로 받아오지만(sw.js
     network-first 전략), 이 폰트 파일은 별도 출처라 브라우저가 평소 캐시
     규칙대로 오래 캐싱해준다 — 그래서 base64로 파일 자체를 심지 않고
     CDN 주소만 참조한다(안 그러면 페이지 열 때마다 폰트 용량까지 매번
     다시 받게 됨). 못 받아오면 기존 폰트로 자연스럽게 대체된다. */
  @font-face{
    font-family:'Binggre';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Binggrae.woff') format('woff');
    font-weight:normal;font-display:swap;
  }
  @font-face{
    font-family:'Binggre';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/Binggrae-Bold.woff2') format('woff2');
    font-weight:700;font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  :root{ --plum:#8B6E9E; }

  /* 폰을 가로로 들어도 화면은 항상 세로로 유지 (manifest orientation:portrait
     가 안 먹는 상황 — 설치 안 하고 그냥 브라우저 탭으로 쓰는 경우 등 — 을 대비한
     확실한 방법. 실제로 가로로 들었을 때만 화면 전체를 90도 반대로 돌려서
     그대로 세로처럼 보이게 함).
     주의: 예전엔 CSS @media(orientation:landscape)로만 판단했는데, 이건
     화면(뷰포트) 가로세로 "비율"만 보기 때문에 키보드가 올라와 보이는 영역이
     좁아지기만 해도(실제 폰은 그대로 세로인데) 잘못 landscape로 인식해
     화면 전체가 돌아가 버리는 문제가 있었다. 그래서 실제 기기 방향을 아는
     JS(screen.orientation 등, 키보드에 영향받지 않음)로 이 클래스를 직접 켜고 끈다. */
  html.rot90:not(.tvmode){
    transform:rotate(-90deg);
    transform-origin:left top;
    width:100vh;height:100vw;
    overflow-x:hidden;
    position:absolute;
    top:100%;left:0;
  }
  body{
    font-family:'Binggre','Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    /* 원래 배경(#FFF9F1)보다 살짝 어둡게(#F5ECDD) 한 뒤, 거기서 10% 더 어둡게 */
    background:#D1C7B7;color:#3E3348;
    -webkit-user-select:none;user-select:none;
  }
  /* ── 아쿠아 버튼 ──
     위쪽 절반은 밝게 빛나고 아래쪽은 진한, 유리알 같은 입체 버튼.
     가짜 요소(::before) 대신 배경을 두 겹으로 깔아 글자가 항상 위에 오게 한다.
     (첫 겹 = 하이라이트 광택, 둘째 겹 = 실제 색) */
  /* 광택 덩어리는 테두리 안쪽에 떠 있는 별도의 둥근 판으로 만든다.
     isolation:isolate 로 쌓임 맥락을 만들고 광택을 z-index:-1 로 두면
     "버튼 배경 위 · 글자 아래"에 정확히 놓인다. */
  .go, .sub{ position:relative; isolation:isolate; }
  .go::before, .sub::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:4px;height:46%;
    border-radius:20px 20px 50% 50% / 16px 16px 18px 18px;
    transition:opacity .12s ease;
  }

  .go{
    font-family:inherit;font-size:18px;font-weight:800;width:100%;
    padding:18px;border-radius:26px;cursor:pointer;color:#fff;
    /* 아이콘·글자를 flex로 가운데 정렬(.tile 과 같은 방식) —
       예전엔 vertical-align 으로 눈대중 맞췄는데 아이콘·글자 크기가
       달라 높이가 살짝 어긋나 보였다 */
    display:flex;align-items:center;justify-content:center;
    border:2px solid #614878;
    background:linear-gradient(180deg,#8e6ea6 0%,#7a5b90 52%,#9a78b0 84%,#c2a4d3 100%);
    /* 바깥 그림자 진하기는 다른 버튼들(.sub/.tile)과 똑같이 맞춘다 —
       예전엔 이 버튼만 유독 더 짙어서 유독 도드라져 보였다 */
    box-shadow:
      0 5px 12px rgba(74,59,87,.20),
      inset 0 -3px 9px rgba(255,255,255,.30),
      inset 0 2px 4px rgba(0,0,0,.22);
    text-shadow:0 1px 2px rgba(0,0,0,.42);
  }
  .go::before{
    background:linear-gradient(180deg,
      rgba(255,255,255,.94) 0%, rgba(255,255,255,.58) 55%, rgba(255,255,255,.16) 100%);
  }

  .sub{
    font-family:inherit;font-size:18px;font-weight:700;width:100%;
    padding:18px;border-radius:26px;cursor:pointer;color:#212121;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #225977;
    background:linear-gradient(180deg,#63bbe8 0%,#35a6de 52%,#6dc6e9 84%,#a1d7f2 100%);
    box-shadow:
      0 5px 12px rgba(74,59,87,.20),
      inset 0 -3px 8px rgba(255,255,255,.85),
      inset 0 2px 3px rgba(139,110,158,.14);
  }
  .sub::before{
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.78) 55%, rgba(255,255,255,.28) 100%);
  }
  /* "태블릿 연결됨 ✓ ABCDEF"처럼 상태에 따라 길어지는 글자가, 시스템 글자 크게
     설정에서 줄바꿈되며 버튼이 여러 줄로 깨지는 것을 막는다(.tile 과 같은 처리) */
  .sub .tlabel{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  /* 버튼 아이콘은 글자 크기와 무관하게 항상 같은 크기·같은 폭으로 (줄 맞춤) */
  .ico{
    display:inline-block;width:1.5em;margin-right:.15em;
    font-size:20px;line-height:1;text-align:center;
    font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  }
  /* ── 자주 안 쓰는 보조 버튼들을 아이콘 타일로 묶는다 ──
     "카메라로 찍기"처럼 짧은 글자와 "주소 복사 (봉사자에게 전달)"처럼 긴 글자가
     같은 폭의 알약 버튼에 나란히 있으면 아이콘 시작 위치가 버튼마다 들쭉날쭉해
     보인다. 정사각형에 가까운 타일 4개를 2x2로 묶으면 글자 길이와 무관하게
     항상 가지런하다. (자주 쓰는 "카메라로 찍기"와, 상태 글자가 길어지는
     "태블릿 연결"은 그대로 위아래에 넓은 버튼으로 둔다) */
  #quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    font-family:inherit;font-weight:700;color:#212121;cursor:pointer;
    border:2px solid #419776;border-radius:22px;
    background:linear-gradient(180deg,#a0e8cc 0%,#7dd8b0 52%,#a8ecd0 84%,#dbf7e8 100%);
    box-shadow:
      0 5px 12px rgba(74,59,87,.20),
      inset 0 -3px 8px rgba(255,255,255,.85),
      inset 0 2px 3px rgba(139,110,158,.14);
    position:relative;isolation:isolate;
    display:flex;flex-direction:row;align-items:center;justify-content:center;
    /* .go/.sub 와 높이·글자 크기를 맞춘다(패딩은 좁은 타일 폭에 맞춰 그대로 둠) */
    gap:8px;padding:18px 10px;min-height:64px;text-align:center;text-decoration:none;
    /* 그리드 칸(min-width:auto 기본값)은 white-space:nowrap 글자가 길어지면
       줄이 안 꺾이니 그 길이만큼 억지로 늘어나 버린다(예: 복사 확인 문구).
       min-width:0 으로 그 자동 최소폭을 꺼서 칸 너비 안에서만 움직이게 한다 */
    min-width:0;
    transition:transform .07s ease, background-color .12s ease,
               border-color .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .tile::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:4px;height:46%;
    border-radius:18px 18px 50% 50% / 14px 14px 16px 16px;
    transition:opacity .12s ease;
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.78) 55%, rgba(255,255,255,.28) 100%);
  }
  .tile .ico{font-size:20px;width:auto;margin-right:0;}
  /* 한 줄로 고정 — 타일이 좁아도 줄바꿈되지 않고 필요하면 말줄임표로 잘린다 */
  .tile .tlabel{
    font-size:18px;font-weight:800;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    min-width:0;   /* flex 자식도 같은 이유로 필요 — 없으면 글자 길이만큼 밀어낸다 */
  }
  .tile:active, .tile.pressing{
    border-color:#277559;transform:scale(.965);
    background:linear-gradient(180deg,#8fd9ba 0%,#6bc79c 55%,#98dcbf 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(39,117,89,.30);
  }
  .tile:active::before, .tile.pressing::before{ opacity:.35; }

  /* 멘트 버튼만 다른 타일과 구분되게 오렌지색으로 */
  .tile.ment{
    border-color:#ab6621;
    background:linear-gradient(180deg,#ffd4a3 0%,#f1a355 52%,#ffcf99 84%,#fdebd3 100%);
  }
  .tile.ment:active, .tile.ment.pressing{
    border-color:#844d15;
    background:linear-gradient(180deg,#f1b87e 0%,#e28432 55%,#f0b375 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(132,77,21,.30);
  }

  /* 갤러리 버튼만 핫핑크로 구분 */
  .tile.gal{
    border-color:#d06299;
    background:linear-gradient(180deg,#ffa3d1 0%,#f391c2 52%,#ff99cc 84%,#fdd3e8 100%);
  }
  .tile.gal:active, .tile.gal.pressing{
    border-color:#84154d;
    background:linear-gradient(180deg,#f17eb8 0%,#ea7bb3 55%,#f075b3 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(132,21,77,.30);
  }

  /* 앱 주소 버튼 — 다른 봉사자에게 공유할 때만 가끔 쓰는 기능이라, 큰
     타일 대신 제목 옆에 작은 아이콘 버튼 하나로 뒀다(항상 큰 자리를
     차지하지 않게). */
  #homeTop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  /* 다른 버튼들과 같은 유리알 아쿠아 스타일(위는 밝은 광택, 아래는 진한 색)을
     작은 원 버튼에도 적용한다. 앱 배경(#D1C7B7, 따뜻한 베이지)과 뚜렷이
     구분되도록 색은 청록(아쿠아) 계열로 골랐다. */
  #bCopyUrl{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    position:relative;isolation:isolate;
    border:1.5px solid #0e7a6c;
    background:linear-gradient(180deg,#7de8dc 0%,#2bc4b2 52%,#5ed9c8 84%,#a8f0e4 100%);
    box-shadow:
      0 3px 8px rgba(60,45,72,.28),
      inset 0 -2px 5px rgba(255,255,255,.55),
      inset 0 1px 2px rgba(0,0,0,.16);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  #bCopyUrl::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:3px;height:44%;border-radius:50%;
    background:linear-gradient(180deg,
      rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 60%, rgba(255,255,255,.1) 100%);
  }
  #bCopyUrl:active{
    border-color:#095148;
    background:linear-gradient(180deg,#5ed9c8 0%,#1fa898 55%,#4fcabb 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 4px 8px rgba(9,81,72,.30);
  }
  #bCopyUrl:active::before{opacity:.4;}

  /* "사진 카톡 전송" 버튼만 골드/머스터드로 구분 — 이 색은 밝은 편이라
     .go(카메라 버튼)의 흰 글자 대신 어두운 글자로 바꾼다. 눌림 효과는
     .go:active 의 brightness 필터를 그대로 재사용(별도 정의 불필요) */
  .go.share{
    border-color:#c18d15;
    background:linear-gradient(180deg,#eec463 0%,#e9b335 52%,#edc15a 84%,#f5dca3 100%);
    color:#212121;
    text-shadow:none;
  }

  #tvRow{display:grid;grid-template-columns:1fr;gap:12px;}
  #tvRow>button{width:auto;min-width:0;}

  /* "카메라로 찍기" 바로 밑에 뜨는 멘트 한 줄 — 탭하면 다른 멘트로 바뀐다 */
  #mentLine{
    display:block;width:100%;margin-top:8px;font-size:20px;font-weight:700;color:#614878;
    font-family:inherit;background:none;border:none;appearance:none;-webkit-appearance:none;
    text-align:center;cursor:pointer;padding:4px 10px;line-height:1.4;
    user-select:none;-webkit-user-select:none;
  }
  #mentLine:active{opacity:.6;}

  /* ── 버튼 눌림 효과 ──
     맨 위에서 -webkit-tap-highlight-color 를 껐기 때문에 폰에서 눌러도
     아무 반응이 없었다. 눌린 느낌을 직접 만들어 준다.
     .pressing 은 자바스크립트가 붙여 주는 것(짧게 탭해도 확실히 보이게),
     :active 는 마우스로 누르고 있는 동안의 상태. */
  button{
    transition:transform .07s ease, background-color .12s ease,
               border-color .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  button:active, button.pressing{
    transform:scale(.965);
  }
  /* 눌리면 광택이 죽고 안쪽으로 쑥 들어간 느낌 */
  .go:active::before, .go.pressing::before,
  .sub:active::before, .sub.pressing::before{ opacity:.35; }
  .go:active, .go.pressing{
    filter:brightness(.88) saturate(1.08);
    box-shadow:
      0 1px 3px rgba(60,45,72,.34),
      inset 0 5px 13px rgba(0,0,0,.36);
  }
  .sub:active, .sub.pressing{
    border-color:#15415a;
    background:linear-gradient(180deg,#4fb4e2 0%,#309bd5 55%,#5bbce5 100%);
    box-shadow:
      0 1px 3px rgba(74,59,87,.18),
      inset 0 5px 11px rgba(21,65,90,.30);
  }
  /* 어두운 배경 위의 버튼들(태블릿 확대 막대) */
  #tvZoom button:active, #tvZoom button.pressing{
    background:rgba(255,255,255,.42);color:#111;
  }

  /* ── 첫 화면 ── */
  #home{
    height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    /* 세로 스크롤은 브라우저 기본 동작에 맡기고, 가로 방향은 자바스크립트가
       직접 스와이프로 해석한다. 이걸 안 하면 브라우저가 가로로 끄는 손짓을
       자기 나름대로(뒤로가기 제스처 등) 가로채서 pointerup 이 끝까지
       안 오고 도중에 취소돼 버린다. */
    touch-action:pan-y;
  }
  #home h1{font-size:22px;font-weight:800;margin-bottom:2px;}
  #home .hint{font-size:13.5px;color:#9b8fa6;line-height:1.65;}

  /* 첫 화면 진입 애니메이션 — 버튼이 아래서 위로 톡톡 튀듯 순서대로 나타난다.
     .enter 는 처음 여섯 개 버튼에만 붙어 있어서(HTML 참고), 나중에 사진 찍고
     나서 나타나는 "전체 카톡 공유" 버튼 등은 영향받지 않는다. */
  @keyframes popIn{
    0%{ opacity:0; transform:translateY(20px) scale(.92); }
    65%{ opacity:1; transform:translateY(-3px) scale(1.015); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .enter{ animation:popIn .46s cubic-bezier(.22,1,.36,1) both; }
  #home h1{ animation:popIn .4s cubic-bezier(.22,1,.36,1) both; }
  #todayWrap{display:none;flex-direction:column;gap:8px;}
  #todayWrap.show{display:flex;}
  #todayWrap label{font-size:14px;font-weight:700;color:#8B6E9E;}
  #todayHead{display:flex;align-items:center;justify-content:space-between;}
  /* 자주 쓰는 버튼이 아니라 실수로 잘 안 눌리게 글자 링크로만 두되, 폰트
     자체는 옆의 라벨과 완전히 같게(버튼 기본 글꼴이 따로 적용되지 않도록
     font-family 를 명시적으로 물려받는다) */
  #bClearAll{background:none;border:none;padding:2px 4px;font-family:inherit;font-size:14px;font-weight:700;color:#8B6E9E;cursor:pointer;}
  #todayThumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;}
  #todayThumbs::-webkit-scrollbar{display:none;}
  #todayThumbs img{
    width:52px;height:52px;object-fit:cover;border-radius:8px;
    flex:0 0 auto;border:1px solid #e3d8c8;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #todayThumbs img:active{ transform:scale(.9); }
  #todayThumbs img.sending{
    animation:tvPulse .7s ease-in-out infinite;
    border-color:#8B6E9E;
  }
  @keyframes tvPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(139,110,158,.55); }
    50%{ box-shadow:0 0 0 5px rgba(139,110,158,0); }
  }

  /* ── 사진 + 이름 입력 화면 ── */
  #editor{
    position:fixed;inset:0;z-index:50;display:none;background:#000;flex-direction:column;
  }
  #editor.on{display:flex;}
  /* 여러 장을 골랐다가 마음이 바뀌었을 때, 남은 사진을 하나씩 넘기지 않고
     한 번에 전부 취소하고 처음 화면으로 돌아가는 버튼(썸네일 삭제 버튼과
     같은 자리·모양) */
  #edCancelBtn{
    position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;z-index:2;
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(0,0,0,.55);color:#fff;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:.85;
  }
  #edCancelBtn:active{opacity:1;background:rgba(0,0,0,.75);}
  /* 사진은 보여주지 않는다 — 화면을 앱 색감의 은은한 배경으로 채운다.
     이 배경(입력판 바깥 영역)을 탭하면 저장하지 않고 닫힌다. */
  #edStage{
    position:relative;flex:1;overflow:hidden;cursor:pointer;
    background:linear-gradient(160deg,#3a2c47 0%,#241a2e 60%,#160f1c 100%);
    touch-action:none;   /* 오른쪽 끌기를 JS로 직접 처리 — 없으면 브라우저 자체
                             제스처(엣지 스와이프 등)가 먼저 가로채 버린다 */
  }
  /* 입력·저장 패널을 화면 한가운데에 둔다.
     아래쪽에 있으면 폰을 한 손으로 들고 섬기는 현장에서 엄지가 닿지 않고,
     키보드가 올라오면 가려져버렸다. 사진이 비치도록 반투명으로 띄운다. */
  #edBottom{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(94%,440px);z-index:2;
    /* 자판까지 펼쳐지면 작은 화면에선 넘칠 수 있으니 안전장치 */
    max-height:calc(100% - 20px);overflow-y:auto;
    display:flex;flex-direction:column;gap:9px;
    padding:14px;border-radius:20px;
    /* 입력칸·버튼은 각자 불투명하므로, 판 자체는 옅게 해서
       뒤의 얼굴이 최대한 비쳐 보이게 한다 */
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 10px 34px rgba(0,0,0,.45);
  }
  /* 이름·전화번호 사이 여백은 아래 다시찍기·저장 사이(#edActions)와 같은 8px */
  #edBottom .row{display:flex;gap:8px;}
  #edBottom input{
    font-size:20px;padding:12px 14px;border-radius:12px;border:none;
    background:rgba(255,255,255,.95);color:#111;font-weight:800;
    width:100%;font-family:inherit;
  }
  /* 전화번호 칸은 "010-1234-5678"까지 들어가야 해서 좀 더 넓게,
     이름 칸은 그만큼 살짝 좁게 — 안 그러면 맨 앞자리(0)가 잘려 보였다.
     전화번호는 글자를 살짝 줄이고 가운데 정렬해서 항상 다 보이게 한다. */
  /* 아래 다시찍기·저장 버튼과 세로줄이 정확히 맞아야 해서, 비율(flex:0.85
     /1.15)이 아니라 폭을 직접 지정한다 — 비율로 두면 버튼 쪽만 어긋난다.
     버튼은 안쪽 여백·테두리가 34px 있는데, flex-basis:0 이면 그 34px 을
     먼저 떼어놓고 남은 자리만 비율로 나눠서 입력칸과 다르게 갈린다.
     폭을 직접 주면 여백·테두리를 포함한 값이라 양쪽이 똑같아진다.
     (42.5% / 57.5% 는 원래 비율, 빼는 값은 사이 여백 8px 를 나눈 몫) */
  #edNameWrap, #edAgain{flex:0 0 calc(42.5% - 3.4px);}
  #edTelWrap,  #edSave {flex:0 0 calc(57.5% - 4.6px);}
  #edNameWrap{position:relative;display:flex;}
  #edTelWrap{position:relative;display:flex;}
  /* #edBottom input 규칙(20px)보다 확실히 우선하도록 특정도를 높인다.
     "010-0000-0000" 열세 글자가 끝까지 다 보여야 해서 글자를 조금 줄이고,
     마이크가 왼쪽으로 간 뒤로 쓸모없어진 오른쪽 여백도 줄여 폭을 벌었다. */
  #edBottom #edTel{font-size:15px;letter-spacing:-.2px;text-align:center;padding-right:8px;}
  #edTelWrap.hasMic #edTel{padding-left:36px;}
  /* 아주 좁은 폰(320px대)에서는 이 크기로도 뒷자리가 잘린다 — 번호가 한 자
     빠진 걸 못 보고 지나칠 수 있어서, 그런 화면에서만 더 줄인다. */
  @media (max-width:340px){
    #edBottom #edTel{font-size:12.5px;}
    #edTelWrap.hasMic #edTel{padding-left:34px;}
  }
  /* 마이크 버튼(안드로이드에서만 나타남)이 글자와 안 겹치게 각 칸 왼쪽에
     자리를 비워둔다 — 버튼이 없는(아이폰) 경우엔 이 여백도 필요 없다. */
  #edNameWrap.hasMic #edName, #edTelWrap.hasMic #edTel{padding-left:38px;}
  #edMic, #edTelMic{
    position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border:none;border-radius:50%;padding:0;
    background:transparent;font-size:16px;line-height:1;color:#555;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  #edMic[hidden], #edTelMic[hidden]{display:none;}
  #edMic.listening, #edTelMic.listening{background:#e0433c;color:#fff;animation:edMicPulse 1s ease-in-out infinite;}
  @keyframes edMicPulse{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
  /* 아래 저장/다시찍기 버튼도 위 입력칸과 같은 비율·간격으로 나눠서
     세로 경계선이 서로 정확히 맞춰 정렬되게 한다 */
  #edActions{display:flex;gap:8px;}
  #edActions>button{padding:15px;border-radius:12px;font-size:16px;width:auto;}
  /* 판이 옅어졌으므로 이 글자만 그림자로 대비를 확보한다 */
  #edHint{color:#fff;font-size:12.5px;text-align:center;opacity:.95;min-height:16px;
          text-shadow:0 1px 3px rgba(0,0,0,.9);}

  /* ── 앱이 직접 그리는 한글 자판 ──
     이름 적는 데 필요한 자모·공백·지움만 둔다. 숫자줄, 특수문자, 한영전환
     같은 건 아예 없어서 잘못 누를 일이 없다.
     천지인 방식 — 왼쪽 3칸은 자음, 오른쪽 2칸은 모음이다. 오른쪽 안쪽 줄은
     천지인 조각(ㅣ·ㆍ·ㅡ), 바깥쪽 줄은 자주 쓰는 모음(ㅏ·ㅓ·ㅗ·ㅜ)을 한 번에
     넣는 키다 — 두 번 눌러야 했던 ㅓ 같은 게 한 번에 들어간다.
     한 줄에 5개라 키가 68px로, 두벌식 10키(33px)의 두 배가 넘는다.
     화면 아래에 폭을 꽉 채워 붙인다(입력판 안에 넣으면 그만큼 좁아진다). */
  #kbd{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    display:flex;flex-direction:column;gap:10px;   /* 줄 사이 여백 */
    padding:10px 5px calc(10px + env(safe-area-inset-bottom));
    background:rgba(30,24,38,.97);
    box-shadow:0 -4px 14px rgba(0,0,0,.45);
    /* 실제 폰에서 손가락을 붙인 채 끌면, 이게 없으면 브라우저가 그 움직임을
       스크롤로 가로채면서 pointercancel 을 던진다 — 그 순간 붙잡아 둔 손가락을
       놓쳐서 "꾹 눌러 판을 펼친 뒤 끌어서 고르기"가 통째로 안 먹혔다.
       (합성 이벤트로 하는 시험에서는 브라우저가 안 가로채서 안 드러났다) */
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;   /* 꾹 누를 때 뜨는 기본 메뉴·글자선택 막기 */
  }
  #kbd[hidden]{display:none;}
  /* 칸 수가 줄어든 줄(맨 아랫줄)도 위 줄과 세로줄이 정확히 맞아야 해서
     flex 가 아니라 5칸 그리드로 깐다 — flex 로 하면 그 줄만 사이 간격이
     하나 적어서 키가 미세하게 넓어지고 ㅜ 가 ㅗ 밑에서 어긋난다. */
  /* 10칸으로 깔고 글자키는 2칸씩 쓴다(= 한 줄 5개). 맨 아랫줄만 3칸짜리
     버튼을 섞어 1.5칸 폭을 낼 수 있게 하려는 것. */
  .kbRow{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .kbRow>*{grid-column:span 2;}
  #kbd .kbW3{grid-column:span 3;}
  /* 키도 위 버튼들과 같은 아쿠아(유리알) 스타일 — 배경은 위가 밝고 아래가
     진한 그라데이션, 그 위에 ::before 광택판을 z-index:-1 로 띄운다.
     (.go/.sub 와 같은 방식이라 화면 전체가 한 결로 보인다) */
  #kbd button{
    position:relative;isolation:isolate;
    min-width:0;height:56px;padding:0;
    border-radius:14px;
    font-family:'Malgun Gothic',sans-serif;
    font-size:23px;font-weight:800;letter-spacing:1px;
    cursor:pointer;
  }
  #kbd button::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:4px;right:4px;top:3px;height:44%;
    border-radius:12px 12px 50% 50% / 9px 9px 13px 13px;
    background:linear-gradient(180deg,
      rgba(255,255,255,.96) 0%, rgba(255,255,255,.58) 56%, rgba(255,255,255,.14) 100%);
    transition:opacity .12s ease;
  }
  #kbd button:active{filter:brightness(.9);}
  #kbd button:active::before{opacity:.3;}
  /* 줄 사이 여백은 자판 묶음(#kbdCJ/#kbdQW)이 직접 준다 — #kbd 의 gap 은
     두 자판 묶음 사이에만 적용돼서, 줄과 줄 사이는 붙어버렸었다. */
  #kbdCJ,#kbdQW,#kbdQC{display:flex;flex-direction:column;gap:10px;}
  #kbdCJ[hidden],#kbdQW[hidden],#kbdQC[hidden]{display:none;}
  /* 원래 두벌식 — 한 줄 10칸이라 그리드 대신 flex 로 깔고, 줄마다 칸 수가
     달라도 각 줄이 폭을 꽉 채우게 둔다. */
  .qwoRow{display:flex;gap:4px;}
  .qwoRow2{padding:0 5%;}   /* 9칸 줄을 반 칸씩 들여쓰기 */
  #kbdQW button{flex:1 1 0;height:58px;font-size:21px;}
  /* 자음·모음 글자 크기를 같게 — 아래쪽 공통 규칙(#kbd .kbVowel, 27px)이
     특정도가 같으면서 더 뒤에 있어 모음만 커져 보였다. #kbd 를 앞에 붙여
     특정도를 올려서 이 값이 이기게 한다. */
  #kbd #kbdQW .kbVowel{font-size:21px;}
  #kbdQW .kbFn{font-size:18px;}
  #kbdQW .qwoWide{flex:1.45 1 0;font-size:18px;}
  #kbdQW .qwoNext{flex:1.4 1 0;}
  #kbdQW .qwoBack{flex:1 1 0;}
  #kbdQW button[data-fn="shift"].on{
    border-color:#8a6410;color:#42300a;
    background:linear-gradient(180deg,#ffe6a8 0%,#efa837 52%,#f6c463 84%,#ffeec2 100%);
    text-shadow:none;
  }
  /* 왼쪽 4칸 자음 · 오른쪽 3칸 모음 = 한 줄 7칸. 7칸 그리드로 깔아 줄마다
     세로줄이 정확히 맞는다. */
  .qwRow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  /* 키를 꾹 눌렀을 때 뜨는 고르기 판 — 그 키가 낼 수 있는 글자를 다 펼쳐
     보여줘서, 몇 번 눌러야 하는지 세지 않고 바로 찍어 넣을 수 있다. */
  #kbPop{
    position:absolute;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:7px;
    border-radius:16px;background:rgba(30,21,10,.98);
    border:1.5px solid rgba(242,181,68,.55);
    box-shadow:0 8px 22px rgba(0,0,0,.62);
  }
  #kbPop[hidden]{display:none;}
  #kbd #kbPop button{width:50px;height:58px;font-size:26px;transition:transform .08s ease;}
  /* 성씨 줄과 자모 줄 사이를 강제로 끊는다. 폭에 맡겨 두면 "도 동 두 태 ㄷ ㄸ /
     ㅌ" 처럼 두 무리가 섞여 접힌다. */
  #kbPop .kbPopBreak{flex-basis:100%;height:0;padding:0;margin:0;border:0;background:none;}
  /* 성씨는 통글자라 자모와 다른 것임이 한눈에 보여야 한다 — 같은 아쿠아
     결을 지키되 색만 녹색으로 나눈다. */
  #kbPop .kbPickSur{
    border:1.5px solid #2f6b46;color:#0d2a1a;
    background:linear-gradient(180deg,#ddf6e7 0%,#79c294 52%,#a3daba 84%,#e9faf0 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.5),
               inset 0 -2px 6px rgba(255,255,255,.85), inset 0 2px 3px rgba(25,80,50,.22);
  }
  /* 좁은 폰에서는 성씨 여섯 칸이 화면을 넘쳐서 조금 줄인다 */
  @media (max-width:374px){
    #kbd #kbPop button{width:40px;height:52px;font-size:22px;}
  }
  /* 자판의 어떤 키와도 다른 호박색 — 고르는 판이라는 게 한눈에 보인다
     (자음=푸른색, 모음=상아색, 기능키=보라색과 확실히 구분된다) */
  #kbPop .kbPick{
    border:1.5px solid #8a5a0e;color:#3a2705;
    background:linear-gradient(180deg,#ffeab5 0%,#f2b544 52%,#f8d078 84%,#fff4d6 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.5),
               inset 0 -2px 6px rgba(255,255,255,.85), inset 0 2px 3px rgba(140,95,20,.22);
  }
  /* 끌면서 지금 짚고 있는 글자 — 호박색 위에서 잘 보이게 청록 테두리 */
  #kbPop button.hot{
    transform:translateY(-3px);
    box-shadow:0 0 0 3px #17a08f, 0 7px 16px rgba(0,0,0,.55);
  }
  /* 세 줄뿐이라 키를 훨씬 높게 잡을 수 있다 */
  #kbdQC button{
    min-width:0;height:70px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1;
  }
  #kbdQC b{font-size:27px;font-weight:800;}
  /* 거듭 눌러 나오는 글자는 작게 — 키가 뭘 낼 수 있는지 한눈에 보인다.
     ㅅ 키는 네 글자(ㅈㅊㅆㅉ)가 붙어서 320px 폰에서는 키 폭과 딱 맞아
     떨어졌다. 자간을 살짝 좁혀 여유를 둔다 — 11px 글자라 티가 안 난다. */
  #kbdQC i{font-style:normal;font-size:11px;font-weight:700;
           opacity:.58;margin-top:4px;letter-spacing:-.4px;
           max-width:100%;overflow:hidden;}
  #kbdQC .kbFn{font-size:19px;}
  #kbdQC .qwW2{grid-column:span 2;}
  #kbdQC .qwW3{grid-column:span 3;}
  #kbdQC .qwW5{grid-column:span 5;}
  /* 자판 고르기 — 이름 칸 바로 위 */
  /* 자판 고르기와 이름 칸 사이는 넉넉히 띄운다 — 판의 기본 간격 9px 에
     27px 를 더해 36px(원래의 4배). 자판 종류를 고르는 줄과 실제로 적는
     줄이 확실히 구분된다. */
  #kbdPick{display:flex;gap:10px;justify-content:center;margin-bottom:27px;}
  #kbdPick button{
    position:relative;isolation:isolate;
    flex:0 0 auto;padding:11px 26px;border-radius:999px;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.30);
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.05));
    color:#e9e2f3;
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:1px;
    box-shadow:0 2px 6px rgba(0,0,0,.30), inset 0 1px 1px rgba(255,255,255,.25);
  }
  #kbdPick button::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:3px;height:44%;border-radius:999px;
    background:linear-gradient(180deg,
      rgba(255,255,255,.85) 0%, rgba(255,255,255,.35) 60%, rgba(255,255,255,0) 100%);
    opacity:.35;transition:opacity .12s ease;
  }
  #kbdPick button.on{
    border-color:#0f7768;color:#06322c;
    background:linear-gradient(180deg,#9aeadd 0%,#2fbaa8 52%,#66d5c5 84%,#b6f2ea 100%);
    box-shadow:0 3px 9px rgba(0,0,0,.34),
               inset 0 -2px 6px rgba(255,255,255,.75), inset 0 2px 3px rgba(10,90,80,.18);
  }
  #kbdPick button.on::before{opacity:1;}
  #kbdPick button:active{filter:brightness(.92);}
  /* 자음 = 푸른 유리, 모음 = 따뜻한 상아색 유리, 기능키 = 보라 유리 */
  #kbd .kbCons{
    border:1.5px solid #2c4d68;color:#0e1e2b;
    background:linear-gradient(180deg,#dcecfa 0%,#7fa8cc 52%,#a4c6e2 84%,#e6f3ff 100%);
    box-shadow:0 3px 8px rgba(10,18,30,.5),
               inset 0 -2px 7px rgba(255,255,255,.85), inset 0 2px 4px rgba(20,45,72,.28);
  }
  #kbd .kbVowel{
    border:1.5px solid #715a2c;color:#2e2410;font-size:27px;
    background:linear-gradient(180deg,#fbf3dd 0%,#d9b76a 52%,#e9d2a0 84%,#fdf8ea 100%);
    box-shadow:0 3px 8px rgba(10,18,30,.5),
               inset 0 -2px 7px rgba(255,255,255,.85), inset 0 2px 4px rgba(95,74,32,.28);
  }
  #kbd .kbFn{
    border:1.5px solid #493a61;color:#fff;
    font-size:17px;font-weight:800;letter-spacing:0;
    background:linear-gradient(180deg,#a698c0 0%,#786697 52%,#9080b0 84%,#c3b6d9 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.42),
               inset 0 -2px 6px rgba(255,255,255,.35), inset 0 2px 3px rgba(0,0,0,.24);
    text-shadow:0 1px 2px rgba(0,0,0,.45);
  }
  #kbd .kbNext{
    border-color:#0f7768;color:#06322c;text-shadow:none;
    background:linear-gradient(180deg,#9aeadd 0%,#2fbaa8 52%,#66d5c5 84%,#b6f2ea 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.42),
               inset 0 -2px 6px rgba(255,255,255,.75), inset 0 2px 3px rgba(10,90,80,.20);
  }
  /* 전체를 지우는 키만 붉은 계열로 — 눌러도 되는 키와 한눈에 구분된다 */
  #kbd .kbClear{
    border-color:#6d3746;color:#fff;
    background:linear-gradient(180deg,#d3a3b0 0%,#9c5f70 52%,#b87f8e 84%,#e0b9c3 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.42),
               inset 0 -2px 6px rgba(255,255,255,.40), inset 0 2px 3px rgba(0,0,0,.24);
  }
  /* ── 전화번호용 숫자판(아쿠아) ── */
  #kbdNum{display:flex;flex-direction:column;gap:10px;}
  #kbdNum[hidden]{display:none;}
  .numRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  #kbdNum button{height:66px;font-size:28px;letter-spacing:2px;}
  /* 숫자마다 무지개 색을 하나씩 준다 — 자리를 색으로 기억하게 되고,
     눌린 숫자가 뭔지도 한눈에 보인다. 색만 다를 뿐 유리알 만드는 방식은
     다른 키와 같다(위는 밝게, 가운데는 진하게, 아래로 다시 밝게). */
  #kbdNum .kbNum{
    border:1.5px solid var(--kBd);color:var(--kTx);
    background:linear-gradient(180deg,var(--kA) 0%,var(--kB) 52%,var(--kC) 84%,var(--kD) 100%);
    box-shadow:0 3px 7px rgba(10,18,30,.42),
               inset 0 -2px 6px rgba(255,255,255,.75), inset 0 2px 3px rgba(0,0,0,.13);
    text-shadow:0 1px 1px rgba(255,255,255,.55);
  }
  #kbdNum [data-n="1"]{--kA:#ffe8e5;--kB:#f1968f;--kC:#f4ada6;--kD:#fff2f0;--kBd:#b8564d;--kTx:#5a1e19;}
  #kbdNum [data-n="2"]{--kA:#fff0e0;--kB:#f5b77c;--kC:#f8c592;--kD:#fff7ee;--kBd:#b87c3c;--kTx:#5a3510;}
  #kbdNum [data-n="3"]{--kA:#fff7dd;--kB:#f4ce71;--kC:#f7d989;--kD:#fffbee;--kBd:#b08a30;--kTx:#54400c;}
  #kbdNum [data-n="4"]{--kA:#f0fada;--kB:#bad97b;--kC:#c9e491;--kD:#f8fdec;--kBd:#7d9b40;--kTx:#35470f;}
  #kbdNum [data-n="5"]{--kA:#e4faec;--kB:#7ed1a1;--kC:#94ddb3;--kD:#f2fdf6;--kBd:#3f9464;--kTx:#154529;}
  #kbdNum [data-n="6"]{--kA:#e2faf6;--kB:#76d0c7;--kC:#8edcd4;--kD:#f1fdfb;--kBd:#3a9389;--kTx:#0f4540;}
  #kbdNum [data-n="7"]{--kA:#e6f5fd;--kB:#7cc4e7;--kC:#92d3ef;--kD:#f2fbff;--kBd:#3a86ab;--kTx:#0e3d52;}
  #kbdNum [data-n="8"]{--kA:#eaeffd;--kB:#8fa6e7;--kC:#a5b8ef;--kD:#f5f8ff;--kBd:#5069ac;--kTx:#1e2d5c;}
  #kbdNum [data-n="9"]{--kA:#efebfd;--kB:#a694e6;--kC:#b8aaed;--kD:#f8f6ff;--kBd:#6553a4;--kTx:#2b1f57;}
  #kbdNum [data-n="0"]{--kA:#fdeaf7;--kB:#df8dc7;--kC:#e8a3d4;--kD:#fef5fb;--kBd:#a25287;--kTx:#511c3f;}
  #kbdNum .kbFn{font-size:20px;letter-spacing:0;}
  /* 화면이 아주 짧은 기기에서는 자판을 조금 낮춰 입력판이 위로 잘리지 않게 */
  @media (max-height:620px){
    #kbd button{height:47px;font-size:20px;}
    #kbd .kbVowel{font-size:23px;}
    #kbd .kbFn{font-size:15px;}
    #kbdNum button{height:55px;font-size:24px;}
    #kbdQW button{height:47px;font-size:18px;}
    #kbd #kbdQW .kbVowel{font-size:18px;}
    #kbdQW .kbFn{font-size:15px;}
    #kbdQW .qwoWide{font-size:15px;}
    #kbdQC button{height:46px;}
    #kbdQC b{font-size:20px;}
    #kbdQC i{font-size:10px;margin-top:1px;}
    #kbdQC .kbFn{font-size:16px;}
    .qwRow,.qwoRow{gap:4px;}
    #kbd{gap:5px;}
    .kbRow{gap:5px;}
  }
  /* 폭이 좁은 폰에서는 ㅅ 키의 작은 글자 넉 자(ㅈㅊㅆㅉ)가 키보다 넓어져
     끝의 ㅉ 이 잘렸다(320px 에서 42.4px vs 키 안쪽 38px). 좁을 때만 줄인다. */
  @media (max-width:374px){
    #kbdQC i{font-size:9px;}
  }

  /* ── 촬영 멘트 모음 (전체 보기) ── */
  #mentModal{
    position:fixed;inset:0;z-index:70;display:none;
    background:rgba(20,15,25,.72);backdrop-filter:blur(2px);
  }
  #mentModal.on{display:block;}
  #mentModalInner{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(92%,480px);max-height:82vh;overflow-y:auto;
    background:#FFF9F1;border-radius:20px;padding:22px 20px;color:#3E3348;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    scrollbar-width:none;-ms-overflow-style:none;   /* 스크롤은 되지만 막대는 숨김(파이어폭스/구형엣지) */
  }
  #mentModalInner::-webkit-scrollbar{display:none;}  /* 크롬·사파리·안드로이드 */
  #mentModalInner h2{font-size:18px;margin:0 0 12px;text-align:center;}
  #mentModalInner h3{font-size:14px;color:#614878;margin:18px 0 6px;}
  #mentModalInner h3:first-of-type{margin-top:0;}
  #mentModalInner p{margin:5px 0;line-height:1.5;padding:2px 0;}
  #mentModalInner p:active{opacity:.5;}
  .mentRow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mentText{cursor:pointer;flex:1;font-size:15.75px;}
  .mentDel{
    cursor:pointer;color:#a08fae;font-size:20px;line-height:1;
    padding:2px 8px;flex-shrink:0;
  }
  #mentAddRow{display:flex;gap:8px;margin-bottom:14px;}
  #mentNewInput{
    flex:1;min-width:0;padding:10px 12px;border-radius:10px;
    border:1px solid #d8cfc0;font-size:15px;font-family:inherit;
  }
  #mentAddBtn{
    padding:10px 16px;border-radius:10px;border:none;
    background:#614878;color:#fff;font-weight:700;font-size:15px;cursor:pointer;flex-shrink:0;
  }
  #mentClose{
    display:block;width:100%;margin-top:18px;padding:12px;border-radius:14px;
    border:none;background:#614878;color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  }

  /* 오늘 찍은 사진 썸네일 → 전체화면 보기. 확대 안 됐을 때 탭하면 닫힌다.
     핀치줌·끌기는 태블릿 확인 화면과 같은 방식(포인터 이벤트 직접 처리)이라
     터치액션을 꺼서 브라우저 기본 확대/스크롤과 겹치지 않게 한다 */
  /* 열고 닫힐 때: 배경이 페이드인되면서 사진 영역이 살짝 커지며 나타난다.
     #thumbViewImg 자체의 transform 은 핀치줌이 실시간으로 직접 조작하므로
     (JS가 매번 인라인 style 로 덮어씀) 여기에 CSS 트랜지션을 걸면 서로
     부딪힌다 — 그래서 열림 애니메이션은 감싸는 #thumbViewInner 에 준다. */
  #thumbView{
    position:fixed;inset:0;z-index:80;
    background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;
    touch-action:none;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease;
  }
  #thumbView.on{opacity:1;pointer-events:auto;}
  #thumbViewInner{
    width:100%;height:100%;overflow:hidden;
    transform:scale(.92);
    transition:transform .22s cubic-bezier(.22,1,.36,1);
  }
  #thumbView.on #thumbViewInner{transform:scale(1);}
  /* 이전/현재/다음 사진을 옆으로 나란히 두고(전체 폭 300%) 평소엔 가운데
     칸(현재 사진)만 보이게 -33.3333%(=자기 폭의 1/3 = 화면 폭 1칸) 만큼
     당겨둔다. 손가락으로 끄는 동안엔 여기에 픽셀 값을 더해서 옆 사진의
     테두리(이음매)가 손가락을 따라 실시간으로 같이 끌려 나오게 하고,
     손을 떼면 넘어가거나(칸 하나 더 이동) 제자리로 돌아온다(트랜지션).
     드래그하는 동안엔 .dragging 으로 트랜지션을 꺼서 손가락에 바로바로
     반응하게 하고, 넘어가거나 되돌아갈 때만 트랜지션을 켠다. */
  #thumbTrack{
    display:flex;width:300%;height:100%;
    transform:translateX(-33.3333%);
  }
  #thumbTrack.dragging{transition:none;}
  #thumbTrack:not(.dragging){transition:transform .32s cubic-bezier(.22,1,.36,1);}
  .thumbSlot{width:33.3333%;height:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #thumbView img{
    max-width:100%;max-height:100%;object-fit:contain;
    transform-origin:center center;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  #thumbDelBtn{
    position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;z-index:2;
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(0,0,0,.55);color:#fff;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:.85;
  }
  #thumbDelBtn:active{opacity:1;background:rgba(0,0,0,.75);}

  /* 삭제 직후 몇 초간 뜨는 실행취소 알림 — 전체화면 사진 보기(z-index:80)
     보다도 위에 있어야, 스와이프 삭제로 다음 사진이 뜬 직후에도 가려지지
     않고 계속 보인다. */
  #undoToast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));
    transform:translate(-50%,0);z-index:95;
    display:flex;align-items:center;gap:14px;
    background:rgba(20,20,24,.92);color:#fff;
    padding:12px 14px 12px 18px;border-radius:14px;
    font-size:14px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #undoToast.show{opacity:1;pointer-events:auto;}
  #undoBtn{
    background:none;border:none;color:#7dd3fc;font-weight:800;font-size:14px;
    padding:4px 8px;cursor:pointer;white-space:nowrap;
  }

  /* ── 벽걸이 태블릿 확인 화면 (주소 뒤에 #tv 를 붙여서 열기) ── */
  #tv{
    position:fixed;inset:0;z-index:60;display:none;background:#0d0b10;color:#fff;
    flex-direction:column;align-items:center;justify-content:center;padding:3vh 3vw;
  }
  #tv.on{display:flex;}
  #tvDot{position:fixed;top:2vh;right:2.5vw;font-size:1.9vh;color:#6b5f75;}
  #tvIdle{text-align:center;}
  #tvIdle h2{font-size:4.6vh;font-weight:800;margin-bottom:1vh;}
  #tvCode{
    font-size:11vh;font-weight:900;letter-spacing:.1em;color:#BFA7CC;
    font-family:'Malgun Gothic',monospace;margin:2vh 0 1vh;
    /* PC 에서 드래그로 선택·복사할 수 있게 (body 의 선택 금지를 여기서만 해제) */
    -webkit-user-select:text;user-select:text;cursor:pointer;
    border-radius:2vh;padding:0 2vw;transition:background .15s;
  }
  #tvCode:hover{background:rgba(191,167,204,.12);}
  #tvCopied{font-size:2.1vh;color:#9CC7A8;height:2.6vh;margin-bottom:1vh;}
  #tvIdle p{font-size:2.3vh;color:#9b8fa6;line-height:1.8;}
  #tvShow{display:none;flex-direction:column;align-items:center;gap:1vh;width:100%;height:100%;}
  #tvShow.on{display:flex;}
  /* 확대·이동을 위해 사진을 담는 틀 (넘치는 부분은 잘라냄) */
  #tvStage{
    flex:1;min-height:0;width:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;                 /* 핀치·드래그를 직접 처리 */
  }
  #tvImg{
    max-width:100%;max-height:100%;object-fit:contain;border-radius:2vh;
    transform-origin:center center;cursor:zoom-in;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  #tvImg.zoomed{cursor:grab;}
  #tvImg.dragging{cursor:grabbing;}
  #tvZoom{
    display:flex;align-items:center;gap:1.2vh;
    font-size:2.2vh;color:#cfc3d8;
  }
  #tvZoom button{
    font-family:inherit;font-size:2.4vh;font-weight:800;
    min-width:6vh;padding:.6vh 1.6vh;border-radius:1.2vh;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;border:none;
  }
  #tvZoom button:hover{background:rgba(255,255,255,.22);}
  #tvPct{min-width:7vh;text-align:center;font-variant-numeric:tabular-nums;}
  #tvAsk{font-size:2.5vh;color:#9b8fa6;padding-bottom:1vh;}

  /* ── 폰에서 썸네일을 눌러 "크게 보기"로 보낸 사진 ──
     확인용 안내문·여백을 걷어내고 화면 전체를 사진으로 채운다.
     확대 버튼은 없애지 않고 사진 위에 옅게 띄워서 자리를 뺏지 않게 한다. */
  #tv.full{padding:0;}
  #tv.full #tvDot, #tv.full #tvAsk{display:none;}
  #tv.full #tvShow{gap:0;}
  #tv.full #tvImg{border-radius:0;}
  #tv.full #tvZoom{
    /* 사진 하단 16%에는 이름·전화번호가 이미 찍혀 있으므로(compose() 참고)
       확대 버튼을 아래에 두면 그 글자를 가린다 — 위쪽에 띄운다 */
    position:fixed;left:50%;top:2vh;transform:translateX(-50%);
    background:rgba(0,0,0,.6);padding:1vh 1.8vh;border-radius:1.4vh;
    opacity:.28;transition:opacity .2s;
  }
  #tv.full #tvZoom:hover{opacity:1;}
  #tvEsc{
    display:none;position:fixed;top:2vh;right:2.5vw;z-index:2;
    font-size:2.2vh;color:#cfc3d8;background:rgba(0,0,0,.6);
    padding:.8vh 1.6vh;border-radius:1.2vh;cursor:pointer;
    opacity:.28;transition:opacity .2s;
  }
  #tvEsc:hover{opacity:1;}
  #tv.full #tvEsc{display:block;}
</style>
</head>
<body>

<!-- 첫 화면 -->
<div id="home">
  <div id="homeTop">
    <h1>🏷️ 새가족 사진촬영 <span style="font-size:12px;color:#614878;font-weight:700">v235</span></h1>
    <button id="bCopyUrl" title="봉사자에게 전달할 앱 주소를 복사합니다"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
  </div>
  <div id="tvRow">
    <button class="sub enter" id="bTvLink" style="animation-delay:.04s"><span class="ico">📺</span>태블릿</button>
  </div>

  <div id="quickGrid">
    <a class="tile enter" id="bUlike" style="animation-delay:.10s"
       href="intent://#Intent;package=com.gorgeous.liteinternational;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.gorgeous.liteinternational;end"><span class="ico">📷</span><span class="tlabel">Ulike</span></a>
    <a class="tile enter" id="bHdCam" style="animation-delay:.15s"
       href="intent://#Intent;package=photo.editor.hd.camera.adfree;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dphoto.editor.hd.camera.adfree;end"><span class="ico">📷</span><span class="tlabel">HD캠</span></a>
    <button class="tile gal enter" id="bPick" style="animation-delay:.20s"><span class="ico">🖼️</span><span class="tlabel">갤러리</span></button>
    <button class="tile ment enter" id="bMent" style="animation-delay:.25s"><span class="ico">💬</span><span class="tlabel">멘트</span></button>
  </div>

  <!-- "카톡 사진 전송"과 "갤러리 사진 전송"을 합친 버튼 — 오늘 찍은 사진이
       있으면 그걸 바로 보내고, 없으면(나중에 따로 보내려고 미뤄뒀거나 앱을
       다시 열었을 때) 갤러리에서 골라 그대로 보낸다. 이름표는 저장할 때
       이미 사진에 합성돼 있으므로 갤러리로 고른 사진은 다시 편집할 필요가
       없다 — 고른 파일을 그대로 공유만 한다. -->
  <button class="go share enter" id="bResendGallery" style="animation-delay:.32s"><span class="ico">📤</span>사진 카톡 전송</button>

  <button class="go enter" id="bShoot" style="animation-delay:.36s"><span class="ico">📷</span>카메라로 찍기</button>
  <button id="mentLine" type="button" title="눌러서 다른 멘트 보기"></button>

  <div id="todayWrap">
    <div id="todayHead">
      <label>오늘 찍은 사진 (<span id="todayCount">0</span>장)</label>
      <button id="bClearAll" type="button">전체 지우기</button>
    </div>
