<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- interactive-widget: 키보드가 올라오면 화면 영역 자체를 줄여서,
     가운데 놓인 입력·저장 패널이 키보드에 가리지 않고 위로 올라오게 한다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#D1C7B7">

<title>새가족 사진촬영</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">

<style>
  /* 빙그레체 — 눈누(noonnu.cc)에서 배포하는 상업용 무료 폰트, CDN에서 불러온다.
     본문 index.html 자체는 서비스워커가 접속할 때마다 새로 받아오지만(sw.js
     network-first 전략), 이 폰트 파일은 별도 출처라 브라우저가 평소 캐시
     규칙대로 오래 캐싱해준다 — 그래서 base64로 파일 자체를 심지 않고
     CDN 주소만 참조한다(안 그러면 페이지 열 때마다 폰트 용량까지 매번
     다시 받게 됨). 못 받아오면 기존 폰트로 자연스럽게 대체된다. */
  @font-face{
    font-family:'Binggre';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Binggrae.woff') format('woff');
    font-weight:normal;font-display:swap;
  }
  @font-face{
    font-family:'Binggre';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/Binggrae-Bold.woff2') format('woff2');
    font-weight:700;font-display:swap;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  :root{ --plum:#8B6E9E; }

  /* 폰을 가로로 들어도 화면은 항상 세로로 유지 (manifest orientation:portrait
     가 안 먹는 상황 — 설치 안 하고 그냥 브라우저 탭으로 쓰는 경우 등 — 을 대비한
     확실한 방법. 실제로 가로로 들었을 때만 화면 전체를 90도 반대로 돌려서
     그대로 세로처럼 보이게 함).
     주의: 예전엔 CSS @media(orientation:landscape)로만 판단했는데, 이건
     화면(뷰포트) 가로세로 "비율"만 보기 때문에 키보드가 올라와 보이는 영역이
     좁아지기만 해도(실제 폰은 그대로 세로인데) 잘못 landscape로 인식해
     화면 전체가 돌아가 버리는 문제가 있었다. 그래서 실제 기기 방향을 아는
     JS(screen.orientation 등, 키보드에 영향받지 않음)로 이 클래스를 직접 켜고 끈다. */
  html.rot90:not(.tvmode){
    transform:rotate(-90deg);
    transform-origin:left top;
    width:100vh;height:100vw;
    overflow-x:hidden;
    position:absolute;
    top:100%;left:0;
  }
  body{
    font-family:'Binggre','Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    /* 원래 배경(#FFF9F1)보다 살짝 어둡게(#F5ECDD) 한 뒤, 거기서 10% 더 어둡게 */
    background:#D1C7B7;color:#3E3348;
    -webkit-user-select:none;user-select:none;
  }
  /* ── 아쿠아 버튼 ──
     위쪽 절반은 밝게 빛나고 아래쪽은 진한, 유리알 같은 입체 버튼.
     가짜 요소(::before) 대신 배경을 두 겹으로 깔아 글자가 항상 위에 오게 한다.
     (첫 겹 = 하이라이트 광택, 둘째 겹 = 실제 색) */
  /* 광택 덩어리는 테두리 안쪽에 떠 있는 별도의 둥근 판으로 만든다.
     isolation:isolate 로 쌓임 맥락을 만들고 광택을 z-index:-1 로 두면
     "버튼 배경 위 · 글자 아래"에 정확히 놓인다. */
  .go, .sub{ position:relative; isolation:isolate; }
  .go::before, .sub::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:4px;height:46%;
    border-radius:20px 20px 50% 50% / 16px 16px 18px 18px;
    transition:opacity .12s ease;
  }

  .go{
    font-family:inherit;font-size:18px;font-weight:800;width:100%;
    padding:18px;border-radius:26px;cursor:pointer;color:#fff;
    /* 아이콘·글자를 flex로 가운데 정렬(.tile 과 같은 방식) —
       예전엔 vertical-align 으로 눈대중 맞췄는데 아이콘·글자 크기가
       달라 높이가 살짝 어긋나 보였다 */
    display:flex;align-items:center;justify-content:center;
    border:2px solid #614878;
    background:linear-gradient(180deg,#8e6ea6 0%,#7a5b90 52%,#9a78b0 84%,#c2a4d3 100%);
    box-shadow:
      0 6px 14px rgba(60,45,72,.42),
      inset 0 -3px 9px rgba(255,255,255,.30),
      inset 0 2px 4px rgba(0,0,0,.22);
    text-shadow:0 1px 2px rgba(0,0,0,.42);
  }
  .go::before{
    background:linear-gradient(180deg,
      rgba(255,255,255,.94) 0%, rgba(255,255,255,.58) 55%, rgba(255,255,255,.16) 100%);
  }

  .sub{
    font-family:inherit;font-size:18px;font-weight:700;width:100%;
    padding:18px;border-radius:26px;cursor:pointer;color:#212121;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #225977;
    background:linear-gradient(180deg,#63bbe8 0%,#35a6de 52%,#6dc6e9 84%,#a1d7f2 100%);
    box-shadow:
      0 5px 12px rgba(74,59,87,.20),
      inset 0 -3px 8px rgba(255,255,255,.85),
      inset 0 2px 3px rgba(139,110,158,.14);
  }
  .sub::before{
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.78) 55%, rgba(255,255,255,.28) 100%);
  }
  /* "태블릿 연결됨 ✓ ABCDEF"처럼 상태에 따라 길어지는 글자가, 시스템 글자 크게
     설정에서 줄바꿈되며 버튼이 여러 줄로 깨지는 것을 막는다(.tile 과 같은 처리) */
  .sub .tlabel{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  /* 버튼 아이콘은 글자 크기와 무관하게 항상 같은 크기·같은 폭으로 (줄 맞춤) */
  .ico{
    display:inline-block;width:1.5em;margin-right:.15em;
    font-size:20px;line-height:1;text-align:center;
    font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  }
  /* ── 자주 안 쓰는 보조 버튼들을 아이콘 타일로 묶는다 ──
     "카메라로 찍기"처럼 짧은 글자와 "주소 복사 (봉사자에게 전달)"처럼 긴 글자가
     같은 폭의 알약 버튼에 나란히 있으면 아이콘 시작 위치가 버튼마다 들쭉날쭉해
     보인다. 정사각형에 가까운 타일 4개를 2x2로 묶으면 글자 길이와 무관하게
     항상 가지런하다. (자주 쓰는 "카메라로 찍기"와, 상태 글자가 길어지는
     "태블릿 연결"은 그대로 위아래에 넓은 버튼으로 둔다) */
  #quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    font-family:inherit;font-weight:700;color:#212121;cursor:pointer;
    border:2px solid #419776;border-radius:22px;
    background:linear-gradient(180deg,#a0e8cc 0%,#7dd8b0 52%,#a8ecd0 84%,#dbf7e8 100%);
    box-shadow:
      0 5px 12px rgba(74,59,87,.20),
      inset 0 -3px 8px rgba(255,255,255,.85),
      inset 0 2px 3px rgba(139,110,158,.14);
    position:relative;isolation:isolate;
    display:flex;flex-direction:row;align-items:center;justify-content:center;
    /* .go/.sub 와 높이·글자 크기를 맞춘다(패딩은 좁은 타일 폭에 맞춰 그대로 둠) */
    gap:8px;padding:18px 10px;min-height:64px;text-align:center;text-decoration:none;
    /* 그리드 칸(min-width:auto 기본값)은 white-space:nowrap 글자가 길어지면
       줄이 안 꺾이니 그 길이만큼 억지로 늘어나 버린다(예: 복사 확인 문구).
       min-width:0 으로 그 자동 최소폭을 꺼서 칸 너비 안에서만 움직이게 한다 */
    min-width:0;
    transition:transform .07s ease, background-color .12s ease,
               border-color .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .tile::before{
    content:'';position:absolute;z-index:-1;pointer-events:none;
    left:5px;right:5px;top:4px;height:46%;
    border-radius:18px 18px 50% 50% / 14px 14px 16px 16px;
    transition:opacity .12s ease;
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.78) 55%, rgba(255,255,255,.28) 100%);
  }
  .tile .ico{font-size:20px;width:auto;margin-right:0;}
  /* 한 줄로 고정 — 타일이 좁아도 줄바꿈되지 않고 필요하면 말줄임표로 잘린다 */
  .tile .tlabel{
    font-size:18px;font-weight:800;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    min-width:0;   /* flex 자식도 같은 이유로 필요 — 없으면 글자 길이만큼 밀어낸다 */
  }
  .tile:active, .tile.pressing{
    border-color:#277559;transform:scale(.965);
    background:linear-gradient(180deg,#8fd9ba 0%,#6bc79c 55%,#98dcbf 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(39,117,89,.30);
  }
  .tile:active::before, .tile.pressing::before{ opacity:.35; }

  /* 멘트 버튼만 다른 타일과 구분되게 오렌지색으로 */
  .tile.ment{
    border-color:#ab6621;
    background:linear-gradient(180deg,#ffd4a3 0%,#f1a355 52%,#ffcf99 84%,#fdebd3 100%);
  }
  .tile.ment:active, .tile.ment.pressing{
    border-color:#844d15;
    background:linear-gradient(180deg,#f1b87e 0%,#e28432 55%,#f0b375 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(132,77,21,.30);
  }

  /* 갤러리 버튼만 핫핑크로 구분 */
  .tile.gal{
    border-color:#d06299;
    background:linear-gradient(180deg,#ffa3d1 0%,#f391c2 52%,#ff99cc 84%,#fdd3e8 100%);
  }
  .tile.gal:active, .tile.gal.pressing{
    border-color:#84154d;
    background:linear-gradient(180deg,#f17eb8 0%,#ea7bb3 55%,#f075b3 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(132,21,77,.30);
  }

  /* 앱 주소 버튼 색상 — "BLUE TURQUOISE" 팔레트 기준. 이 색은 .tile 계열
     중에서 유독 짙어서(민트/하늘/핑크처럼 파스텔이 아님) 어두운 글자 대신
     .go(카메라 버튼)와 같은 방식(흰 글자 + brightness 필터로 눌림 표현)을 쓴다 */
  .tile.link{
    border-color:#225977;
    background:linear-gradient(180deg,#63bbe8 0%,#35a6de 52%,#6dc6e9 84%,#a1d7f2 100%);
    color:#212121;
  }
  .tile.link:active, .tile.link.pressing{
    border-color:#15415a;
    background:linear-gradient(180deg,#4fb4e2 0%,#309bd5 55%,#5bbce5 100%);
    box-shadow:0 1px 3px rgba(74,59,87,.18), inset 0 5px 11px rgba(21,65,90,.30);
  }

  /* 태블릿 연결 + 멘트 버튼을 나란히, 아래 2x2 타일과 정확히 같은 폭으로.
     flex:1 은 각 버튼의 padding·border 만큼을 최소 폭으로 먼저 깔고 남는
     공간만 나눠 갖기 때문에(.sub 는 좌우 padding 18px, .tile 은 10px이라
     서로 달라) 폭이 미세하게 어긋난다. grid 는 #quickGrid 와 똑같이
     내용과 무관하게 트랙을 정확히 반으로 나눈다. */
  #tvRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  #tvRow>button{width:auto;min-width:0;}

  /* "카메라로 찍기" 바로 밑에 뜨는 멘트 한 줄 — 탭하면 다른 멘트로 바뀐다 */
  #mentLine{
    display:block;width:100%;margin-top:8px;font-size:20px;font-weight:700;color:#614878;
    font-family:inherit;background:none;border:none;appearance:none;-webkit-appearance:none;
    text-align:center;cursor:pointer;padding:4px 10px;line-height:1.4;
    user-select:none;-webkit-user-select:none;
  }
  #mentLine:active{opacity:.6;}

  /* ── 버튼 눌림 효과 ──
     맨 위에서 -webkit-tap-highlight-color 를 껐기 때문에 폰에서 눌러도
     아무 반응이 없었다. 눌린 느낌을 직접 만들어 준다.
     .pressing 은 자바스크립트가 붙여 주는 것(짧게 탭해도 확실히 보이게),
     :active 는 마우스로 누르고 있는 동안의 상태. */
  button{
    transition:transform .07s ease, background-color .12s ease,
               border-color .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  button:active, button.pressing{
    transform:scale(.965);
  }
  /* 눌리면 광택이 죽고 안쪽으로 쑥 들어간 느낌 */
  .go:active::before, .go.pressing::before,
  .sub:active::before, .sub.pressing::before{ opacity:.35; }
  .go:active, .go.pressing{
    filter:brightness(.88) saturate(1.08);
    box-shadow:
      0 1px 3px rgba(60,45,72,.34),
      inset 0 5px 13px rgba(0,0,0,.36);
  }
  .sub:active, .sub.pressing{
    border-color:#15415a;
    background:linear-gradient(180deg,#4fb4e2 0%,#309bd5 55%,#5bbce5 100%);
    box-shadow:
      0 1px 3px rgba(74,59,87,.18),
      inset 0 5px 11px rgba(21,65,90,.30);
  }
  /* 어두운 배경 위의 버튼들(태블릿 확대 막대) */
  #tvZoom button:active, #tvZoom button.pressing{
    background:rgba(255,255,255,.42);color:#111;
  }

  /* ── 첫 화면 ── */
  #home{
    height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
  }
  #home h1{font-size:22px;font-weight:800;margin-bottom:2px;}
  #home .hint{font-size:13.5px;color:#9b8fa6;line-height:1.65;}

  /* 첫 화면 진입 애니메이션 — 버튼이 아래서 위로 톡톡 튀듯 순서대로 나타난다.
     .enter 는 처음 여섯 개 버튼에만 붙어 있어서(HTML 참고), 나중에 사진 찍고
     나서 나타나는 "전체 카톡 공유" 버튼 등은 영향받지 않는다. */
  @keyframes popIn{
    0%{ opacity:0; transform:translateY(20px) scale(.92); }
    65%{ opacity:1; transform:translateY(-3px) scale(1.015); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .enter{ animation:popIn .46s cubic-bezier(.22,1,.36,1) both; }
  #home h1{ animation:popIn .4s cubic-bezier(.22,1,.36,1) both; }
  #todayWrap{display:none;flex-direction:column;gap:8px;}
  #todayWrap.show{display:flex;}
  #todayWrap label{font-size:14px;font-weight:700;color:#8B6E9E;}
  #todayThumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;}
  #todayThumbs::-webkit-scrollbar{display:none;}
  #todayThumbs img{
    width:52px;height:52px;object-fit:cover;border-radius:8px;
    flex:0 0 auto;border:1px solid #e3d8c8;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #todayThumbs img:active{ transform:scale(.9); }
  #todayThumbs img.sending{
    animation:tvPulse .7s ease-in-out infinite;
    border-color:#8B6E9E;
  }
  @keyframes tvPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(139,110,158,.55); }
    50%{ box-shadow:0 0 0 5px rgba(139,110,158,0); }
  }

  /* ── 사진 + 이름 입력 화면 ── */
  #editor{
    position:fixed;inset:0;z-index:50;display:none;background:#000;flex-direction:column;
  }
  #editor.on{display:flex;}
  /* 사진은 보여주지 않는다 — 화면을 앱 색감의 은은한 배경으로 채운다.
     이 배경(입력판 바깥 영역)을 탭하면 저장하지 않고 닫힌다. */
  #edStage{
    position:relative;flex:1;overflow:hidden;cursor:pointer;
    background:linear-gradient(160deg,#3a2c47 0%,#241a2e 60%,#160f1c 100%);
  }
  /* 입력·저장 패널을 화면 한가운데에 둔다.
     아래쪽에 있으면 폰을 한 손으로 들고 섬기는 현장에서 엄지가 닿지 않고,
     키보드가 올라오면 가려져버렸다. 사진이 비치도록 반투명으로 띄운다. */
  #edBottom{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(94%,440px);z-index:2;
    display:flex;flex-direction:column;gap:9px;
    padding:14px;border-radius:20px;
    /* 입력칸·버튼은 각자 불투명하므로, 판 자체는 옅게 해서
       뒤의 얼굴이 최대한 비쳐 보이게 한다 */
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 10px 34px rgba(0,0,0,.45);
  }
  #edBottom .row{display:flex;gap:8px;}
  #edBottom input{
    font-size:20px;padding:12px 14px;border-radius:12px;border:none;

  /* 전화번호 칸은 "010-1234-5678"까지 들어가야 해서 좀 더 넓게,

  #edHint{color:#fff;font-size:12.5px;text-align:center;opacity:.95;min-height:16px;
          text-shadow:0 1px 3px rgba(0,0,0,.9);}

  /* ── 촬영 멘트 모음 (전체 보기) ── */

       확대 버튼을 아래에 두면 그 글자를 가린다 — 위쪽에 띄운다 */
    position:fixed;left:50%;top:2vh;transform:translateX(-50%);

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS='nametag_v1';

  let data={};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* "폰을 가로로 들어도 세로 유지"는 폰에서만 의미가 있다. PC 모니터는
     거의 항상 가로가 더 길어서(1920x1080 등), screen.width>height 만으로
     판단하면 PC에서 창을 아무리 세로로 만들어도 항상 "가로"로 오인해
     화면이 계속 90도 돌아가버렸다 — 실제로 PC 브라우저에서 발생한 문제.
     그래서 먼저 "이게 폰인가"부터 확인하고, 폰일 때만 screen.width·height
     로 실제 방향을 본다(이 값은 키보드가 올라와도 바뀌지 않아 안전하다). */
  function isPhoneLike(){
    if(navigator.userAgentData && typeof navigator.userAgentData.mobile==='boolean'){
      return navigator.userAgentData.mobile;
    }
    return /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
  }
  const PHONE = isPhoneLike();
  function updateRotateLock(){
    const landscape = PHONE && (screen.width||0) > (screen.height||0);
    document.documentElement.classList.toggle('rot90', landscape);
  }
  updateRotateLock();
  window.addEventListener('orientationchange', updateRotateLock);
  if(screen.orientation && screen.orientation.addEventListener){
    screen.orientation.addEventListener('change', updateRotateLock);
  }

  /* 버튼 누를 때 진동 + "띡" 소리 */
  let actx=null;
  function beep(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx=new AC();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime;
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(2200,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.09);
    }catch(e){}
  }
  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('button')){
      try{ if(navigator.vibrate) navigator.vibrate(28); }catch(err){}
      beep();
    }
  }, true);

  /* 눌린 순간 바로 보이게 (짧게 톡 눌러도 확실히 보이도록 잠깐 유지)
     :active 만으로는 폰에서 스치듯 눌렀을 때 거의 안 보인다. */
  document.addEventListener('pointerdown', e=>{
    const b=e.target.closest && e.target.closest('button, .tile');
    if(!b) return;
    b.classList.add('pressing');
    setTimeout(()=>b.classList.remove('pressing'), 200);
  }, true);

  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    let d=(v||'').replace(/\D/g,'');
    if(!d) return '';
    if(d[0]!=='0' && d.length<=8) d='010'+d;      // 010 생략 입력
    if(d.startsWith('010')){
      const r=d.slice(3,11);
      if(!r) return '010';
      return r.length<=4 ? '010-'+r : '010-'+r.slice(0,4)+'-'+r.slice(4);
    }
    d=d.slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  function safeSeg(s){
    return (s||'').replace(/[\\/:*?"<>|.]/g,'').replace(/\s+/g,'').trim();
  }
  function stampOf(file){
    // 사진이 찍힌 날짜를 파일명에 사용 (없으면 오늘)
    const d=new Date((file && file.lastModified) || Date.now()), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }
  /* 같은 날짜(사진 찍힌 날 기준) 안에서 몇 번째 사람인지 01,02,03... 매긴다.
     날짜별로 따로 세어둔다 — 갤러리에서 며칠 전 사진이 섞여 들어와도
     오늘 번호가 리셋되지 않도록(예전엔 날짜 하나만 기억해서 01이 중복됐다). */
  function nextCounter(dateStr){
    if(!data.ctr){
      data.ctr={};
      // 옛 방식(날짜 1개만 저장)에서 넘어오는 값 살리기
      if(data.ctrDate && data.ctrN) data.ctr[data.ctrDate]=data.ctrN;
    }
    delete data.ctrDate; delete data.ctrN;
    data.ctr[dateStr]=(data.ctr[dateStr]||0)+1;
    // 날짜가 무한정 쌓이지 않게 최근 60일치만 남긴다
    const days=Object.keys(data.ctr).sort();
    if(days.length>60) days.slice(0, days.length-60).forEach(d=>delete data.ctr[d]);
    save();
    return String(data.ctr[dateStr]).padStart(2,'0');
  }

  /* ───── 벽걸이 태블릿으로 즉시 전송 ─────
     서버가 없으므로 공개 MQTT 중계소를 "우편함"처럼 쓴다.
     방 코드로 만든 열쇠(AES-GCM)로 잠가서 보내므로 중계소에는 암호문만 지나가고,
     같은 코드를 가진 태블릿만 열어볼 수 있다. retain 을 끄기 때문에
     중계소에 데이터가 남지도 않는다. */
  const TV = (function(){
    const BROKER='wss://broker.emqx.io:8084/mqtt';
    const myId=Math.random().toString(36).slice(2,10);
    const te=new TextEncoder(), td=new TextDecoder();
    let client=null, key=null, topic=null, connected=false, code='', onPhoto=null;
    let mqttLoading=null;
    /* connect()를 부르는 곳이 여러 곳이다(자동 재연결, 실패 시 재시도, 버튼으로
       새 코드 입력 등). 이 호출들이 겹치면, 먼저 시작했지만 늦게 끝나는 시도가
       나중에 시작해 먼저 끝난 시도의 상태(코드·열쇠·토픽·소켓)를 덮어써 버려서
       "화면엔 새 태블릿에 연결됐다고 뜨는데 실제로는 옛 태블릿으로 계속 전송되는"
       문제가 생겼다. 세대 번호를 매겨서, 자기 세대가 이미 낡았으면(더 최신 시도가
       있었으면) 공유 상태를 건드리지 않고 조용히 정리만 하고 빠진다. */
    let gen=0;

    /* 라이브러리(330KB)는 실제로 쓸 때만 불러온다 */
    function loadMqtt(){
      if(window.mqtt) return Promise.resolve();
      if(mqttLoading) return mqttLoading;
      mqttLoading=new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='mqtt.min.js'; s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
      return mqttLoading;
    }

    /* 실제 소켓 상태를 본다. 폰이 다른 앱에 다녀오는 사이 연결이 죽어도
       close/error 가 안 불려 connected 가 true 로 남아있는 경우가 있어서,
       "연결됨"이라고 표시해놓고 전송은 실패하는 일이 생겼다. */
    function live(){ return !!(client && (client.connected===undefined ? connected : client.connected)); }

    async function sha(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s))); }
    /* 공유 상태(code/key/topic)를 직접 건드리지 않고 계산만 해서 돌려준다 —
       실제 반영은 connect() 가 자기 세대가 아직 최신일 때만 한 번에 커밋한다. */
    async function setup(c){
      const k=await crypto.subtle.importKey('raw', await sha('nfp-key:'+c), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
      const h=await sha('nfp-topic:'+c);
      const t='nfp/'+[...h].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('');
      return {key:k, topic:t};
    }
    async function encrypt(obj){
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, te.encode(JSON.stringify(obj))));
      const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12);
      let s=''; for(const b of out) s+=String.fromCharCode(b);
      return btoa(s);
    }
    async function decrypt(b64){
      const raw=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, key, raw.slice(12));
      return JSON.parse(td.decode(pt));
    }

    async function connect(c, opts){
      opts=opts||{};
      const myGen=++gen;   // 이 시도의 번호. 진행 중에 gen 이 바뀌면 더 최신 시도가 있었다는 뜻
      onPhoto=opts.onPhoto||null;
      await loadMqtt();
      if(myGen!==gen) return;             // 기다리는 사이 낡아졌다 — 아무 것도 건드리지 않고 끝
      if(!window.mqtt || !crypto.subtle) throw new Error('unsupported');
      const computed=await setup(c);
      if(myGen!==gen) return;             // setup() 은 공유 상태를 안 건드렸으니 그냥 버리면 끝

      // 여기서부터 다음 await 전까지는 동기적으로 한 번에 커밋한다
      code=c; key=computed.key; topic=computed.topic;
      if(client){ try{ client.end(true); }catch(e){} client=null; }
      const newClient=mqtt.connect(BROKER, {
        clientId:'nfp_'+myId, clean:true,
        reconnectPeriod:4000, connectTimeout:8000, keepalive:30
      });
      client=newClient;
      /* 아래 이벤트들은 소켓이 살아있는 동안(자동 재연결 포함) 여러 번 다시 불릴 수
         있다 — 이 시도가 나중에 낡아진 뒤에도 계속 불려서 최신 상태를 덮어쓰지
         않도록 매번 자기 세대가 아직 최신인지 확인한다. */
      newClient.on('connect', ()=>{
        if(myGen!==gen){ try{ newClient.end(true); }catch(e){} return; }
        connected=true;
        if(onPhoto) newClient.subscribe(topic,{qos:1});
        if(opts.onStatus) opts.onStatus(true);
      });
      newClient.on('close', ()=>{
        if(myGen!==gen) return;
        connected=false; if(opts.onStatus) opts.onStatus(false);
      });
      newClient.on('error', ()=>{
        if(myGen!==gen) return;
        connected=false; if(opts.onStatus) opts.onStatus(false);
      });
      newClient.on('message', async (t,payload)=>{
        if(myGen!==gen || !onPhoto) return;
        try{
          const o=await decrypt(payload.toString());
          if(!o || o.from===myId) return;
          onPhoto(o);
        }catch(e){}   // 다른 방 메시지거나 복호화 실패 — 조용히 무시
      });
      /* 실제로 붙을 때까지 기다린다(최대 8초). 여기서 바로 돌려주면
         아직 연결도 안 됐는데 "연결됨"으로 보고 곧장 사진을 보내다 실패한다. */
      await new Promise(res=>{
        if(live()) return res();
        let done=false;
        const fin=()=>{ if(done) return; done=true; clearTimeout(t); res(); };
        const t=setTimeout(fin, 8000);
        newClient.once('connect', fin);
      });
      if(myGen!==gen){ try{ newClient.end(true); }catch(e){} }  // 기다리는 사이 낡아졌으면 정리
    }

    /* 확인용이므로 화면에 보일 만큼만 줄여서 보낸다 (전송 1~2초 안에 끝나도록) */
    function shrink(cv, maxPx, q){
      const k=Math.min(1, maxPx/Math.max(cv.width, cv.height));
      if(k>=1) return cv.toDataURL('image/jpeg', q);
      const c2=document.createElement('canvas');
      c2.width=Math.round(cv.width*k); c2.height=Math.round(cv.height*k);
      c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
      return c2.toDataURL('image/jpeg', q);
    }
    async function sendPhoto(canvas, name, tel, opts){
      opts=opts||{};
      if(!live() || !key) return false;
      /* 크게 보기(full)는 화면을 가득 채우므로 더 큰 사진을 보낸다.
         다만 공용 중계소는 한 번에 1MB 까지만 받아준다. 사진은
         데이터URL(base64) → 암호화 → 다시 base64 를 거치면서 데이터URL
         길이의 1.33배로 부푸므로, 데이터URL 자체를 아래 한도 밑으로
         눌러두지 않으면 큰 사진이 조용히 거부된다.
         (한도 60만 자 ≈ 실제 전송 약 800KB) */
      const big=!!opts.full;
      const CAP=big?600000:400000;
      const steps=big ? [[1400,.72],[1150,.66],[900,.6],[700,.55]]
                      : [[900,.7],[640,.6],[480,.5]];
      let img='';
      for(const [px,q] of steps){ img=shrink(canvas,px,q); if(img.length<=CAP) break; }
      try{
        const msg=await encrypt({ img, name, tel, full:big, from:myId, t:Date.now() });
        // qos:1 로 중계소가 받았다는 응답(또는 실패)을 실제로 확인한 뒤 결과를 돌려준다.
        // 응답이 없으면 6초 뒤 실패로 처리해 "보냈다"고 잘못 알리지 않는다.
        return await new Promise(res=>{
          let done=false;
          const t=setTimeout(()=>{ if(!done){ done=true; res(false); } }, 6000);
          client.publish(topic, msg, {qos:1, retain:false}, err=>{
            if(done) return;
            done=true; clearTimeout(t); res(!err);
          });
        });
      }catch(e){ return false; }
    }

    function makeCode(){
      const DIGITS='0123456789';
      const a=crypto.getRandomValues(new Uint8Array(2));
      let s='TB'; for(let i=0;i<2;i++) s+=DIGITS[a[i]%DIGITS.length];
      return s;
    }
    /* 연결을 진짜로 끊는다. 소켓만 닫는 게 아니라 암호열쇠·토픽까지 버려야
       "연결 끊음"이라고 표시해놓고 예전 태블릿으로 사진이 계속 가는 일이 없다.
       gen 도 올려서, 이 시점에 진행 중이던 connect() 시도가 있었다면 그것도
       낡은 것으로 만들어 뒤늦게 되살아나지 않게 한다. */
    function disconnect(){
      gen++;
      if(client){ try{ client.end(true); }catch(e){} }
      client=null; key=null; topic=null; connected=false; code=''; onPhoto=null;
    }
    return { connect, disconnect, sendPhoto, makeCode, isReady:live };
  })();

  /* ───── 오늘 찍은 사진 모아서 한 번에 공유 ─────
     이 화면을 켜둔 세션 동안만 기억한다(앱을 완전히 껐다 켜면 목록은 비워짐).
     사진 파일 자체는 이미 저장할 때마다 다운로드 폴더에 들어가 있으니,
     여기 있는 목록은 "한꺼번에 공유하기용" 임시 모음일 뿐이다. */
  const todaysShots=[];
  /* 사진마다 objectURL을 딱 한 번만 만들어 재사용한다. 예전엔 사진을 찍을 때마다
     그동안 찍은 것 전체를 처음부터 다시 그리면서 이미 만들어둔 URL까지 매번
     새로 만들어(회수도 안 됨) N장이면 URL이 N²/2개씩 쌓이는 누수가 있었다. */
  function appendTodayThumb(s){
    const img=document.createElement('img');
    img.src=s.url;
    img.alt=s.name||s.tel||'';
    img.title='탭하면 태블릿 화면에 다시 크게 띄웁니다';
    img.onclick=()=>resendToTv(s, img);
    $('todayThumbs').appendChild(img);
  }
  /* 썸네일을 탭하면 그 사진(이미 이름표가 합성된 최종본)을 다시 태블릿/PC 확인
     화면으로 보낸다 — 방금 찍은 사진을 화면에 크게 다시 띄우고 싶을 때 사용 */
  async function resendToTv(shot, thumbEl){
    const bmp = await (window.createImageBitmap
      ? createImageBitmap(shot.blob)
      : new Promise((res,rej)=>{
          const im=new Image(); const u=URL.createObjectURL(shot.blob);
          im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
          im.onerror=()=>{ URL.revokeObjectURL(u); rej(); };
          im.src=u;
        }));
    const cv=document.createElement('canvas');
    cv.width=bmp.width||bmp.naturalWidth; cv.height=bmp.height||bmp.naturalHeight;
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    if(bmp.close) bmp.close();

    thumbEl.classList.add('sending');
    const ok=await sendToTvSmart(cv, shot.name, shot.tel, {full:true});
    thumbEl.classList.remove('sending');
    // 성공했을 때는 문구를 따로 띄우지 않는다 (태블릿 화면에 뜨는 것 자체가 확인이 됨)
    if(!ok) $('homeLog').innerHTML='⚠ 태블릿이 연결되어 있지 않습니다 (📺 태블릿 연결 확인)';
  }
  function addTodayShot(blob, filename, name, tel){
    const url=URL.createObjectURL(blob);
    const shot={blob, filename, name, tel, url};
    todaysShots.push(shot);
    appendTodayThumb(shot);
    $('todayWrap').classList.add('show');
    $('todayCount').textContent=todaysShots.length;
  }
  $('bShareAll').onclick=async ()=>{
    if(!todaysShots.length) return;
    const files=todaysShots.map(s=>new File([s.blob], s.filename, {type:'image/jpeg'}));
    const shareData={ files, title:'새가족 사진', text:todaysShots.length+'장' };
    try{
      if(navigator.canShare && navigator.canShare(shareData)){
        await navigator.share(shareData);
      }else{
        alert('이 브라우저에서는 여러 장을 한 번에 공유할 수 없습니다.\n사진은 이미 다운로드 폴더에 저장되어 있으니, 갤러리(사진) 앱에서 직접 선택해 카톡으로 보내주세요.');
      }
    }catch(e){}   // 사용자가 공유창을 취소한 경우 등은 조용히 무시
  };

  /* ───── 사진 편집기 ─────
     기본 카메라 앱이 찍은 사진을 받아 이름·전화번호를 합성해 저장한다.
     (웹 카메라를 직접 쓰면 기본 앱의 1x 광각 렌즈에 접근할 수 없어 화각이
      좁아지는 문제가 있어, 촬영은 전적으로 기본 카메라 앱에 맡긴다.) */
  const ED = (function(){
    const nI=$('edName'), tI=$('edTel'), hintEl=$('edHint');
    const MAXPX=2400;                       // 긴 변 기준 최대 크기 (용량·속도 절충)
    let baseCanvas=null;                    // 방향까지 바로잡힌 원본
    let queue=[], qi=0;                     // 여러 장 선택했을 때의 처리 대기열

    /* EXIF 방향까지 반영해서 이미지를 읽는다 */
    async function loadOriented(file){
      if(window.createImageBitmap){
        try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
        try{ return await createImageBitmap(file); }catch(e){}
      }
      return await new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>res(img);
        img.onerror=rej;
        img.src=URL.createObjectURL(file);
      });
    }

    async function showFile(file){
      const src=await loadOriented(file);
      const sw=src.width, sh=src.height;
      const k=Math.min(1, MAXPX/Math.max(sw,sh));
      const w=Math.round(sw*k), h=Math.round(sh*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(src,0,0,w,h);
      if(src.close) src.close();
      baseCanvas=cv; baseCanvas.__file=file;

      nI.value=''; tI.value='';
      hintEl.textContent = queue.length>1 ? (qi+1)+' / '+queue.length+' 장' : '';
      $('editor').classList.add('on');
      setTimeout(()=>{ if($('editor').classList.contains('on')) nI.focus(); },150);
    }

    function fileBase(){
      const nm=safeSeg(nI.value)||'이름없음';
      const tel=fmtTel(tI.value).replace(/[\\/:*?"<>|\s]/g,'');
      const dateStr=stampOf(baseCanvas&&baseCanvas.__file);
      const n=nextCounter(dateStr);
      return dateStr+'_'+n+'_'+nm+(tel?'_'+tel:'');
    }

    /* 사진 아래쪽에 이름·전화번호를 같은 크기로 합성 */
    function compose(){
      const w=baseCanvas.width, h=baseCanvas.height;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.drawImage(baseCanvas,0,0);

      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      const barH=Math.round(h*0.16);
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(0,h-barH,w,barH);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
      const fs=Math.round(barH*0.36);       // 이름·전화번호 같은 크기
      if(nm){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(nm, w/2, h-barH*0.60);
      }
      if(tel){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(tel, w/2, h-barH*0.24);
      }
      return cv;
    }

    /* 저장이 끝나기 전에 저장 버튼을 또 누르면(급할 때 흔한 연타) 같은 사진이
       두 번 저장되고 번호가 밀리며, 여러 장 처리 중이었다면 그 사이 한 장이
       통째로 건너뛰어진다. 저장이 끝날 때까지 잠가둔다 — 그리고 다음 장이
       실제로 화면에 뜰 때까지도 잠금을 유지해서(예전엔 저장 직후 바로 풀었다),
       그 짧은 전환 구간에 배경 탭·다시 찍기·재입력이 끼어들어 큐가 망가지거나
       화면이 엉뚱하게 다시 열리는 일이 없게 한다. */
    let saving=false;
    /* 저장마다 하나씩 늘어나는 번호. 앞선 저장의 태블릿 전송 결과가 늦게
       도착했을 때, 그 사이 더 최근 저장이 이미 로그를 넘겨받았다면
       엉뚱한(다음) 사진 쪽 로그에 잘못 붙는 일을 막는다. */
    let saveSeq=0;
    function saveShot(){
      if(saving) return;
      if(!baseCanvas) return;
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      if(!nm && !tel){ hintEl.textContent='이름 또는 전화번호를 입력해주세요'; return; }
      saving=true; $('edSave').disabled=true;
      const mySeq=++saveSeq;

      const name=fileBase()+'.jpg';
      const composed=compose();

      // 벽걸이 태블릿에도 즉시 띄운다 (연결돼 있을 때만)
      const tvSend = sendToTvSmart(composed, nm, tel);

      composed.toBlob(async blob=>{
        if(!blob){
          hintEl.textContent='저장에 실패했습니다. 다시 시도해주세요';
          saving=false; $('edSave').disabled=false;
          return;
        }
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);

        // 실제 저장·전송은 화면 상태와 무관하게 항상 한다 — 입력한 이름·전화가
        // 담긴 사진을 화면 전환 타이밍 때문에 버리면 안 된다.
        addTodayShot(blob, name, nm, tel);

        if(mySeq===saveSeq){
          $('homeLog').innerHTML='✅ 저장됨 · <b>'+name+'</b><br>(다운로드 폴더)';
        }
        // 전송 결과는 위 문구가 찍힌 뒤에 덧붙여야 지워지지 않는다
        tvSend.then(ok=>{
          if(mySeq!==saveSeq) return;   // 그 사이 더 최근 저장이 로그를 넘겨받았다
          $('homeLog').innerHTML += ok ? '<br>📺 태블릿에 표시됨' : '<br>⚠ 태블릿 전송 실패 (📺 태블릿 연결 확인)';
        });

        // 여러 장을 골랐다면 다음 장으로, 아니면 편집기를 닫는다.
        // 다음 장이 실제로 뜬 뒤에야 잠금을 풀어서(await), 그 사이 배경 탭·연타로
        // 큐가 어긋나거나 같은 사진이 중복 저장되는 일을 막는다.
        if(qi+1 < queue.length){
          qi++;
          try{ await showFile(queue[qi]); }
          catch(e){ alert('다음 사진을 불러오지 못했습니다.'); queue=[]; qi=0; close(); return; }
          saving=false; $('edSave').disabled=false;
        }else{
          queue=[]; qi=0; close();
        }
      }, 'image/jpeg', 0.92);
    }

    function close(){
      $('editor').classList.remove('on');
      baseCanvas=null;
      saving=false; $('edSave').disabled=false;   // 어떤 경로로 닫히든 잠금은 반드시 푼다
    }

    async function start(files){
      const list=Array.prototype.slice.call(files||[]).filter(f=>f && f.type.indexOf('image')===0);
      if(!list.length) return;
      queue=list; qi=0;
      try{ await showFile(list[0]); }
      catch(e){ alert('사진을 불러오지 못했습니다.'); close(); }
    }

    $('edSave').onclick=saveShot;
    $('edAgain').onclick=()=>{
      if(saving) return;   // 저장 처리 중엔 무시 — 끝나면 다시 눌러도 늦지 않다
      queue=[]; qi=0; close(); $('fCam').click();
    };

  async function sendToTvSmart(canvas, nm, tel, opts){

  /* ───── 태블릿 모드 (#tv 로 열었을 때) ───── */
  async function startTvMode(){
    document.documentElement.classList.add('tvmode');   // 가로 강제회전 CSS 예외
    document.getElementById('home').style.display='none';
    $('tv').classList.add('on');
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

    // 방 코드는 이 태블릿에 계속 저장해 둔다 (매번 바뀌면 폰을 다시 연결해야 하므로).
    // 다만 예전 형식(GDB988 같은 랜덤 6자)으로 저장된 코드는 새 형식(TB98)이
    // 아니므로 한 번만 새로 만든다 — 그 뒤엔 폰에서 새 코드를 다시 입력해야 함.
    if(!data.tvCode || !/^TB\d{2}$/.test(data.tvCode)){ data.tvCode=TV.makeCode(); save(); }
    $('tvCode').textContent=data.tvCode;

    /* 코드를 눌러 복사 — PC에서 복사해 폰으로 붙여넣기 쉽게 */
    $('tvCode').onclick=async ()=>{
      const note=$('tvCopied');
      const flash=m=>{ note.textContent=m; setTimeout(()=>{ note.textContent=''; }, 2000); };
      try{
        await navigator.clipboard.writeText(data.tvCode);
        flash('복사됨 ✓');
        return;
      }catch(e){}
      if(legacyCopy(data.tvCode)){ flash('복사됨 ✓'); return; }
      // 복사가 막힌 환경 — 드래그로 직접 선택할 수 있게 통째로 선택해 준다
      try{
        const r=document.createRange(); r.selectNodeContents($('tvCode'));
        const s=getSelection(); s.removeAllRanges(); s.addRange(r);
        flash('길게 눌러 복사하세요');
      }catch(e2){}
    };

    /* ───── 사진 확대·이동 (마우스 휠 / 손가락 핀치 / 드래그) ───── */
    const stage=$('tvStage'), img=$('tvImg');
    let sc=1, tx=0, ty=0;
    const MIN=1, MAX=6;

    function applyTf(){
      img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
      img.classList.toggle('zoomed', sc>1.01);
      $('tvPct').textContent=Math.round(sc*100)+'%';
      // 확대해서 보는 동안에는 자동으로 사라지지 않게 멈춘다
      if(sc>1.01) holdClear(); else armClear();
    }
    function clampPan(){
      const st=stage.getBoundingClientRect();
      const w=img.clientWidth*sc, h=img.clientHeight*sc;
      const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
      tx=Math.min(mx,Math.max(-mx,tx));
      ty=Math.min(my,Math.max(-my,ty));
    }
    /* 화면상의 한 점을 기준으로 확대 (그 점이 제자리에 머물도록) */
    function zoomAt(px,py,next){
      const st=stage.getBoundingClientRect();
      const ox=px-st.left-st.width/2, oy=py-st.top-st.height/2;
      const s2=Math.min(MAX,Math.max(MIN,next));
      const u=(ox-tx)/sc, v=(oy-ty)/sc;
      tx=ox-u*s2; ty=oy-v*s2; sc=s2;
      if(sc<=1.001){ sc=1; tx=0; ty=0; }
      clampPan(); applyTf();
    }
    function resetZoom(){ sc=1; tx=0; ty=0; applyTf(); }

    const shown=()=>$('tvShow').classList.contains('on');

    stage.addEventListener('wheel', e=>{
      if(!shown()) return;
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, sc*(e.deltaY<0 ? 1.15 : 1/1.15));
    }, {passive:false});

    // 두 번 누르면 확대 ↔ 원래대로
    stage.addEventListener('dblclick', e=>{
      if(!shown()) return;
      if(sc>1.01) resetZoom(); else zoomAt(e.clientX,e.clientY,2.5);
    });

    // 포인터로 끌어서 이동 + 손가락 두 개로 핀치 확대
    const pts=new Map();
    let panning=false, lastX=0, lastY=0, pinchD=0, pinchS=1;
    stage.addEventListener('pointerdown', e=>{
      if(!shown()) return;
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}   // 캡처 실패해도 계속 진행
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===1){ panning=true; lastX=e.clientX; lastY=e.clientY; img.classList.add('dragging'); }
      else if(pts.size===2){
        panning=false; img.classList.remove('dragging');
        const [a,b]=[...pts.values()];
        pinchD=Math.hypot(a.x-b.x,a.y-b.y); pinchS=sc;
      }
    });
    stage.addEventListener('pointermove', e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2 && pinchD>0){
        const [a,b]=[...pts.values()];
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        zoomAt((a.x+b.x)/2,(a.y+b.y)/2, pinchS*(d/pinchD));
      }else if(panning && sc>1.01){
        tx+=e.clientX-lastX; ty+=e.clientY-lastY;
        lastX=e.clientX; lastY=e.clientY;
        clampPan(); applyTf();
      }
    });
    function endPt(e){
      pts.delete(e.pointerId);
      if(pts.size<2) pinchD=0;
      /* 두 손가락으로 확대한 뒤 한 손가락만 떼는 건 아주 흔한 동작이다.
         남은 손가락 위치를 기준점으로 삼아 이동을 이어받지 않으면
         화면이 먹통이 된 것처럼 느껴진다. */
      if(pts.size===1){
        const p=[...pts.values()][0];
        panning=true; lastX=p.x; lastY=p.y;
        img.classList.add('dragging');
      }
      if(pts.size===0){ panning=false; img.classList.remove('dragging'); }
    }
    stage.addEventListener('pointerup', endPt);
    stage.addEventListener('pointercancel', endPt);

    $('tvIn').onclick =()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc*1.4); };
    $('tvOut').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc/1.4); };
    $('tvFit').onclick=resetZoom;

    /* ───── 표시 / 자동 비우기 ───── */
    let clearT=null;
    function armClear(){
      clearTimeout(clearT);
      if(!$('tvShow').classList.contains('on')) return;
      clearT=setTimeout(()=>{
        $('tvShow').classList.remove('on');
        $('tv').classList.remove('full');
        $('tvIdle').style.display='';
        img.src='';
        sc=1; tx=0; ty=0;
        img.style.transform=''; img.classList.remove('zoomed');
        $('tvPct').textContent='100%';
      }, 15000);
    }
    function holdClear(){ clearTimeout(clearT); }

    function showPhoto(o){
      clearTimeout(clearT);
      // 폰에서 썸네일을 눌러 보낸 사진(full)은 화면 전체를 채워서 보여준다
      $('tv').classList.toggle('full', !!o.full);
      img.src=o.img;
      sc=1; tx=0; ty=0; applyTf();      // 새 사진은 항상 원래 크기부터
      $('tvIdle').style.display='none';
      $('tvShow').classList.add('on');
      armClear();
    }
    /* 크게 보기에서 빠져나오기 — 버튼 또는 Esc */
    function exitFull(){ $('tv').classList.remove('full'); resetZoom(); armClear(); }
    $('tvEsc').onclick=exitFull;
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') exitFull(); });
    try{
      await TV.connect(data.tvCode, {
        onPhoto: showPhoto,
        onStatus: ok=>{ $('tvDot').textContent = ok ? '● 연결됨' : '○ 연결 중…'; }
      });
    }catch(e){
      $('tvDot').textContent='연결할 수 없음 (인터넷 확인)';
    }
    /* 화면 꺼짐 방지 — 브라우저는 화면이 한 번 가려지면(잠금·다른 화면 전환)
       이 잠금을 스스로 풀어버리고, 돌아와도 자동으로 복구해주지 않는다.
       그래서 화면이 다시 보일 때마다 직접 다시 걸어줘야 한다. */
    let wakeSentinel=null;
    async function keepAwake(){
      try{
        if(!('wakeLock' in navigator)) return;
        if(wakeSentinel && !wakeSentinel.released) return;
        wakeSentinel=await navigator.wakeLock.request('screen');
      }catch(e){}
    }
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible') keepAwake();
    });
    keepAwake();
  }
  if(isTvMode) startTvMode();

  /* 새 버전을 올려도 폰 웹앱이나 벽걸이 화면처럼 계속 켜둔 채로 쓰면
     새로고침을 안 하는 한 예전 코드가 계속 돌아간다(서비스워커는
     "새로 열 때" 최신 파일을 주는 것이지, 이미 열려서 돌고 있는
     페이지의 스크립트를 바꿔주진 않는다). 그래서 주기적으로 서버의
     실제 버전을 확인해서, 태블릿 화면은 한가할 때(사진 안 띄운 상태)
     스스로 새로고침하고, 폰은 배너로 눌러서 새로고침하게 안내한다. */
  const CUR_VER = ((document.querySelector('h1 span')||{}).textContent||'').trim();
  function showUpdateBanner(){
    if($('updateBanner')) return;
    const b=document.createElement('div');
    b.id='updateBanner';
    b.textContent='🔄 새 버전이 있습니다 — 눌러서 새로고침';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;'+
      'background:#3a2f42;color:#fff;text-align:center;padding:14px;'+
      'font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.25)';
    b.onclick=()=>location.reload();
    document.body.appendChild(b);
  }
  async function checkForUpdate(){
    if(!CUR_VER) return;
    try{
      const res=await fetch(location.pathname+'?_c='+Date.now(), {cache:'no-store'});
      const html=await res.text();
      const m=html.match(/<h1>[\s\S]*?<span[^>]*>([^<]+)<\/span>/);
      const newVer=m?m[1].trim():'';
      if(!newVer || newVer===CUR_VER) return;
      if(isTvMode){
        if(!$('tvShow').classList.contains('on')) location.reload();
        // 사진이 떠 있으면 다음 확인(1분 뒤) 때 다시 시도 — 대기 화면으로 돌아가면 새로고침됨
      }else{
        showUpdateBanner();
      }
    }catch(e){}
  }
  setInterval(checkForUpdate, 60000);

  /* 진입 애니메이션이 끝나면 클래스를 떼어낸다 — animation-fill-mode:both 를
     그대로 두면 그 뒤로 버튼을 눌러도(:active/.pressing) transform 이 계속
     애니메이션 값에 눌려서 눌림 효과가 하나도 안 보이게 된다.
     animationend 가 못 불릴 수도 있어(탭이 백그라운드였다가 돌아온 경우 등)
     타임아웃으로도 한 번 더 확실히 떼어낸다. */
  document.querySelectorAll('#home .enter').forEach(el=>{
    const clear=()=>{ el.classList.remove('enter'); el.style.animationDelay=''; };
    el.addEventListener('animationend', clear, {once:true});
    setTimeout(clear, 900);
  });

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  /* 세로 고정: 앱(홈 화면 아이콘)으로 실행 중이면 manifest 의 orientation:"portrait"
     로 자동 고정된다. 혹시 지원 안 되는 상황을 대비해 API로도 한 번 더 시도.
     (태블릿 확인 화면은 가로로 걸 수 있으므로 고정하지 않는다) */
  if(!isTvMode){
    try{
      if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
    }catch(e){}
  }
})();
</script>
</body>
</html>
