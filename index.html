<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBEEDC">

<title>새가족 사진촬영</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  :root{ --plum:#8B6E9E; }

  /* 폰을 가로로 들어도 화면은 항상 세로로 유지 (manifest orientation:portrait
     가 안 먹는 상황 — 설치 안 하고 그냥 브라우저 탭으로 쓰는 경우 등 — 을 대비한
     확실한 방법. 가로 방향이 감지되면 화면 전체를 90도 반대로 돌려서 그대로 세로처럼 보이게 함) */
  /* 단, 벽걸이 태블릿 확인 화면(html.tvmode)은 가로로 걸 수 있으므로 제외한다 */
  @media screen and (orientation:landscape){
    html:not(.tvmode){
      transform:rotate(-90deg);
      transform-origin:left top;
      width:100vh;height:100vw;
      overflow-x:hidden;
      position:absolute;
      top:100%;left:0;
    }
  }
  body{
    font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    background:#FFF9F1;color:#3E3348;
    -webkit-user-select:none;user-select:none;
  }
  .go{
    font-family:inherit;font-size:20px;font-weight:800;width:100%;
    padding:20px;border:none;border-radius:14px;cursor:pointer;
    background:var(--plum);color:#fff;
  }
  .sub{
    font-family:inherit;font-size:17px;font-weight:700;width:100%;
    padding:18px 22px;border:2px solid #ddd;border-radius:14px;
    background:#fff;color:#666;cursor:pointer;
  }
  /* 외부 앱 실행은 진짜 링크(<a>)여야 브라우저가 앱 실행으로 처리한다 */
  a.sub{display:block;text-align:center;text-decoration:none;}
  /* 버튼 아이콘은 글자 크기와 무관하게 항상 같은 크기·같은 폭으로 (줄 맞춤) */
  .ico{
    display:inline-block;width:1.5em;margin-right:.15em;
    font-size:20px;line-height:1;text-align:center;vertical-align:-.13em;
    font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  }
  .chip{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:9px 15px;border-radius:999px;border:1.5px solid #ddd;
    background:#f5f5f5;color:#333;cursor:pointer;
  }

  /* ── 첫 화면 ── */
  #home{
    height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
  }
  #home h1{font-size:22px;font-weight:800;margin-bottom:2px;}
  #home .hint{font-size:13.5px;color:#9b8fa6;line-height:1.65;}
  #todayWrap{display:none;flex-direction:column;gap:8px;}
  #todayWrap.show{display:flex;}
  #todayWrap label{font-size:14px;font-weight:700;color:#8B6E9E;}
  #todayThumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;}
  #todayThumbs::-webkit-scrollbar{display:none;}
  #todayThumbs img{
    width:52px;height:52px;object-fit:cover;border-radius:8px;
    flex:0 0 auto;border:1px solid #e3d8c8;
  }

  /* ── 사진 + 이름 입력 화면 ── */
  #editor{
    position:fixed;inset:0;z-index:50;display:none;background:#000;flex-direction:column;
  }
  #editor.on{display:flex;}
  #edStage{position:relative;flex:1;overflow:hidden;background:#000;}
  #edPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  #edTop{
    position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;gap:8px;padding:0 14px;z-index:2;
  }
  #edTop button{
    background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:999px;
    font-size:14px;font-weight:700;font-family:inherit;padding:10px 16px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  #edTop button.sel{background:#fff;color:#111;}
  #edBottom{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;flex-direction:column;gap:10px;
    padding:14px 16px max(16px,env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.8) 40%);
  }
  #edBottom .row{display:flex;gap:8px;}
  #edBottom input{
    font-size:20px;padding:12px 14px;border-radius:12px;border:none;
    background:rgba(255,255,255,.95);color:#111;font-weight:800;
    width:100%;font-family:inherit;
  }
  #edChips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
  #edChips::-webkit-scrollbar{display:none;}
  #edChips .chip{flex:0 0 auto;font-size:14px;padding:8px 13px;}
  #edActions{display:flex;gap:10px;}
  #edActions>button{flex:1;padding:15px;border-radius:12px;font-size:16px;width:auto;}
  #edHint{color:#f0e9da;font-size:12.5px;text-align:center;opacity:.95;min-height:16px;}

  /* ── 벽걸이 태블릿 확인 화면 (주소 뒤에 #tv 를 붙여서 열기) ── */
  #tv{
    position:fixed;inset:0;z-index:60;display:none;background:#0d0b10;color:#fff;
    flex-direction:column;align-items:center;justify-content:center;padding:3vh 3vw;
  }
  #tv.on{display:flex;}
  #tvDot{position:fixed;top:2vh;right:2.5vw;font-size:1.9vh;color:#6b5f75;}
  #tvIdle{text-align:center;}
  #tvIdle h2{font-size:4.6vh;font-weight:800;margin-bottom:1vh;}
  #tvCode{
    font-size:11vh;font-weight:900;letter-spacing:.1em;color:#BFA7CC;
    font-family:'Malgun Gothic',monospace;margin:2vh 0 1vh;
    /* PC 에서 드래그로 선택·복사할 수 있게 (body 의 선택 금지를 여기서만 해제) */
    -webkit-user-select:text;user-select:text;cursor:pointer;
    border-radius:2vh;padding:0 2vw;transition:background .15s;
  }
  #tvCode:hover{background:rgba(191,167,204,.12);}
  #tvCopied{font-size:2.1vh;color:#9CC7A8;height:2.6vh;margin-bottom:1vh;}
  #tvIdle p{font-size:2.3vh;color:#9b8fa6;line-height:1.8;}
  #tvShow{display:none;flex-direction:column;align-items:center;gap:1vh;width:100%;height:100%;}
  #tvShow.on{display:flex;}
  /* 확대·이동을 위해 사진을 담는 틀 (넘치는 부분은 잘라냄) */
  #tvStage{
    flex:1;min-height:0;width:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;                 /* 핀치·드래그를 직접 처리 */
  }
  #tvImg{
    max-width:100%;max-height:100%;object-fit:contain;border-radius:2vh;
    transform-origin:center center;cursor:zoom-in;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  #tvImg.zoomed{cursor:grab;}
  #tvImg.dragging{cursor:grabbing;}
  #tvZoom{
    display:flex;align-items:center;gap:1.2vh;
    font-size:2.2vh;color:#cfc3d8;
  }
  #tvZoom button{
    font-family:inherit;font-size:2.4vh;font-weight:800;
    min-width:6vh;padding:.6vh 1.6vh;border-radius:1.2vh;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;border:none;
  }
  #tvZoom button:hover{background:rgba(255,255,255,.22);}
  #tvPct{min-width:7vh;text-align:center;font-variant-numeric:tabular-nums;}
  #tvAsk{font-size:2.5vh;color:#9b8fa6;padding-bottom:1vh;}
</style>
</head>
<body>

<!-- 첫 화면 -->
<div id="home">
  <h1>🏷️ 새가족 사진촬영 <span style="font-size:12px;color:#c8c8c8;font-weight:400">v75</span></h1>
  <button class="go" id="bShoot"><span class="ico">📷</span>카메라로 찍기</button>

     href="intent://#Intent;package=com.gorgeous.liteinternational;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.gorgeous.liteinternational;end"><span class="ico">📷</span>Ulike 열기</a>

<!-- 벽걸이 태블릿 확인 화면 -->
<div id="tv">
  <div id="tvDot">연결 확인 중…</div>
  <div id="tvIdle">
    <h2>새가족 사진 확인 화면</h2>

    <div id="tvCopied"></div>
    <p>봉사자 폰에서 <b>📺 태블릿 연결</b>을 누르고<br>위 코드를 입력하세요.<br>

<!-- 기본 카메라 앱 호출 / 갤러리 선택 -->
<input type="file" id="fCam"  accept="image/*" capture="environment" style="display:none">
<input type="file" id="fPick" accept="image/*" multiple style="display:none">

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS='nametag_v1';

  let data={recent:[]};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* 버튼 누를 때 진동 + "띡" 소리 */
  let actx=null;
  function beep(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx=new AC();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime;
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(2200,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.09);
    }catch(e){}
  }
  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('button')){
      try{ if(navigator.vibrate) navigator.vibrate(28); }catch(err){}
      beep();
    }
  }, true);

  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    let d=(v||'').replace(/\D/g,'');
    if(!d) return '';
    if(d[0]!=='0' && d.length<=8) d='010'+d;      // 010 생략 입력
    if(d.startsWith('010')){
      const r=d.slice(3,11);
      if(!r) return '010';
      return r.length<=4 ? '010-'+r : '010-'+r.slice(0,4)+'-'+r.slice(4);
    }
    d=d.slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  function safeSeg(s){
    return (s||'').replace(/[\\/:*?"<>|.]/g,'').replace(/\s+/g,'').trim();
  }
  function stampOf(file){
    // 사진이 찍힌 날짜를 파일명에 사용 (없으면 오늘)
    const d=new Date((file && file.lastModified) || Date.now()), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }
  function pushRecent(name,tel){
    if(!name&&!tel) return;
    data.recent=(data.recent||[]).filter(r=>!(r.name===name&&r.tel===tel));
    data.recent.unshift({name,tel});
    data.recent=data.recent.slice(0,10);
  }
  /* 같은 날짜(사진 찍힌 날 기준) 안에서 몇 번째 사람인지 01,02,03... 매긴다.
     날짜가 바뀌면 자동으로 다시 01부터 시작한다. */
  function nextCounter(dateStr){
    if(data.ctrDate !== dateStr){ data.ctrDate=dateStr; data.ctrN=0; }
    data.ctrN=(data.ctrN||0)+1;
    save();
    return String(data.ctrN).padStart(2,'0');
  }

  /* ───── 벽걸이 태블릿으로 즉시 전송 ─────
     서버가 없으므로 공개 MQTT 중계소를 "우편함"처럼 쓴다.
     방 코드로 만든 열쇠(AES-GCM)로 잠가서 보내므로 중계소에는 암호문만 지나가고,
     같은 코드를 가진 태블릿만 열어볼 수 있다. retain 을 끄기 때문에
     중계소에 데이터가 남지도 않는다. */
  const TV = (function(){
    const BROKER='wss://broker.emqx.io:8084/mqtt';
    const myId=Math.random().toString(36).slice(2,10);
    const te=new TextEncoder(), td=new TextDecoder();
    let client=null, key=null, topic=null, connected=false, code='', onPhoto=null;
    let mqttLoading=null;

    /* 라이브러리(330KB)는 실제로 쓸 때만 불러온다 */
    function loadMqtt(){
      if(window.mqtt) return Promise.resolve();
      if(mqttLoading) return mqttLoading;
      mqttLoading=new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='mqtt.min.js'; s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
      return mqttLoading;
    }

    async function sha(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s))); }
    async function setup(c){
      code=c;
      key=await crypto.subtle.importKey('raw', await sha('nfp-key:'+c), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
      const h=await sha('nfp-topic:'+c);
      topic='nfp/'+[...h].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    async function encrypt(obj){
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, te.encode(JSON.stringify(obj))));
      const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12);
      let s=''; for(const b of out) s+=String.fromCharCode(b);
      return btoa(s);
    }
    async function decrypt(b64){
      const raw=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, key, raw.slice(12));
      return JSON.parse(td.decode(pt));
    }

    async function connect(c, opts){
      opts=opts||{};
      onPhoto=opts.onPhoto||null;
      await loadMqtt();
      if(!window.mqtt || !crypto.subtle) throw new Error('unsupported');
      await setup(c);
      if(client){ try{ client.end(true); }catch(e){} client=null; }
      client=mqtt.connect(BROKER, {
        clientId:'nfp_'+myId, clean:true,
        reconnectPeriod:4000, connectTimeout:8000, keepalive:30
      });
      client.on('connect', ()=>{
        connected=true;
        if(onPhoto) client.subscribe(topic,{qos:0});
        if(opts.onStatus) opts.onStatus(true);
      });
      client.on('close', ()=>{ connected=false; if(opts.onStatus) opts.onStatus(false); });
      client.on('error', ()=>{ connected=false; if(opts.onStatus) opts.onStatus(false); });
      client.on('message', async (t,payload)=>{
        if(!onPhoto) return;
        try{
          const o=await decrypt(payload.toString());
          if(!o || o.from===myId) return;
          onPhoto(o);
        }catch(e){}   // 다른 방 메시지거나 복호화 실패 — 조용히 무시
      });
    }

    /* 확인용이므로 화면에 보일 만큼만 줄여서 보낸다 (전송 1~2초 안에 끝나도록) */
    function shrink(cv, maxPx, q){
      const k=Math.min(1, maxPx/Math.max(cv.width, cv.height));
      if(k>=1) return cv.toDataURL('image/jpeg', q);
      const c2=document.createElement('canvas');
      c2.width=Math.round(cv.width*k); c2.height=Math.round(cv.height*k);
      c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
      return c2.toDataURL('image/jpeg', q);
    }
    async function sendPhoto(canvas, name, tel){
      if(!client || !connected || !key) return false;
      let img=shrink(canvas, 900, 0.7);
      if(img.length > 400000) img=shrink(canvas, 640, 0.6);   // 중계소 부담 줄이기
      try{
        const msg=await encrypt({ img, name, tel, from:myId, t:Date.now() });
        client.publish(topic, msg, {qos:0, retain:false});     // retain:false — 중계소에 안 남김
        return true;
      }catch(e){ return false; }
    }

    function makeCode(){
      const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 O,0,I,1 제외
      const a=crypto.getRandomValues(new Uint8Array(6));
      let s=''; for(let i=0;i<6;i++) s+=AB[a[i]%AB.length];
      return s;
    }
    return { connect, sendPhoto, makeCode, isReady:()=>connected };
  })();

  /* ───── 오늘 찍은 사진 모아서 한 번에 공유 ─────
     이 화면을 켜둔 세션 동안만 기억한다(앱을 완전히 껐다 켜면 목록은 비워짐).
     사진 파일 자체는 이미 저장할 때마다 다운로드 폴더에 들어가 있으니,
     여기 있는 목록은 "한꺼번에 공유하기용" 임시 모음일 뿐이다. */
  const todaysShots=[];
  function refreshTodayUI(){
    const wrap=$('todayWrap');
    if(!todaysShots.length){ wrap.classList.remove('show'); return; }
    wrap.classList.add('show');
    $('todayCount').textContent=todaysShots.length;
    const box=$('todayThumbs'); box.innerHTML='';
    todaysShots.forEach(s=>{
      const img=document.createElement('img');
      img.src=URL.createObjectURL(s.blob);
      img.alt=s.name||s.tel||'';
      box.appendChild(img);
    });
  }
  function addTodayShot(blob, filename, name, tel){
    todaysShots.push({blob, filename, name, tel});
    refreshTodayUI();
  }
  $('bShareAll').onclick=async ()=>{
    if(!todaysShots.length) return;
    const files=todaysShots.map(s=>new File([s.blob], s.filename, {type:'image/jpeg'}));
    const shareData={ files, title:'새가족 사진', text:todaysShots.length+'장' };
    try{
      if(navigator.canShare && navigator.canShare(shareData)){
        await navigator.share(shareData);
      }else{
        alert('이 브라우저에서는 여러 장을 한 번에 공유할 수 없습니다.\n사진은 이미 다운로드 폴더에 저장되어 있으니, 갤러리(사진) 앱에서 직접 선택해 카톡으로 보내주세요.');
      }
    }catch(e){}   // 사용자가 공유창을 취소한 경우 등은 조용히 무시
  };

  /* ───── 사진 편집기 ─────
     기본 카메라 앱이 찍은 사진을 받아 이름·전화번호를 합성해 저장한다.
     (웹 카메라를 직접 쓰면 기본 앱의 1x 광각 렌즈에 접근할 수 없어 화각이
      좁아지는 문제가 있어, 촬영은 전적으로 기본 카메라 앱에 맡긴다.) */
  const ED = (function(){
    const photo=$('edPhoto'), nI=$('edName'), tI=$('edTel'), hintEl=$('edHint');
    const MAXPX=2400;                       // 긴 변 기준 최대 크기 (용량·속도 절충)
    let baseCanvas=null;                    // 방향까지 바로잡힌 원본
    let queue=[], qi=0;                     // 여러 장 선택했을 때의 처리 대기열
    let bright=false;

    function filterStr(){
      return bright ? 'brightness(1.32) contrast(1.03)' : 'none';
    }
    function applyPreviewFilter(){ photo.style.filter=filterStr(); }

    /* EXIF 방향까지 반영해서 이미지를 읽는다 */
    async function loadOriented(file){
      if(window.createImageBitmap){
        try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
        try{ return await createImageBitmap(file); }catch(e){}
      }
      return await new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>res(img);
        img.onerror=rej;
        img.src=URL.createObjectURL(file);
      });
    }

    async function showFile(file){
      const src=await loadOriented(file);
      const sw=src.width, sh=src.height;
      const k=Math.min(1, MAXPX/Math.max(sw,sh));
      const w=Math.round(sw*k), h=Math.round(sh*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(src,0,0,w,h);
      if(src.close) src.close();
      baseCanvas=cv; baseCanvas.__file=file;
      photo.src=cv.toDataURL('image/jpeg',0.92);
      applyPreviewFilter();

      nI.value=''; tI.value='';
      hintEl.textContent = queue.length>1 ? (qi+1)+' / '+queue.length+' 장' : '';
      renderChips();
      $('editor').classList.add('on');
      setTimeout(()=>nI.focus(),150);
    }

    function renderChips(){
      const box=$('edChips'); box.innerHTML='';
      (data.recent||[]).slice(0,10).forEach(r=>{
        const b=document.createElement('button');
        b.className='chip'; b.textContent=r.name||r.tel;
        b.onmousedown=e=>e.preventDefault();      // 입력 포커스 유지
        b.onclick=()=>{ nI.value=r.name||''; tI.value=r.tel||''; };
        box.appendChild(b);
      });
    }

    function fileBase(){
      const nm=safeSeg(nI.value)||'이름없음';
      const tel=fmtTel(tI.value).replace(/[\\/:*?"<>|\s]/g,'');
      const dateStr=stampOf(baseCanvas&&baseCanvas.__file);
      const n=nextCounter(dateStr);
      return dateStr+'_'+n+'_'+nm+(tel?'_'+tel:'');
    }

    /* 사진 아래쪽에 이름·전화번호를 같은 크기로 합성 */
    function compose(){
      const w=baseCanvas.width, h=baseCanvas.height;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.filter=filterStr();               // 미리보기와 똑같은 밝기로 저장
      ctx.drawImage(baseCanvas,0,0);
      ctx.filter='none';

      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      const barH=Math.round(h*0.16);
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(0,h-barH,w,barH);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
      const fs=Math.round(barH*0.36);       // 이름·전화번호 같은 크기
      if(nm){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(nm, w/2, h-barH*0.60);
      }
      if(tel){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(tel, w/2, h-barH*0.24);
      }
      return cv;
    }

    function saveShot(){
      if(!baseCanvas) return;
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      if(!nm && !tel){ hintEl.textContent='이름 또는 전화번호를 입력해주세요'; return; }
      const name=fileBase()+'.jpg';
      const composed=compose();

      // 벽걸이 태블릿에도 즉시 띄운다 (연결돼 있을 때만)
      const tvSend = TV.sendPhoto(composed, nm, tel).catch(()=>false);

      composed.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);

        pushRecent(nm,tel); save();
        addTodayShot(blob, name, nm, tel);
        $('homeLog').innerHTML='✅ 저장됨 · <b>'+name+'</b><br>(다운로드 폴더)';
        // 전송 결과는 위 문구가 찍힌 뒤에 덧붙여야 지워지지 않는다
        tvSend.then(ok=>{ if(ok) $('homeLog').innerHTML+='<br>📺 태블릿에 표시됨'; });

        // 여러 장을 골랐다면 다음 장으로, 아니면 편집기를 닫는다
        if(qi+1 < queue.length){ qi++; showFile(queue[qi]); }
        else{ queue=[]; qi=0; close(); }
      }, 'image/jpeg', 0.92);
    }

    function rotate(){
      if(!baseCanvas) return;
      const w=baseCanvas.width, h=baseCanvas.height;
      const rc=document.createElement('canvas'); rc.width=h; rc.height=w;
      const ctx=rc.getContext('2d');
      ctx.translate(h/2,w/2); ctx.rotate(Math.PI/2);
      ctx.drawImage(baseCanvas,-w/2,-h/2);
      rc.__file=baseCanvas.__file;
      baseCanvas=rc;
      photo.src=rc.toDataURL('image/jpeg',0.92);
    }

    function close(){
      $('editor').classList.remove('on');
      photo.src=''; baseCanvas=null;
    }

    async function start(files){
      const list=Array.prototype.slice.call(files||[]).filter(f=>f && f.type.indexOf('image')===0);
      if(!list.length) return;
      queue=list; qi=0;
      try{ await showFile(list[0]); }
      catch(e){ alert('사진을 불러오지 못했습니다.'); close(); }
    }

    $('edSave').onclick=saveShot;
    $('edRotate').onclick=rotate;
    $('edClose').onclick=()=>{ queue=[]; qi=0; close(); };
    $('edAgain').onclick=()=>{ queue=[]; qi=0; close(); $('fCam').click(); };
    $('edBright').onclick=()=>{
      bright=!bright;
      $('edBright').classList.toggle('sel', bright);
      applyPreviewFilter();
    };
    nI.addEventListener('input', ()=>{ if(hintEl.textContent.indexOf('입력')>=0) hintEl.textContent=''; });
    nI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tI.focus(); } });
    tI.addEventListener('input', e=>{ e.target.value=fmtTel(e.target.value); });
    tI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveShot(); } });

    return { start };
  })();

  $('bShoot').onclick=()=>$('fCam').click();
  $('bPick').onclick =()=>$('fPick').click();

  /* Ulike / HD Camera Pro 열기 — HTML 의 <a href="intent://..."> 가 직접 처리한다.
     Ulike 는 앱을 곧바로 여는 게 불가능했다(패키지 지정 / MAIN·LAUNCHER / ulike://
     전부 크롬·브레이브에서 실패 — 외부 실행 통로를 제공하지 않는 앱이었음).
     그래서 둘 다 처음부터 차선책(플레이스토어 대체주소)을 같이 넣어둔다.
     설치되어 있으면 스토어 페이지에 "열기" 버튼이 떠서 한 번 더 눌러 진입할 수 있다. */

  /* 봉사자에게 카톡 등으로 전달할 주소 복사 (여러 단계로 안전하게 시도) */
  function legacyCopy(text){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  /* 버튼 글자를 바꿀 때도 아이콘 칸(.ico)은 그대로 유지한다 */
  function setBtn(btn, icon, label){
    btn.innerHTML='<span class="ico">'+icon+'</span>';
    btn.appendChild(document.createTextNode(label));
  }

  $('bCopyUrl').onclick=async ()=>{
    const url='https://0702080.github.io/';
    const btn=$('bCopyUrl'); const orig=btn.lastChild ? btn.lastChild.nodeValue : '';
    const flash=(msg)=>{
      setBtn(btn,'🔗',msg);
      setTimeout(()=>setBtn(btn,'🔗',orig), 1800);
    };

    try{
      await navigator.clipboard.writeText(url);
      flash('복사됨 ✓ '+url);
      return;
    }catch(e){}

    if(legacyCopy(url)){ flash('복사됨 ✓ '+url); return; }

    try{ prompt('아래 주소를 길게 눌러 복사하세요', url); }
    catch(e){ $('homeLog').textContent='주소: '+url; }
  };

  $('fCam').addEventListener('change', e=>{ ED.start(e.target.files); e.target.value=''; });
  $('fPick').addEventListener('change', e=>{ ED.start(e.target.files); e.target.value=''; });

  /* ───── 폰: 태블릿과 짝 맺기 (최초 1회) ───── */
  const isTvMode = location.hash.toLowerCase().indexOf('tv')>=0;

  function tvStatus(){
    const btn=$('bTvLink');
    if(!data.tvCode){ setBtn(btn,'📺','태블릿 연결'); return; }
    setBtn(btn,'📺',(TV.isReady()?'태블릿 연결됨 ✓ ':'태블릿 연결 중… ')+data.tvCode);
  }
  async function tvConnectPhone(){
    if(!data.tvCode) return;
    try{
      await TV.connect(data.tvCode, { onStatus:tvStatus });   // 폰은 받지 않고 보내기만
    }catch(e){}
    tvStatus();
  }
  $('bTvLink').onclick=()=>{
    let v;
    try{
      v=prompt('태블릿 화면에 떠 있는 6자리 코드를 입력하세요.\n(연결을 끊으려면 비워두고 확인)', data.tvCode||'');
    }catch(e){ return; }
    if(v===null) return;
    const c=(v||'').trim().toUpperCase();
    data.tvCode=c||''; save();
    if(!c){ setBtn($('bTvLink'),'📺','태블릿 연결'); return; }
    tvConnectPhone();
  };
  // 태블릿 모드에서는 아래 startTvMode() 가 따로 연결하므로 여기서 연결하지 않는다
  // (둘 다 연결하면 서로 상대의 연결을 끊어버려 사진이 안 넘어감)
  if(!isTvMode){ if(data.tvCode) tvConnectPhone(); else tvStatus(); }

  /* ───── 태블릿 모드 (#tv 로 열었을 때) ───── */
  async function startTvMode(){
    document.documentElement.classList.add('tvmode');   // 가로 강제회전 CSS 예외
    document.getElementById('home').style.display='none';
    $('tv').classList.add('on');
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

    // 방 코드는 이 태블릿에 계속 저장해 둔다 (매번 바뀌면 폰을 다시 연결해야 하므로)
    if(!data.tvCode){ data.tvCode=TV.makeCode(); save(); }
    $('tvCode').textContent=data.tvCode;

    /* 코드를 눌러 복사 — PC에서 복사해 폰으로 붙여넣기 쉽게 */
    $('tvCode').onclick=async ()=>{
      const note=$('tvCopied');
      const flash=m=>{ note.textContent=m; setTimeout(()=>{ note.textContent=''; }, 2000); };
      try{
        await navigator.clipboard.writeText(data.tvCode);
        flash('복사됨 ✓');
        return;
      }catch(e){}
      if(legacyCopy(data.tvCode)){ flash('복사됨 ✓'); return; }
      // 복사가 막힌 환경 — 드래그로 직접 선택할 수 있게 통째로 선택해 준다
      try{
        const r=document.createRange(); r.selectNodeContents($('tvCode'));
        const s=getSelection(); s.removeAllRanges(); s.addRange(r);
        flash('길게 눌러 복사하세요');
      }catch(e2){}
    };

    /* ───── 사진 확대·이동 (마우스 휠 / 손가락 핀치 / 드래그) ───── */
    const stage=$('tvStage'), img=$('tvImg');
    let sc=1, tx=0, ty=0;
    const MIN=1, MAX=6;

    function applyTf(){
      img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
      img.classList.toggle('zoomed', sc>1.01);
      $('tvPct').textContent=Math.round(sc*100)+'%';
      // 확대해서 보는 동안에는 자동으로 사라지지 않게 멈춘다
      if(sc>1.01) holdClear(); else armClear();
    }
    function clampPan(){
      const st=stage.getBoundingClientRect();
      const w=img.clientWidth*sc, h=img.clientHeight*sc;
      const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
      tx=Math.min(mx,Math.max(-mx,tx));
      ty=Math.min(my,Math.max(-my,ty));
    }
    /* 화면상의 한 점을 기준으로 확대 (그 점이 제자리에 머물도록) */
    function zoomAt(px,py,next){
      const st=stage.getBoundingClientRect();
      const ox=px-st.left-st.width/2, oy=py-st.top-st.height/2;
      const s2=Math.min(MAX,Math.max(MIN,next));
      const u=(ox-tx)/sc, v=(oy-ty)/sc;
      tx=ox-u*s2; ty=oy-v*s2; sc=s2;
      if(sc<=1.001){ sc=1; tx=0; ty=0; }
      clampPan(); applyTf();
    }
    function resetZoom(){ sc=1; tx=0; ty=0; applyTf(); }

    const shown=()=>$('tvShow').classList.contains('on');

    stage.addEventListener('wheel', e=>{
      if(!shown()) return;
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, sc*(e.deltaY<0 ? 1.15 : 1/1.15));
    }, {passive:false});

    // 두 번 누르면 확대 ↔ 원래대로
    stage.addEventListener('dblclick', e=>{
      if(!shown()) return;
      if(sc>1.01) resetZoom(); else zoomAt(e.clientX,e.clientY,2.5);
    });

    // 포인터로 끌어서 이동 + 손가락 두 개로 핀치 확대
    const pts=new Map();
    let panning=false, lastX=0, lastY=0, pinchD=0, pinchS=1;
    stage.addEventListener('pointerdown', e=>{
      if(!shown()) return;
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}   // 캡처 실패해도 계속 진행
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===1){ panning=true; lastX=e.clientX; lastY=e.clientY; img.classList.add('dragging'); }
      else if(pts.size===2){
        panning=false; img.classList.remove('dragging');
        const [a,b]=[...pts.values()];
        pinchD=Math.hypot(a.x-b.x,a.y-b.y); pinchS=sc;
      }
    });
    stage.addEventListener('pointermove', e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2 && pinchD>0){
        const [a,b]=[...pts.values()];
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        zoomAt((a.x+b.x)/2,(a.y+b.y)/2, pinchS*(d/pinchD));
      }else if(panning && sc>1.01){
        tx+=e.clientX-lastX; ty+=e.clientY-lastY;
        lastX=e.clientX; lastY=e.clientY;
        clampPan(); applyTf();
      }
    });
    function endPt(e){
      pts.delete(e.pointerId);
      if(pts.size<2) pinchD=0;
      if(pts.size===0){ panning=false; img.classList.remove('dragging'); }
    }
    stage.addEventListener('pointerup', endPt);
    stage.addEventListener('pointercancel', endPt);

    $('tvIn').onclick =()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc*1.4); };
    $('tvOut').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc/1.4); };
    $('tvFit').onclick=resetZoom;

    /* ───── 표시 / 자동 비우기 ───── */
    let clearT=null;
    function armClear(){
      clearTimeout(clearT);
      if(!$('tvShow').classList.contains('on')) return;
      clearT=setTimeout(()=>{
        $('tvShow').classList.remove('on');
        $('tvIdle').style.display='';
        img.src='';
        sc=1; tx=0; ty=0;
        img.style.transform=''; img.classList.remove('zoomed');
        $('tvPct').textContent='100%';
      }, 15000);
    }
    function holdClear(){ clearTimeout(clearT); }

    function showPhoto(o){
      clearTimeout(clearT);
      img.src=o.img;
      sc=1; tx=0; ty=0; applyTf();      // 새 사진은 항상 원래 크기부터
      $('tvIdle').style.display='none';
      $('tvShow').classList.add('on');
      armClear();
    }
    try{
      await TV.connect(data.tvCode, {
        onPhoto: showPhoto,
        onStatus: ok=>{ $('tvDot').textContent = ok ? '● 연결됨' : '○ 연결 중…'; }
      });
    }catch(e){
      $('tvDot').textContent='연결할 수 없음 (인터넷 확인)';
    }
    // 화면 꺼짐 방지
    try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
  }
  if(isTvMode) startTvMode();

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  /* 세로 고정: 앱(홈 화면 아이콘)으로 실행 중이면 manifest 의 orientation:"portrait"
     로 자동 고정된다. 혹시 지원 안 되는 상황을 대비해 API로도 한 번 더 시도.
     (태블릿 확인 화면은 가로로 걸 수 있으므로 고정하지 않는다) */
  if(!isTvMode){
    try{
      if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
    }catch(e){}
  }
})();
</script>
