<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBEEDC">

<title>촬영명찰</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">


<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  :root{ --plum:#8B6E9E; }
  body{
    font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    background:#FFF9F1;color:#3E3348;
    -webkit-user-select:none;user-select:none;
  }

  /* ── 메인 화면 ── */
  #edit{
    height:100%;background:#FFF9F1;color:#3E3348;
    display:flex;flex-direction:column;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    gap:16px;
  }
  #edit h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  label{font-size:15px;font-weight:700;color:#555;margin-bottom:-8px;}
  .row{display:flex;gap:10px;}
  .go{
    flex:1;font-family:inherit;font-size:20px;font-weight:800;
    padding:20px;border:none;border-radius:14px;cursor:pointer;
    background:var(--plum);color:#fff;
  }
  .sub{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:20px 22px;border:2px solid #ddd;border-radius:14px;
    background:#fff;color:#666;cursor:pointer;
  }
  .recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
  .chip{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:9px 15px;border-radius:999px;border:1.5px solid #ddd;
    background:#f5f5f5;color:#333;cursor:pointer;
  }

  /* ── 원스텝 촬영 (피부보정 + 이름표 합성 + 자동저장) ── */
  #capture{position:fixed;inset:0;z-index:50;display:none;background:#000;flex-direction:column;}
  #capture.on{display:flex;}
  #capStage{position:relative;flex:1;overflow:hidden;background:#000;}
  #capVideo,#capPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #capVideo.on,#capPhoto.on{display:block;}
  #capTop{
    position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;padding:0 14px;z-index:2;
  }
  #capTop button{
    background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:999px;
    font-size:14px;font-weight:700;font-family:inherit;padding:10px 16px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  #capTop button.sel{background:#fff;color:#111;}
  #capShutterWrap{
    position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;z-index:2;
  }
  #capShutterWrap.hide{display:none;}
  #capShutter{
    width:74px;height:74px;border-radius:50%;padding:0;
    background:#fff;border:6px solid rgba(255,255,255,.35);cursor:pointer;
  }
  #capZoom{
    position:absolute;left:0;right:0;
    bottom:calc(max(26px,env(safe-area-inset-bottom)) + 92px);
    display:none;justify-content:center;gap:8px;z-index:2;
  }
  #capZoom.show{display:flex;}
  #capZoom button{
    background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:999px;
    font-size:13px;font-weight:700;font-family:inherit;padding:8px 14px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  #capZoom button.sel{background:#fff;color:#111;}
  #capFocusRing{
    position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;
    border:2px solid #fff;border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
    pointer-events:none;opacity:0;transition:opacity .25s;z-index:3;
  }
  #capFocusRing.show{opacity:1;}
  #capBottom{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:none;flex-direction:column;gap:10px;
    padding:14px 16px max(16px,env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.75) 42%);
  }
  #capBottom.on{display:flex;}
  #capBottom .row{gap:8px;}
  #capBottom input{
    font-size:20px;padding:12px 14px;border-radius:12px;border:none;
    background:rgba(255,255,255,.94);color:#111;font-weight:800;
    width:100%;font-family:inherit;
  }
  #capActions{display:flex;gap:10px;}
  #capActions>button{flex:1;padding:15px;border-radius:12px;font-size:16px;}
  #capHint{color:#f0e9da;font-size:12px;text-align:center;opacity:.9;min-height:15px;}
</style>
</head>
<body>


<!-- 메인 화면 -->
<div id="edit">
  <h1>🏷️ 촬영명찰 <span style="font-size:12px;color:#c8c8c8;font-weight:400">v53</span></h1>
  <label>📸 촬영 → 이름표 자동 저장</label>
  <button class="go" id="bCapture" style="padding:18px">📸 촬영하기 (피부보정 · 자동저장)</button>
</div>

<!-- 원스텝 촬영: 찍기 → 이름/번호 입력 → 자동 저장 -->
<div id="capture">
  <div id="capStage">
    <video id="capVideo" autoplay playsinline muted></video>
    <img id="capPhoto" alt="">
    <div id="capFocusRing"></div>
  </div>
  <div id="capTop">
    <button id="capClose">✕ 닫기</button>
    <button id="capRotate" style="display:none">↻ 방향 고치기</button>
    <button id="capBright">🔆 밝게</button>
  </div>
  <div id="capZoom"></div>
  <div id="capShutterWrap">
    <button id="capShutter" aria-label="촬영"></button>
  </div>
  <div id="capBottom">
    <div class="row">
      <input id="capName" type="text" placeholder="이름" autocomplete="off" enterkeyhint="next">
      <input id="capTel"  type="tel" inputmode="numeric" placeholder="전화번호(8자리)" autocomplete="off" enterkeyhint="done">
    </div>
    <div class="recent" id="capChips"></div>
    <div id="capHint"></div>
    <div id="capActions">
      <button class="sub" id="capRetake">다시 찍기</button>
      <button class="go"  id="capSave">저장</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS='nametag_v1';

  let data={recent:[]};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* 버튼 누를 때 진동 + "띡" 소리 */
  let actx=null;
  function beep(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx = new AC();
      if(actx.state === 'suspended') actx.resume();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(2200, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.09);
    }catch(e){}
  }
  function feedback(){
    try{ if(navigator.vibrate) navigator.vibrate(28); }catch(e){}
    beep();
  }
  // 모든 버튼에 공통 적용 (캡처 단계라 각 핸들러보다 먼저 실행)
  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('button')) feedback();
  }, true);


  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    let d=(v||'').replace(/\D/g,'');
    if(!d) return '';
    // 0으로 시작하지 않는 8자리 이하 = 010 생략 입력 → 010 자동 부여
    if(d[0]!=='0' && d.length<=8) d='010'+d;
    // 휴대폰(010): 010-XXXX-XXXX 로 진행형 표시
    if(d.startsWith('010')){
      const r=d.slice(3,11);
      if(!r) return '010';
      return r.length<=4 ? '010-'+r : '010-'+r.slice(0,4)+'-'+r.slice(4);
    }
    d=d.slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  function pushRecent(name,tel){
    if(!name&&!tel) return;
    data.recent=(data.recent||[]).filter(r=>!(r.name===name&&r.tel===tel));
    data.recent.unshift({name,tel});
    data.recent=data.recent.slice(0,8);
  }

  /* 화면 꺼짐 방지 (촬영 중 화면 잠김 방지) */
  let wl=null;
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wl){
        wl=await navigator.wakeLock.request('screen');
        wl.addEventListener('release',()=>{wl=null;});
      } else if(!on && wl){ await wl.release(); wl=null; }
    }catch(e){}
  }

  function safeSeg(s){
    return (s||'').replace(/[\\/:*?"<>|.]/g,'').replace(/\s+/g,'').trim();
  }
  function todayStamp(){
    const d=new Date(), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }

  /* ───── 원스텝 촬영: 찍기 → 이름/번호 입력 → 자동 저장 ─────
     피부 보정 + 이름표 합성 + 파일 저장을 한 화면에서 처리.
     (진짜 AI 피부보정은 웹에서 재현 불가 → 소프트 블러를 겹쳐 매끈한 느낌만 근사) */
  const CAP = (function(){
    const video=$('capVideo'), photo=$('capPhoto');
    const bottom=$('capBottom'), shutterWrap=$('capShutterWrap');
    const nI=$('capName'), tI=$('capTel'), hintEl=$('capHint');
    let stream=null, curTrack=null, shotCanvas=null, focusRingT=null, brightBoost=false;
    let curZoom=1, pinching=false, pinchStartDist=0, pinchStartZoom=1, recentPinch=false, pinchEndT=null;

    /* 미리보기(#capVideo)에 거는 필터와 저장 시 캔버스에 거는 필터가 반드시 같아야
       "찍을 때 보이던 그대로" 저장된다 (CSS 필터는 화면 표시에만 적용되고
       canvas drawImage 로는 절대 넘어오지 않음). "🔆 밝게" 를 켜면 두 곳 다 밝아진다. */
    function liveFilter(){
      return brightBoost
        ? 'contrast(1.05) saturate(1.08) brightness(1.35)'
        : 'contrast(1.05) saturate(1.08) brightness(1.02)';
    }
    function applyLiveFilter(){ video.style.filter=liveFilter(); }

    /* 기기가 지원하면 화면 필터뿐 아니라 실제 카메라 노출(exposure)도 올려서
       진짜로 더 밝게 찍히게 시도한다 (지원 안 해도 화면 밝기 보정은 항상 동작) */
    function applyExposureBoost(){
      if(!curTrack) return;
      try{
        const caps=curTrack.getCapabilities && curTrack.getCapabilities();
        if(!caps || !caps.exposureCompensation) return;
        const {min,max}=caps.exposureCompensation;
        const val=brightBoost ? max : Math.min(max, Math.max(min, 0));
        curTrack.applyConstraints({advanced:[{exposureCompensation:val}]}).catch(()=>{});
      }catch(e){}
    }

    async function openCam(retry){
      stopCam();
      video.classList.add('on'); photo.classList.remove('on');
      shutterWrap.classList.remove('hide');
      bottom.classList.remove('on');
      $('capRotate').style.display='none';
      $('capZoom').classList.remove('show');
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:'environment', width:{ideal:1080}, height:{ideal:1920} },
          audio:false
        });
        video.srcObject = stream;
        applyLiveFilter();
        // 일부 기기는 zoom 이 getUserMedia 제약으로는 안 먹고 트랙에 별도로 걸어야 적용됨
        const track=stream.getVideoTracks()[0];
        curTrack=track;
        try{
          const caps=track.getCapabilities && track.getCapabilities();
          if(caps && caps.zoom) await track.applyConstraints({advanced:[{zoom:caps.zoom.min}]});
        }catch(e2){}
        applyExposureBoost();
        setupZoomUI(track);
      }catch(e){
        // 방금 카메라를 껐다가 바로 다시 켤 때 기기가 아직 정리 중이라
        // 일시적으로 실패하는 경우가 있어, 잠깐 쉬었다가 한 번만 자동 재시도
        if(!retry){ setTimeout(()=>openCam(true), 500); return; }
        alert('카메라를 열 수 없습니다 ('+((e&&e.name)||'알 수 없는 오류')+').\n'
            + '브라우저에 카메라 권한을 허용했는지 확인해주세요.\n'
            + '다른 앱(카메라 앱 등)이 카메라를 쓰고 있다면 꺼주세요.');
        close();
      }
    }
    function stopCam(){
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      curTrack=null;
    }

    /* 화면 터치 지점에 초점을 맞춘다 (기기가 지원할 때만 실제 초점 이동,
       지원 안 해도 터치 피드백 사각형은 항상 보여줌).
       ※ 진짜 얼굴 자동 인식(Shape Detection FaceDetector)은 2026년 현재도
         크롬 실험 플래그 뒤에 있어 일반 사용자 폰에서 그냥 켜지지 않는다 —
         그래서 "터치로 초점 맞추기"만 넣고, 얼굴 자동 인식은 넣지 않았다. */
    function showFocusRing(x,y){
      const ring=$('capFocusRing');
      ring.style.left=x+'px'; ring.style.top=y+'px';
      ring.classList.remove('show'); void ring.offsetWidth; ring.classList.add('show');
      clearTimeout(focusRingT);
      focusRingT=setTimeout(()=>ring.classList.remove('show'), 700);
    }
    function focusAt(clientX, clientY){
      const rect=video.getBoundingClientRect();
      const tapX=clientX-rect.left, tapY=clientY-rect.top;
      showFocusRing(tapX, tapY);
      if(!curTrack) return;
      try{
        const cw=rect.width, ch=rect.height;
        const vw=video.videoWidth||cw, vh=video.videoHeight||ch;
        const scale=Math.max(cw/vw, ch/vh);          // object-fit:cover 와 같은 배율
        const offX=(vw*scale-cw)/2, offY=(vh*scale-ch)/2;
        let nx=(tapX+offX)/scale/vw, ny=(tapY+offY)/scale/vh;
        nx=Math.min(1,Math.max(0,nx)); ny=Math.min(1,Math.max(0,ny));

        const caps=curTrack.getCapabilities && curTrack.getCapabilities();
        if(!caps || !caps.pointsOfInterest) return;
        const adv={ pointsOfInterest:[{x:nx,y:ny}] };
        if(caps.focusMode){
          if(caps.focusMode.includes('single-shot')) adv.focusMode='single-shot';
          else if(caps.focusMode.includes('continuous')) adv.focusMode='continuous';
          else if(caps.focusMode.includes('manual')) adv.focusMode='manual';
        }
        curTrack.applyConstraints({advanced:[adv]}).catch(()=>{});
      }catch(e){}
    }
    video.addEventListener('click', e=>{ if(!recentPinch) focusAt(e.clientX, e.clientY); });

    /* 두 손가락으로 좁히고 벌려서 줌아웃/줌인 (핀치 줌) */
    function touchDist(t1,t2){
      const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY;
      return Math.hypot(dx,dy);
    }
    function updateZoomSel(z){
      Array.prototype.forEach.call($('capZoom').children, b=>{
        b.classList.toggle('sel', Math.abs(parseFloat(b.textContent)-z) < 0.05);
      });
    }
    video.addEventListener('touchstart', e=>{
      if(e.touches.length===2){
        pinching=true;
        pinchStartDist=touchDist(e.touches[0], e.touches[1]);
        pinchStartZoom=curZoom;
      }
    }, {passive:true});
    video.addEventListener('touchmove', e=>{
      if(!pinching || e.touches.length!==2 || !curTrack) return;
      const caps=curTrack.getCapabilities && curTrack.getCapabilities();
      if(!caps || !caps.zoom) return;
      const d=touchDist(e.touches[0], e.touches[1]);
      let z=pinchStartZoom*(d/pinchStartDist);          // 좁히면(거리↓) 줌아웃, 벌리면 줌인
      z=Math.min(caps.zoom.max, Math.max(caps.zoom.min, z));
      curZoom=z;
      curTrack.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
      updateZoomSel(z);
    }, {passive:true});
    video.addEventListener('touchend', e=>{
      if(pinching && e.touches.length<2){
        pinching=false; recentPinch=true;
        clearTimeout(pinchEndT);
        pinchEndT=setTimeout(()=>{ recentPinch=false; }, 300);   // 핀치 직후 뜨는 클릭이 초점버튼을 건드리지 않게
      }
    }, {passive:true});

    /* zoom 이 지원되는 기기에서만 1x/2x 같은 배율 버튼을 보여주고,
       탭하면 즉시 그 배율로 전환한다 (자동 1x 고정이 안 먹는 기기를 위한 수동 대안) */
    function setupZoomUI(track){
      const box=$('capZoom'); box.innerHTML='';
      const caps=track.getCapabilities && track.getCapabilities();
      if(!caps || !caps.zoom || caps.zoom.min===caps.zoom.max){
        box.classList.remove('show');
        return;
      }
      const min=caps.zoom.min, max=caps.zoom.max;
      curZoom=min;
      const levels=[min,1,max].filter(z=>z>=min && z<=max)
                              .filter((z,i,a)=>a.indexOf(z)===i)
                              .sort((a,b)=>a-b);
      levels.forEach(z=>{
        const b=document.createElement('button');
        b.textContent=(Math.round(z*10)/10)+'x';
        b.classList.toggle('sel', z===min);
        b.onclick=()=>{
          curZoom=z;
          track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
          updateZoomSel(z);
        };
        box.appendChild(b);
      });
      box.classList.add('show');
    }

    /* 회전 문제가 아니었다 — 미리보기(#capVideo)는 object-fit:cover 로
       화면 비율에 맞게 "잘라서" 보여주는데, 촬영은 그 자르기 없이 카메라
       원본 전체(더 넓은 화각)를 그대로 저장해서 "가로로 넓게" 나온 것.
       화면에 보이던 비율 그대로, 가운데를 기준으로 크롭해서 캡처한다. */
    function cropGeom(){
      const vw=video.videoWidth||1080, vh=video.videoHeight||1440;
      const screenAspect = window.innerWidth / window.innerHeight;   // 세로 화면 비율 (예: 9:19.5)
      const videoAspect  = vw / vh;
      let sx=0, sy=0, sw=vw, sh=vh;
      if(videoAspect > screenAspect){        // 원본이 화면보다 가로로 더 넓음 → 좌우를 자름
        sw = vh * screenAspect;
        sx = (vw - sw) / 2;
      } else if(videoAspect < screenAspect){ // 원본이 화면보다 세로로 더 김 → 위아래를 자름
        sh = vw / screenAspect;
        sy = (vh - sh) / 2;
      }
      return { sx, sy, sw, sh };
    }

    /* 촬영: 미리보기와 화각·비율·색감·밝기가 모두 동일하도록 화면에 보이던 부분만 캡처 */
    function shoot(){
      const c=cropGeom();
      const cv=document.createElement('canvas'); cv.width=c.sw; cv.height=c.sh;
      const ctx=cv.getContext('2d');
      ctx.filter=liveFilter();
      ctx.drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, c.sw, c.sh);
      ctx.filter='none';

      shotCanvas=cv;
      photo.src=cv.toDataURL('image/jpeg',0.92);
      photo.classList.add('on'); video.classList.remove('on');
      shutterWrap.classList.add('hide');
      $('capZoom').classList.remove('show');
      bottom.classList.add('on');
      $('capRotate').style.display='inline-block';
      stopCam();

      nI.value=''; tI.value=''; hintEl.textContent='';
      renderCapChips();
      setTimeout(()=>nI.focus(),120);
    }

    /* 자동 보정이 반대로 틀어졌을 때 수동으로 90도씩 돌리는 비상 버튼 */
    function rotateShot(){
      if(!shotCanvas) return;
      const w=shotCanvas.width, h=shotCanvas.height;
      const rc=document.createElement('canvas'); rc.width=h; rc.height=w;
      const rctx=rc.getContext('2d');
      rctx.translate(h/2, w/2);
      rctx.rotate(Math.PI/2);
      rctx.drawImage(shotCanvas, -w/2, -h/2);
      shotCanvas=rc;
      photo.src=shotCanvas.toDataURL('image/jpeg',0.92);
    }

    function renderCapChips(){
      const box=$('capChips'); box.innerHTML='';
      (data.recent||[]).slice(0,8).forEach(r=>{
        const b=document.createElement('button');
        b.className='chip'; b.textContent=r.name||r.tel;
        b.onmousedown=e=>e.preventDefault();
        b.onclick=()=>{ nI.value=r.name||''; tI.value=r.tel||''; };
        box.appendChild(b);
      });
    }

    function capFileBase(){
      const nm=safeSeg(nI.value)||'이름없음';
      const tel=fmtTel(tI.value).replace(/[\\/:*?"<>|\s]/g,'');
      return todayStamp()+'_'+nm+(tel?'_'+tel:'');
    }

    function saveShot(){
      if(!shotCanvas) return;
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      if(!nm && !tel){ hintEl.textContent='이름 또는 전화번호를 입력해주세요'; return; }

      const cv=document.createElement('canvas');
      cv.width=shotCanvas.width; cv.height=shotCanvas.height;
      const ctx=cv.getContext('2d');
      ctx.drawImage(shotCanvas,0,0);

      const w=cv.width, h=cv.height;
      const barH=Math.round(h*0.16);
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(0,h-barH,w,barH);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
      const fs=Math.round(barH*0.36);          // 이름·전화번호 같은 크기
      if(nm){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(nm, w/2, h-barH*0.60);
      }
      if(tel){
        ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
        ctx.fillText(tel, w/2, h-barH*0.24);
      }

      cv.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=capFileBase()+'.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);

        pushRecent(nm,tel); save();
        hintEl.textContent='✅ 저장됨: '+capFileBase()+'.jpg';
        setTimeout(openCam, 700);           // 바로 다음 사람 촬영으로
      }, 'image/jpeg', 0.92);
    }

    function open(){
      $('capture').classList.add('on');
      keepAwake(true);
      openCam();
    }
    function close(){
      stopCam();
      keepAwake(false);
      $('capture').classList.remove('on');
    }

    $('capShutter').onclick=shoot;
    $('capRetake').onclick=openCam;
    $('capSave').onclick=saveShot;
    $('capRotate').onclick=rotateShot;
    $('capClose').onclick=close;
    $('capBright').onclick=()=>{
      brightBoost=!brightBoost;
      $('capBright').classList.toggle('sel', brightBoost);
      applyLiveFilter();
      applyExposureBoost();
    };
    nI.addEventListener('input', ()=>{ if(hintEl.textContent) hintEl.textContent=''; });
    nI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tI.focus(); } });
    tI.addEventListener('input', e=>{ e.target.value=fmtTel(e.target.value); });
    tI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveShot(); } });

    return { open };
  })();
  $('bCapture').onclick = CAP.open;

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
