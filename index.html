<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBEEDC">

<title>촬영명찰</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏷️%3C/text%3E%3C/svg%3E">


<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  /* ── 색상 팔레트 ── */
  :root{
    --cream:#FBEEDC;   /* 배경 */
    --lilac:#BFA7CC;   /* 이름 */
    --plum:#8B6E9E;    /* 전화번호 */
    --rose:#E4C1D9;
    --mist:#D8CEDD;
    --deep:#4A3B57;    /* 어두운 배경 */
  }
  body{
    font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',-apple-system,sans-serif;
    background:var(--cream);color:var(--plum);
    transition:background .2s,color .2s;
    -webkit-user-select:none;user-select:none;
  }
  #name{color:var(--lilac);}
  #tel {color:var(--plum);}
  body.dark{background:var(--deep);}
  body.dark #name{color:var(--rose);}
  body.dark #tel {color:var(--cream);}



  /* ── 표시 화면 ── */
  #show{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 6px max(8px,env(safe-area-inset-bottom));
  }


  #name{
    font-weight:900;line-height:1;text-align:center;
    letter-spacing:.045em;white-space:nowrap;
    /* 숫자와 같은 굵기감을 내기 위해 외곽선을 더함 */
    -webkit-text-stroke:0.035em currentColor;
    text-stroke:0.035em currentColor;
    paint-order:stroke fill;
  }


  #tel{
    text-align:center;font-weight:900;letter-spacing:.025em;
    font-variant-numeric:tabular-nums;
    /* 안드로이드에서 숫자는 한글보다 얇은 폰트로 대체되므로
       외곽선을 더해 한글 굵기와 맞춤 */
    -webkit-text-stroke:0.028em currentColor;
    text-stroke:0.028em currentColor;
    paint-order:stroke fill;
  }


  .telline{line-height:1.0;white-space:nowrap;}

  /* 전화번호 편집용 실제 입력칸 (모바일 키보드 확실히 열림) */
  #telLive{
    display:none;width:100%;
    font-family:inherit;font-weight:900;letter-spacing:.025em;
    font-variant-numeric:tabular-nums;line-height:1;
    text-align:center;background:transparent;color:inherit;
    border:none;outline:none;padding:0;margin:0;
    -webkit-user-select:text;user-select:text;
    -webkit-text-stroke:0.028em currentColor;
    paint-order:stroke fill;
  }
  #telLive.on{display:block;}
  #telLive:focus{background:transparent;border:none;outline:none;}
  /* 편집 중에는 표시용 숫자를 무조건 숨김 (어떤 경로로도 다시 나타나지 않게) */
  #show.telediting #tel{display:none !important;}

  /* ── 화면에서 바로 고치기 (파워포인트식 인라인 편집) ── */
  #name,#tel{cursor:text;}
  #name.editing,#tel.editing{
    outline:3px dashed rgba(128,128,128,.5);
    outline-offset:10px;border-radius:10px;
  }
  #name[contenteditable],#tel .telline[contenteditable]{
    -webkit-user-select:text;user-select:text;
    min-width:1.2em;min-height:1em;
  }
  #name[contenteditable]:focus,#tel .telline[contenteditable]:focus{outline:none;}

  #empty{
    font-size:5vw;opacity:.35;text-align:center;line-height:1.7;font-weight:600;
  }



  /* ── 코너 버튼 (사진 방해 최소화) ── */
  .btns{position:fixed;inset:0;pointer-events:none;transition:opacity .35s;}
  .btns.hidden{opacity:0;}
  .btns.hidden .btn{pointer-events:none;}   /* 안 보일 땐 눌리지도 않게 */
  .btn{
    position:absolute;pointer-events:auto;
    background:rgba(128,128,128,.16);
    color:inherit;border:none;border-radius:999px;
    font-size:14px;font-weight:700;font-family:inherit;
    padding:10px 16px;cursor:pointer;backdrop-filter:blur(4px);
  }

  #bEdit{top:max(10px,env(safe-area-inset-top));left:10px;}
  #bTheme{top:max(10px,env(safe-area-inset-top));right:10px;}
  #bFull{bottom:max(10px,env(safe-area-inset-bottom));right:10px;}
  #bClear{bottom:max(10px,env(safe-area-inset-bottom));left:10px;}


  /* ── 편집 화면 ── */
  #edit{
    position:fixed;inset:0;z-index:10;background:#FFF9F1;color:#3E3348;
    display:none;flex-direction:column;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    gap:16px;overflow-y:auto;
  }

  #edit.on{display:flex;}
  #edit h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  label{font-size:15px;font-weight:700;color:#555;margin-bottom:-8px;}
  input{
    width:100%;font-family:inherit;font-size:30px;font-weight:800;
    padding:16px 18px;border:2.5px solid #ddd;border-radius:14px;
    background:#fafafa;color:#111;
  }

  input:focus{outline:none;border-color:var(--plum);background:#fff;}
  #tel_i{font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:10px;}
  /* 입력 영역: 기본(세로 화면)은 위아래로 쌓임 */
  .fields{display:flex;flex-direction:column;gap:16px;}
  .fld{display:flex;flex-direction:column;gap:8px;}
  .fld label{margin-bottom:0;}

  /* PC·가로 화면: 이름·전화번호·버튼을 한 줄로 */
  @media (min-width:700px){
    .fields{flex-direction:row;align-items:flex-end;gap:12px;}
    .fld{gap:6px;}
    .fld:nth-child(1){flex:1 1 288px;max-width:288px;min-width:130px;}  /* 이름 +20% */
    .fld:nth-child(2){flex:1 1 300px;max-width:300px;min-width:150px;}  /* 전화 +20% */
    .fields input{font-size:24px;padding:13px 15px;}
    #edit{padding-top:20px;}
  }
  .go{
    flex:1;font-family:inherit;font-size:20px;font-weight:800;
    padding:20px;border:none;border-radius:14px;cursor:pointer;
    background:var(--plum);color:#fff;
  }
  .sub{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:20px 22px;border:2px solid #ddd;border-radius:14px;
    background:#fff;color:#666;cursor:pointer;
  }
  .recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
  .chip{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:9px 15px;border-radius:999px;border:1.5px solid #ddd;
    background:#f5f5f5;color:#333;cursor:pointer;
  }
  .hint{font-size:13px;color:#999;line-height:1.6;margin-top:2px;}

  /* ── 색상 조절 패널 (전체화면에서도 사용) ── */
  #palette{
    position:fixed;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
    padding:16px;
  }
  #palette.on{display:flex;}
  .pal-box{
    background:#fff;color:#333;border-radius:18px;
    padding:20px;width:100%;max-width:380px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    max-height:92vh;overflow-y:auto;
    scrollbar-width:none;        /* 스크롤바 완전히 감춤 (스크롤은 그대로 동작) */
    -ms-overflow-style:none;
  }
  .pal-box::-webkit-scrollbar{display:none;width:0;height:0;}
  .pal-box h2{font-size:18px;font-weight:800;margin-bottom:14px;}
  .pal-row{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .pal-row>span{font-size:15px;font-weight:700;width:66px;flex:0 0 auto;}
  .pal-row input[type=color]{
    width:52px;height:40px;border:2px solid #ddd;border-radius:10px;
    background:none;cursor:pointer;padding:2px;flex:0 0 auto;
  }
  .pal-row b{font-size:13px;font-family:monospace;color:#777;width:66px;flex:0 0 auto;}
  .pal-row i{font-size:12.5px;font-style:normal;color:#888;flex:1;text-align:right;}
  .pal-row i.bad{color:#c0392b;font-weight:700;}
  .pal-row i.ok{color:#1d7a45;font-weight:700;}
  .pal-presets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px;}
  .pset{
    border:1.5px solid #ddd;border-radius:10px;cursor:pointer;
    padding:6px 8px;display:flex;align-items:center;gap:5px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:#555;background:#fff;
  }
  .pset .sw{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.15);}

  /* ── 새 색상 선택 UI ── */
  .ptabs{display:flex;gap:6px;margin-bottom:12px;}
  .ptab{
    flex:1;font-family:inherit;font-size:15px;font-weight:800;
    padding:12px 4px;border:2px solid #e2e2e2;border-radius:12px;
    background:#fafafa;color:#777;cursor:pointer;
  }
  /* 선택 표시는 테두리로만 (배경은 각자 담당 색이 들어감) */
  .ptab.on{border-width:3px;border-color:#2B2333;box-shadow:0 0 0 3px rgba(43,35,51,.22);}

  .pcur{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .pcur-sw{width:44px;height:36px;border-radius:9px;border:2px solid #ddd;flex:0 0 auto;}
  .pcur b{font-size:14px;font-family:monospace;color:#666;}
  .pcur i{font-size:12.5px;font-style:normal;color:#888;flex:1;text-align:right;}
  .pcur i.bad{color:#c0392b;font-weight:800;}
  .pcur i.ok{color:#1d7a45;font-weight:800;}

  .psec{font-size:13px;font-weight:700;color:#999;margin:14px 0 7px;}

  .swgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
  .swgrid .sw{
    aspect-ratio:1/1;border-radius:8px;border:1.5px solid rgba(0,0,0,.14);
    cursor:pointer;padding:0;
  }
  .swgrid .sw.sel{outline:3px solid #3E3348;outline-offset:2px;}
  .swgrid .none{
    grid-column:1/-1;font-size:12.5px;color:#bbb;padding:6px 2px;text-align:center;
  }

  .rng{
    -webkit-appearance:none;appearance:none;
    width:100%;height:26px;border-radius:13px;margin:8px 0 4px;
    border:1.5px solid #ddd;padding:0;background:#eee;
  }
  .rng::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid #3E3348;cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  /* ── 사진 일괄 이름 붙이기 ── */
  #batch{
    position:fixed;inset:0;z-index:30;display:none;
    flex-direction:column;background:#FFF9F1;color:#3E3348;
    padding-top:env(safe-area-inset-top);
  }
  #batch.on{display:flex;}
  .bt-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;border-bottom:1px solid #eadfd0;flex:0 0 auto;
  }
  .bt-head h1{font-size:19px;font-weight:800;flex:1;}
  .bt-x{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:10px 16px;border:2px solid #ddd;border-radius:10px;
    background:#fff;color:#666;cursor:pointer;
  }
  .bt-actions{display:flex;gap:10px;padding:12px 16px 8px;flex:0 0 auto;}
  .bt-actions>button{flex:1;padding:14px;font-size:16px;border-radius:12px;}
  .bt-chips{
    display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;flex:0 0 auto;
    scrollbar-width:none;
  }
  .bt-chips::-webkit-scrollbar{display:none;}
  .bt-chips .chip{flex:0 0 auto;font-size:14px;padding:8px 13px;}
  .bt-list{flex:1;overflow-y:auto;padding:0 16px 24px;}
  .bt-empty{color:#b3a894;font-size:14px;text-align:center;line-height:1.9;padding:40px 10px;}
  .bt-row{
    display:flex;gap:10px;align-items:center;
    padding:11px 0;border-bottom:1px solid #f0e6da;
  }
  .bt-row.done{opacity:.5;}
  .bt-thumb{
    width:62px;height:62px;object-fit:cover;border-radius:10px;
    flex:0 0 auto;background:#eee;border:1px solid #e3d8c8;
  }
  .bt-f{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .bt-f input{
    width:100%;font-family:inherit;font-size:17px;font-weight:700;
    padding:9px 11px;border:2px solid #ddd;border-radius:10px;background:#fff;color:#111;
  }
  .bt-f input:focus{outline:none;border-color:var(--plum);}
  .bt-fn{font-size:11px;color:#8B6E9E;word-break:break-all;line-height:1.45;}
  .bt-save{
    flex:0 0 auto;font-family:inherit;font-size:14px;font-weight:800;
    padding:14px 12px;border:2px solid #ddd;border-radius:10px;
    background:#fff;color:#555;cursor:pointer;
  }
  .bt-row.done .bt-save{background:#e9f5ec;border-color:#9CC7A8;color:#1d7a45;}
  .bt-when{font-size:11px;color:#a99b86;line-height:1.45;}
  .bt-when b{color:#1d7a45;}
  .bt-when .warn{color:#c0392b;font-weight:700;}
  .bt-thumb{cursor:zoom-in;}

  /* 썸네일 크게 보기 */
  #btZoom{
    position:fixed;inset:0;z-index:40;display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);padding:12px;
  }
  #btZoom.on{display:flex;}
  #btZoom img{max-width:100%;max-height:100%;border-radius:10px;}

  /* 하단 버튼: 두 개를 정확히 같은 폭으로 */
  .palbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .palbtns>button{width:100%;padding:16px;margin:0;border-radius:14px;font-size:18px;}

  .rng::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:#fff;border:3px solid #3E3348;cursor:pointer;
  }

  /* ── 원스텝 촬영 (피부보정 + 이름표 합성 + 자동저장) ── */
  #capture{position:fixed;inset:0;z-index:50;display:none;background:#000;flex-direction:column;}
  #capture.on{display:flex;}
  #capStage{position:relative;flex:1;overflow:hidden;background:#000;}
  #capVideo,#capPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #capVideo.on,#capPhoto.on{display:block;}
  #capVideo{filter:contrast(1.05) saturate(1.08) brightness(1.02);}
  #capTop{
    position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;padding:0 14px;z-index:2;
  }
  #capTop button{
    background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:999px;
    font-size:14px;font-weight:700;font-family:inherit;padding:10px 16px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  #capShutterWrap{
    position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;z-index:2;
  }
  #capShutterWrap.hide{display:none;}
  #capShutter{
    width:74px;height:74px;border-radius:50%;padding:0;
    background:#fff;border:6px solid rgba(255,255,255,.35);cursor:pointer;
  }
  #capBottom{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:none;flex-direction:column;gap:10px;
    padding:14px 16px max(16px,env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.75) 42%);
  }
  #capBottom.on{display:flex;}
  #capBottom .row{gap:8px;}
  #capBottom input{
    font-size:20px;padding:12px 14px;border-radius:12px;border:none;
    background:rgba(255,255,255,.94);color:#111;font-weight:800;
    width:100%;font-family:inherit;
  }
  #capActions{display:flex;gap:10px;}
  #capActions>button{flex:1;padding:15px;border-radius:12px;font-size:16px;}
  #capHint{color:#f0e9da;font-size:12px;text-align:center;opacity:.9;min-height:15px;}
</style>
</head>
<body>



<!-- 표시 화면 -->
<div id="show">
  <div id="name"></div>
  <div id="tel"></div>
  <input id="telLive" type="tel" inputmode="numeric" autocomplete="off" enterkeyhint="done">
  <div id="empty">이름과 전화번호를 입력하세요<br>왼쪽 위 <b>편집</b> 버튼</div>
</div>


<div class="btns" id="btns">
  <button class="btn" id="bEdit">✏️ 편집</button>
  <button class="btn" id="bTheme">🎨 색상</button>
  <button class="btn" id="bClear">✕ 지우기</button>
  <button class="btn" id="bFull">⛶ 전체화면</button>
</div>


<!-- 편집 화면 -->
<div id="edit">
  <h1>🏷️ 명찰 입력 <span style="font-size:12px;color:#c8c8c8;font-weight:400">v39</span></h1>
  <div class="fields">
    <div class="fld">
      <label for="name_i">이름</label>
      <input id="name_i" type="text" placeholder="김재식" autocomplete="off" enterkeyhint="next">
    </div>
    <div class="fld">
      <label for="tel_i">전화번호 <span style="font-weight:400;color:#999">(010 생략, 8자리)</span></label>
      <input id="tel_i" type="tel" inputmode="numeric" placeholder="33334444" autocomplete="off" enterkeyhint="done">
    </div>
  </div>

  <label style="margin-top:8px">📸 촬영 → 이름표 자동 저장 (가장 간단)</label>
  <button class="go" id="bCapture" style="padding:18px">📸 촬영하기 (피부보정 · 자동저장)</button>
  <div class="hint" style="margin-top:0">찍고 이름·전화번호만 입력하면<br><b>날짜_이름_전화번호.jpg</b>로 바로 저장됩니다</div>

  <label style="margin-top:10px">기타 방법 (Ulike 등 외부 앱을 쓰고 싶을 때)</label>
  <div class="hint" id="fnPreview" style="margin-top:0"></div>
  <div class="row">
    <button class="sub" id="bUlike"  style="flex:1;padding:14px">① Ulike 열기</button>
    <button class="sub" id="bCamera" style="flex:1;padding:14px">① 기본 카메라</button>
  </div>
  <button class="go" id="bBatch" style="padding:16px">② 사진 이름 붙이기 (여러 장)</button>
  <div class="hint" id="renameLog" style="margin-top:0"></div>
  <input type="file" id="fPick" accept="image/*" multiple style="display:none">
  <input type="file" id="fCam"  accept="image/*" capture="environment" style="display:none">

  <label style="margin-top:8px">📡 실시간 공유 (다른 폰에 즉시 표시)</label>
  <div class="hint" id="mirrorBox" style="margin-top:0"></div>
  <div class="row">
    <button class="sub" id="bRoom" style="flex:1;padding:14px">방 코드 변경</button>
    <button class="sub" id="bCopy" style="flex:1;padding:14px">공유 주소 복사</button>
  </div>
</div>


<!-- 색상 조절 패널 -->
<div id="palette">
  <div class="pal-box">
    <h2>🎨 색상 바꾸기</h2>

    <div class="ptabs" id="ptabs">
      <button class="ptab on" data-k="name">이름</button>
      <button class="ptab" data-k="tel">전화번호</button>
      <button class="ptab" data-k="bg">배경</button>
    </div>

    <div class="pcur">
      <span class="pcur-sw" id="curSw"></span>
      <b id="curHex">#000000</b>
    </div>

      <b>⏱ 촬영 시각으로 이름이 자동으로 채워집니다</b></div>

      <input id="capTel"  type="tel" inputmode="numeric" placeholder="전화번호(8자리)" autocomplete="off" enterkeyhint="done">
    </div>

    <div id="capHint"></div>

<script src="mqtt.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const showEl=$('show'), nameEl=$('name'), telEl=$('tel'), emptyEl=$('empty');
  const editEl=$('edit'), nameI=$('name_i'), telI=$('tel_i');
  const btns=$('btns');
  const LS='nametag_v1';

  let data={name:'',tel:'',dark:false,recent:[]};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* 버튼 누를 때 진동 + "띡" 소리 */
  let actx=null;
  function beep(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx = new AC();
      if(actx.state === 'suspended') actx.resume();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(2200, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.09);
    }catch(e){}
  }
  function feedback(){
    try{ if(navigator.vibrate) navigator.vibrate(28); }catch(e){}
    beep();
  }
  // 모든 버튼에 공통 적용 (캡처 단계라 각 핸들러보다 먼저 실행)
  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('button')) feedback();
  }, true);


  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    let d=(v||'').replace(/\D/g,'');
    if(!d) return '';
    // 0으로 시작하지 않는 8자리 이하 = 010 생략 입력 → 010 자동 부여
    if(d[0]!=='0' && d.length<=8) d='010'+d;
    // 휴대폰(010): 010-XXXX-XXXX 로 진행형 표시
    if(d.startsWith('010')){
      const r=d.slice(3,11);
      if(!r) return '010';
      return r.length<=4 ? '010-'+r : '010-'+r.slice(0,4)+'-'+r.slice(4);
    }
    d=d.slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }


  /* 전화번호 줄 구성 */
  function setTelLines(lines){
    telEl.innerHTML='';
    lines.forEach(t=>{
      const d=document.createElement('div');
      d.className='telline'; d.textContent=t;
      telEl.appendChild(d);
    });
    telEl.style.display = lines.length ? 'block' : 'none';
  }



  /* 이름과 전화번호를 "같은 글자 크기"로, 화면에 최대한 크게 */
  /* 한글과 숫자는 같은 폰트 크기라도 실제 글자 높이가 다르다.
     캔버스로 실제 잉크 높이를 재서 두 줄의 글자 높이를 똑같이 맞춘다. */
  let inkCv = null;
  function inkH(ctx, text){
    const m = ctx.measureText(text);
    const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
    return (a===undefined || d===undefined) ? 0 : (a + d);
  }
  function telScale(){
    try{
      const nameTxt = nameEl.textContent || '';
      const telTxt  = Array.prototype.map.call(telEl.children, d=>d.textContent).join('');
      if(!nameTxt || !telTxt) return 1;
      if(!inkCv) inkCv = document.createElement('canvas');
      const ctx = inkCv.getContext('2d');
      ctx.font = '900 100px ' + getComputedStyle(nameEl).fontFamily;
      const hn = inkH(ctx, nameTxt);
      const ht = inkH(ctx, telTxt);
      if(hn > 0 && ht > 0){
        const k = hn / ht;
        return Math.min(1.6, Math.max(0.6, k));   // 과도한 배율 방지
      }
    }catch(e){}
    return 1;
  }

  function fitBoth(availW, availH, gap){
    const hasName = !!nameEl.textContent || nameEl.isContentEditable;  // 편집 중엔 비어도 표시
    const hasTel  = telEl.children.length > 0;
    nameEl.style.display = hasName ? 'block' : 'none';
    if(!hasName && !hasTel) return 0;

    const k = (hasName && hasTel) ? telScale() : 1;   // 전화번호 글자 배율
    const NB = 1.03;                                   // 이름만 3% 더 크게

    let lo=10, hi=1000;
    for(let i=0;i<24;i++){
      const mid=(lo+hi)/2;
      nameEl.style.fontSize=(mid*NB)+'px';
      telEl.style.fontSize=(mid*k)+'px';

      let ok=true;
      if(hasName && nameEl.scrollWidth>availW) ok=false;
      if(ok && hasTel){
        for(const d of telEl.children) if(d.scrollWidth>availW){ ok=false; break; }
      }
      if(ok){
        const h=(hasName?nameEl.scrollHeight:0)
              + (hasTel ?telEl.scrollHeight :0)
              + ((hasName&&hasTel)?gap:0);
        if(h>availH) ok=false;
      }
      if(ok) lo=mid; else hi=mid;
    }
    const s=Math.floor(lo);
    nameEl.style.fontSize=Math.floor(s*NB)+'px';
    telEl.style.fontSize=Math.floor(s*k)+'px';
    return s;
  }



  /* 세로 표시용 전화번호 분할
     010-3333-4444  →  "3333" / "4444"  (010 생략, 하이픈 없음) */
  function telLines(tel){
    if(!tel) return [];
    const parts=tel.split('-').filter(Boolean);
    if(parts.length<=1) return parts;
    // 휴대폰(010)이면 앞자리 생략해 뒷번호만 크게
    if(parts[0]==='010' && parts.length===3) return parts.slice(1);
    return parts;
  }


  /* ───── 전체화면에서 바로 고치기 (파워포인트식) ─────
     이름·전화번호를 클릭하면 그 자리에서 커서가 생겨 수정 가능 */
  let telEditing = false, inlineBackup = null;

  function setCE(el){                        // plaintext-only 우선, 미지원 시 true
    el.setAttribute('contenteditable','plaintext-only');
    if(el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable','true');
  }
  function selAll(el){
    const r=document.createRange(); r.selectNodeContents(el);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function caretEnd(el){
    const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function isInlineEditing(){ return nameEl.isContentEditable || telEditing; }

  /* 이름 인라인 편집 */
  function startEditName(){
    if(nameEl.isContentEditable) return;
    endEditTel(true);
    inlineBackup = data.name;
    setCE(nameEl);
    nameEl.classList.add('editing');
    render({keepDom:true});
    nameEl.focus(); selAll(nameEl);
  }
  function endEditName(commit){
    if(!nameEl.isContentEditable) return;
    const txt = nameEl.textContent.replace(/\s+/g,' ').trim();
    nameEl.removeAttribute('contenteditable');
    nameEl.classList.remove('editing');
    data.name = commit ? txt : inlineBackup;
    if(commit){ pushRecent(data.name, data.tel); save(); logShown(); MIRROR.publish(); }
    render();
  }

  /* 전화번호 인라인 편집 — 실제 <input>을 겹쳐 써서 모바일 키보드를 확실히 띄움 */
  const telLive = $('telLive');
  const isDigit = c => c>='0' && c<='9';

  /* 커서 위치 유지용: 커서 왼쪽의 숫자 개수를 기준으로 되돌린다
     (값을 다시 대입하면 커서가 맨 끝으로 튀는 문제 해결) */
  function digitsBefore(str, pos){
    let n=0;
    for(let i=0; i<pos && i<str.length; i++) if(isDigit(str[i])) n++;
    return n;
  }
  function posAfterDigits(str, n){
    if(n<=0) return 0;
    let c=0;
    for(let i=0; i<str.length; i++){
      if(isDigit(str[i])){ c++; if(c===n) return i+1; }
    }
    return str.length;
  }

  telLive.addEventListener('input', ()=>{
    const raw   = telLive.value;
    const caret = (telLive.selectionStart==null) ? raw.length : telLive.selectionStart;
    const keep  = digitsBefore(raw, caret);          // 커서 왼쪽 숫자 개수 기억
    const f     = fmtTel(raw);
    if(raw !== f){
      telLive.value = f;
      const p = posAfterDigits(f, keep);             // 같은 숫자 개수 뒤로 커서 복원
      try{ telLive.setSelectionRange(p, p); }catch(e){}
    }
    data.tel = f;
  });

  telLive.addEventListener('blur', ()=>endEditTel(true));
  telLive.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); endEditTel(true); return; }
    if(e.key==='Escape'){ e.preventDefault(); endEditTel(false); return; }

    /* 백스페이스가 하이픈 위에 걸리면 그 앞의 숫자를 지움 */
    if(e.key==='Backspace'){
      const v=telLive.value, s=telLive.selectionStart, en=telLive.selectionEnd;
      if(s===en && s>1 && !isDigit(v[s-1])){
        e.preventDefault();
        const j=s-2;                                 // 하이픈 앞 숫자 위치
        if(j<0) return;
        telLive.value = v.slice(0,j) + v.slice(j+1);
        try{ telLive.setSelectionRange(j, j); }catch(err){}
        telLive.dispatchEvent(new Event('input',{bubbles:true}));
      }
    }
  });
  function startEditTel(){
    if(telEditing) return;
    endEditName(true);
    inlineBackup = data.tel;

    // ① 최대 길이 기준으로 글자 크기를 산정 (입력 중 넘치지 않게)
    //    ※ render 가 편집 중엔 조기 반환하므로 telEditing 을 켜기 전에 계산
    setTelLines(['010-0000-0000']);
    render({keepDom:true});
    // 실제 폰 글꼴은 폭이 조금씩 달라 딱 맞추면 잘린다 → 15% 여유
    const fs = Math.max(16, Math.floor(parseFloat(telEl.style.fontSize||'40') * 0.85)) + 'px';

    // ② 이제 편집 상태로 전환하고, 표시용 숫자를 감추고 입력칸으로 교체
    telEditing = true;
    showEl.classList.add('telediting');        // CSS 로 확실히 숨김
    telEl.style.display = 'none';
    telLive.style.fontSize = fs;
    telLive.style.color = colors().tel;
    telLive.value = data.tel || '';
    telLive.classList.add('on');
    void telLive.offsetHeight;                 // 강제 리플로우 후 포커스
    telLive.focus();
    if(telLive.setSelectionRange){
      const n = telLive.value.length;
      try{ telLive.setSelectionRange(n, n); }catch(e){}
    }

    // ③ 그래도 포커스가 안 잡히면 입력 화면으로 대체
    setTimeout(()=>{
      if(telEditing && document.activeElement !== telLive){
        endEditTel(false);
        openEdit();
        setTimeout(()=>{ telI.focus(); if(telI.select) telI.select(); }, 80);
      }
    }, 400);
  }
  function endEditTel(commit){
    if(!telEditing) return;
    telEditing = false;
    telLive.classList.remove('on');
    showEl.classList.remove('telediting');
    telEl.style.display = '';
    telEl.classList.remove('editing');
    data.tel = commit ? fmtTel(telLive.value) : inlineBackup;
    if(commit){ pushRecent(data.name, data.tel); save(); logShown(); MIRROR.publish(); }
    render();
  }

  function render(opts){
    opts = opts || {};
    applyColors();

    const editingNow = nameEl.isContentEditable || telEditing;
    const has = !!(data.name||data.tel) || editingNow;
    emptyEl.style.display = has ? 'none' : 'block';
    // 편집 중에는 DOM을 갈아엎지 않음 (커서 유지)
    if(!opts.keepDom && !nameEl.isContentEditable) nameEl.textContent = data.name||'';
    if(!has){ setTelLines([]); nameEl.style.display='none'; return; }

    const W=window.innerWidth, H=window.innerHeight;
    const portrait = H >= W;          // 세로 모드

    // 가로 모드는 여백을 20px만 남기고 최대한 크게
    const availW = portrait ? W*0.97 : (W - 20);
    const availH = portrait ? H*0.88 : (H - 20);

    // 이름과 전화번호 사이 여백
    const gap = portrait ? H*0.07 : H*0.04;
    showEl.style.gap = gap+'px';

    // ★ 전화번호 편집 중에는 표시용 숫자를 계속 숨김
    //   (모바일 키보드가 올라오면 resize→render 가 불려 입력칸과 겹쳐 보이던 문제)
    if(telEditing){
      telEl.style.display = 'none';
      return;                       // 크기도 그대로 유지 (입력 중 흔들림 방지)
    }

    // 세로: 두 줄 / 가로: 한 줄 (둘 다 010 은 생략해 숫자를 더 크게)
    if(!opts.keepDom){
      let lines = [];
      if(data.tel){
        const parts = telLines(data.tel);          // 010 제거된 조각들
        lines = portrait ? parts : [parts.join('-')];
      }
      setTelLines(lines);
    }

    // 이름 · 전화번호를 같은 크기로 최대한 크게
    fitBoth(availW, availH, gap);
  }


  function pushRecent(name,tel){
    if(!name&&!tel) return;
    data.recent=(data.recent||[]).filter(r=>!(r.name===name&&r.tel===tel));
    data.recent.unshift({name,tel});
    data.recent=data.recent.slice(0,8);
  }


  /* 화면 꺼짐 방지 */
  let wl=null;
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wl){
        wl=await navigator.wakeLock.request('screen');
        wl.addEventListener('release',()=>{wl=null;});
      } else if(!on && wl){ await wl.release(); wl=null; }
    }catch(e){}
  }

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && !editEl.classList.contains('on')) keepAwake(true);
  });


  /* 버튼: 평소엔 완전히 숨김, 화면을 터치하면 나타남 */
  let hideT;
  function hideBtns(){ clearTimeout(hideT); btns.classList.add('hidden'); }
  function poke(){                       // 터치 시 4초간 표시
    clearTimeout(hideT);
    btns.classList.remove('hidden');
    if (data.name || data.tel) hideT=setTimeout(()=>btns.classList.add('hidden'),4000);
  }
  showEl.addEventListener('pointerdown',poke);

  /* 이름·전화번호를 클릭하면 그 자리에서 편집 시작 */
  nameEl.addEventListener('click', e=>{ e.stopPropagation(); startEditName(); });
  telEl .addEventListener('click', e=>{ e.stopPropagation(); startEditTel(); });
  nameEl.addEventListener('blur',  ()=>endEditName(true));
  /* 이름 ↔ 전화번호 칸 이동 */
  function moveToName(){ endEditTel(true);  startEditName(); }
  function moveToTel (){ endEditName(true); startEditTel();  }

  document.addEventListener('keydown', e=>{
    // 편집 화면(입력 폼)이나 촬영 화면이 열려 있으면 방향키는 그대로 둠
    if(editEl.classList.contains('on')) return;
    if($('capture').classList.contains('on')) return;

    if(!isInlineEditing()){
      // 편집 중이 아닐 때: ↓ 이름부터, ↑ 전화번호부터 편집 시작
      if(e.key==='ArrowDown'){ e.preventDefault(); startEditName(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); startEditTel(); }
      return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      if(nameEl.isContentEditable) endEditName(true); else endEditTel(true);
    } else if(e.key==='Escape'){
      e.preventDefault(); e.stopPropagation();
      if(nameEl.isContentEditable) endEditName(false); else endEditTel(false);
    } else if(e.key==='ArrowDown'){
      e.preventDefault(); e.stopPropagation();
      if(nameEl.isContentEditable) moveToTel();    // 이름 → 아래 칸(전화번호)
    } else if(e.key==='ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      if(telEditing) moveToName();                 // 전화번호 → 위 칸(이름)
    }
  }, true);

  function openEdit(){
    nameI.value=data.name; telI.value=data.tel;
    editEl.classList.add('on'); keepAwake(false);
    MIRROR.status(); fnPreview();
    setTimeout(()=>nameI.focus(),60);
  }


  /* 홈 화면 앱으로 실행 중이면 이미 전체화면 → 크롬 안내문구 안 뜸 */
  function isAppMode(){
    return window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }


  function goFull(){
    if(document.fullscreenElement || isAppMode()) return;
    try{
      const p = document.documentElement.requestFullscreen?.({navigationUI:'hide'});
      if(p && p.catch) p.catch(()=>{});
    }catch(e){}
  }


  function applyEdit(){
    data.name=nameI.value.trim();
    data.tel=fmtTel(telI.value);
    pushRecent(data.name,data.tel);
    save(); logShown();
    MIRROR.publish();                   // 다른 폰에 즉시 전송
    editEl.classList.remove('on');
    nameI.blur(); telI.blur();          // 키보드 내리기
    goFull();                           // 입력 즉시 전체화면
    render(); keepAwake(true);

  function hexLum(h){
    const m=h.replace('#','').match(/../g).map(x=>parseInt(x,16)/255)
      .map(v=> v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4));
    return 0.2126*m[0]+0.7152*m[1]+0.0722*m[2];
  }
  function contrast(a,b){
    const l1=hexLum(a), l2=hexLum(b);

  /* ── 색상 변환 도우미 ── */
  function hex2rgb(h){
    const m=h.replace('#','').match(/../g).map(x=>parseInt(x,16));
    return {r:m[0],g:m[1],b:m[2]};
  }
  function rgb2hex(r,g,b){
    const f=v=>('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);
    return '#'+f(r)+f(g)+f(b);
  }
  function hsl2hex(h,s,l){
    h=((h%360)+360)%360; s/=100; l/=100;
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
    let r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;}
    else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;}
    else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    return rgb2hex((r+m)*255,(g+m)*255,(b+m)*255);
  }
  function hex2hsl(hex){
    const {r,g,b}=hex2rgb(hex);
    const R=r/255,G=g/255,B=b/255;
    const mx=Math.max(R,G,B), mn=Math.min(R,G,B), d=mx-mn;
    let h=0;
    if(d){
      if(mx===R) h=60*(((G-B)/d)%6);
      else if(mx===G) h=60*((B-R)/d+2);
      else h=60*((R-G)/d+4);
    }
    const l=(mx+mn)/2;
    const s=d ? d/(1-Math.abs(2*l-1)) : 0;
    return {h:((h%360)+360)%360, s:s*100, l:l*100};
  }

  /* ────────── 실시간 공유(미러링) ──────────
     정적 사이트라 서버가 없으므로 공개 MQTT 브로커를 중계로 사용.
     내용은 방 코드로 만든 키로 암호화해서 보내므로 브로커에는
     암호문만 남는다.                                        */
  const MIRROR = (function(){
    const BROKER='wss://broker.emqx.io:8084/mqtt';
    const myId = Math.random().toString(36).slice(2,10);
    let client=null, key=null, topic=null, connected=false, room='';

    const te=new TextEncoder(), td=new TextDecoder();
    async function sha(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s))); }
    async function setup(code){
      room=code;
      key = await crypto.subtle.importKey('raw', await sha('nametag-key:'+code),
                                          {name:'AES-GCM'}, false, ['encrypt','decrypt']);
      const h = await sha('nametag-topic:'+code);
      topic = 'nmtg/' + [...h].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('');
    }

    async function encrypt(obj){
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
      const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12);
      let s=''; out.forEach(b=>s+=String.fromCharCode(b)); return btoa(s);
    }

    async function decrypt(b64){
      const raw=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
      return JSON.parse(td.decode(pt));
    }

    function getRoom(){
      const m=/[#&]r=([^&]+)/.exec(location.hash);
      if(m) return decodeURIComponent(m[1]);
      return data.room || 'default';
    }

    async function start(){
      if(typeof mqtt==='undefined' || !crypto.subtle) { status(); return; }
      try{
        await setup(getRoom());
        client = mqtt.connect(BROKER, {
          clientId:'nmtg_'+myId, clean:true,
          reconnectPeriod:4000, connectTimeout:8000, keepalive:30
        });
        client.on('connect', ()=>{ connected=true; status(); client.subscribe(topic,{qos:0}); });
        client.on('close',   ()=>{ connected=false; status(); });
        client.on('error',   ()=>{ connected=false; status(); });
        client.on('message', async (t,payload)=>{
          try{
            const o=await decrypt(payload.toString());
            if(!o || o.from===myId) return;                 // 내가 보낸 건 무시
            if(isInlineEditing()) return;                   // 편집 중엔 덮어쓰지 않음

            let changed=false;
            // 색상 동기화 (다른 기기에서 바꾸면 즉시 반영)
            if(o.colors && JSON.stringify(o.colors)!==JSON.stringify(data.colors||{})){
              data.colors=o.colors; changed=true;
            }
            // 이름·전화번호 동기화
            if((o.name||'')!==data.name || (o.tel||'')!==data.tel){
              data.name=o.name||''; data.tel=o.tel||''; changed=true;
            }
            if(!changed) return;
            save(); logShown(); render();
            if($('palette').classList.contains('on')) paintPalUI();
            else hideBtns();                                // 받은 쪽은 바로 표시
          }catch(e){}
        });
      }catch(e){ status(); }
    }

    async function publish(){
      if(!client || !connected || !key) return;
      try{
        const msg=await encrypt({
          name:data.name, tel:data.tel,
          colors:colors(),                                   // 색상도 함께 전송
          from:myId, t:Date.now()
        });
        client.publish(topic, msg, {qos:0, retain:true});    // retain: 나중에 접속해도 현재값 수신
      }catch(e){}
    }

    function shareUrl(){
      const base=location.origin+location.pathname;
      return room==='default' ? base : base+'#r='+encodeURIComponent(room);
    }


    function status(){
      const box=$('mirrorBox'); if(!box) return;
      const st = connected ? '🟢 연결됨 — 같은 방의 다른 폰에 즉시 표시됩니다'
                           : (typeof mqtt==='undefined' ? '⚪ 공유 기능 사용 불가(스크립트 없음)'
                                                        : '🟡 연결 중…(인터넷 필요)');
      box.innerHTML = st + '<br>방 코드: <b>' + (room||'-') + '</b>'
                    + '<br><span style="word-break:break-all;color:#aaa">' + shareUrl() + '</span>';
    }


    async function changeRoom(){
      const v=prompt('방 코드를 입력하세요.\n같은 코드를 쓰는 기기끼리만 공유됩니다.\n(비워두면 기본 방)', room==='default'?'':room);
      if(v===null) return;
      const code=(v.trim()||'default');
      data.room=code; save();

      if(code==='default') history.replaceState(null,'',location.pathname);
      else history.replaceState(null,'','#r='+encodeURIComponent(code));
      if(client){ try{ client.end(true); }catch(e){} client=null; connected=false; }
      await start();
      status();
    }

    return { start, publish, status, changeRoom, shareUrl };
  })();


  /* ───── 촬영 → 파일명 정리 (2단계) ─────
     ① Ulike/기본 카메라로 촬영  ② 여기서 사진을 불러와 이름 바꿔 저장

  const ULIKE_PKG = 'com.gorgeous.liteinternational';

  function safeSeg(s){
    return (s||'').replace(/[\\/:*?"<>|.]/g,'').replace(/\s+/g,'').trim();
  }
  function todayStamp(){
    const d=new Date(), p=n=>('0'+n).slice(-2);

  /* ───── 명찰 표시 기록 ─────
     "언제 누구 명찰을 띄웠는지"를 남겨두고,
     나중에 사진의 촬영 시각과 대조해 자동으로 이름을 채운다.  */
  function logShown(){
    if(!data.name && !data.tel) return;
    data.log = data.log || [];
    const last = data.log[data.log.length-1];
    if(last && last.name===data.name && last.tel===data.tel) return;  // 같은 사람 중복 기록 방지
    data.log.push({ name:data.name, tel:data.tel, t:Date.now() });
    if(data.log.length>500) data.log = data.log.slice(-500);
    save();
  }
  /* 사진 찍힌 시각에 화면에 떠 있던 명찰 찾기 */
  function matchByTime(f){
    const t=(f && f.lastModified) || 0;
    if(!t) return null;
    const log=data.log||[];
    let best=null;
    for(let i=0;i<log.length;i++){
      if(log[i].t <= t+10000) best=log[i];    // 10초 여유(시계 오차)
      else break;
    }
    return best;
  }
  function hhmm(ms){
    const d=new Date(ms), p=n=>('0'+n).slice(-2);
    return p(d.getHours())+':'+p(d.getMinutes());
  }

  /* ───── 여러 장 한꺼번에 이름 붙이기 ─────
     날짜는 각 사진이 찍힌 날짜를 자동으로 사용 */
  const batch=[];                      // {file,url,name,tel,saved,el}

  function photoDate(f){
    const d=new Date(f.lastModified || Date.now()), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }
  function rowFileName(it){
    const nm = safeSeg(it.name) || '이름없음';
    const tel= (it.tel||'').replace(/[\\/:*?"<>|\s]/g,'');
    const m  = (it.file.name||'').match(/\.[A-Za-z0-9]+$/);
    return photoDate(it.file)+'_'+nm+(tel?'_'+tel:'')+(m?m[0].toLowerCase():'.jpg');
  }
  function saveOne(it){
    const a=document.createElement('a');
    a.href=it.url; a.download=rowFileName(it);
    document.body.appendChild(a); a.click(); a.remove();
    it.saved=true; it.el.classList.add('done');
    it.el.querySelector('.bt-save').textContent='완료';

  let focusRow=-1;                     // 최근 입력 칩이 채울 행
  function renderChips(){

  }

  function addPhotos(files){
    const list=Array.prototype.slice.call(files||[]);
    if(!list.length) return;
    if(!batch.length) $('btList').innerHTML='';
    list.forEach(f=>{
      const hit = matchByTime(f);                 // 촬영 시각으로 자동 매칭
      const it={file:f, url:URL.createObjectURL(f),
                name:(hit&&hit.name)||'', tel:(hit&&hit.tel)||'', saved:false};
      const row=document.createElement('div');
      row.className='bt-row';
      row.innerHTML=
        '<img class="bt-thumb" src="'+it.url+'" alt="">'
       +'<div class="bt-f">'
       +'  <input class="bt-name" type="text" placeholder="이름" autocomplete="off" enterkeyhint="next">'
       +'  <input class="bt-tel"  type="tel" inputmode="numeric" placeholder="번호 8자리" autocomplete="off" enterkeyhint="next">'
       +'  <div class="bt-fn"></div>'
       +'  <div class="bt-when"></div>'
       +'</div>'
       +'<button class="bt-save">저장</button>';
      it.el=row; batch.push(it);
      $('btList').appendChild(row);

      const iN=row.querySelector('.bt-name'), iT=row.querySelector('.bt-tel');
      const fn=row.querySelector('.bt-fn'), wh=row.querySelector('.bt-when');
      const idx=batch.length-1;
      iN.value=it.name; iT.value=it.tel;
      wh.innerHTML = f.lastModified
        ? ('촬영 '+hhmm(f.lastModified)
           + (hit ? ' · <b>⏱ 자동매칭</b> (명찰 '+hhmm(hit.t)+')'
                  : ' · <span class="warn">매칭 기록 없음 — 직접 입력</span>'))
        : '촬영 시각 정보 없음 — 직접 입력';
      const upd=()=>{ fn.textContent=rowFileName(it); };
      upd();

      // 썸네일 눌러 크게 보기 (누가 누군지 확인용)
      row.querySelector('.bt-thumb').onclick=()=>{
        $('btZoomImg').src=it.url;
        $('btZoom').classList.add('on');
      };

      iN.addEventListener('focus', ()=>focusRow=idx);
      iT.addEventListener('focus', ()=>focusRow=idx);
      iN.addEventListener('input', ()=>{ it.name=iN.value; upd(); });
      iT.addEventListener('input', ()=>{ iT.value=fmtTel(iT.value); it.tel=iT.value; upd(); });
      iN.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); iT.focus(); } });
      iT.addEventListener('keydown', e=>{
        if(e.key!=='Enter') return;
        e.preventDefault();
        const nx=batch[idx+1];
        if(nx) nx.el.querySelector('.bt-name').focus();
        else iT.blur();
      });
      row.querySelector('.bt-save').onclick=()=>saveOne(it);
    });
    renderChips();
  }

  $('btSaveAll').onclick=async ()=>{
    const todo=batch.filter(it=>!it.saved);
    if(!todo.length){ $('btSaveAll').textContent='저장할 사진 없음';
                      setTimeout(()=>$('btSaveAll').textContent='전체 저장',1500); return; }
    for(const it of todo){ saveOne(it); await new Promise(r=>setTimeout(r,400)); }
    $('btSaveAll').textContent='✅ '+todo.length+'장 저장';
    setTimeout(()=>$('btSaveAll').textContent='전체 저장',2500);
  };

  async function saveRenamed(files){
    const list=Array.prototype.slice.call(files||[]);
    if(!list.length) return;
    const base=fileBase();
    let n=0;
    for(const f of list){
      n++;
      const m=(f.name||'').match(/\.[A-Za-z0-9]+$/);
      const ext=m ? m[0].toLowerCase() : '.jpg';
      const name=base+(list.length>1 ? '_'+('0'+n).slice(-2) : '')+ext;
      const url=URL.createObjectURL(f);
      const a=document.createElement('a');
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      await new Promise(r=>setTimeout(r, 400));      // 연속 저장 간격
    }
    $('renameLog').textContent =
      '✅ '+list.length+'장 저장 완료 → 다운로드 폴더 · '+base+'.jpg';
  }
  $('fPick').addEventListener('change', e=>{
    $('batch').classList.add('on');
    addPhotos(e.target.files);
    e.target.value='';
  });
  $('fCam') .addEventListener('change', e=>{ saveRenamed(e.target.files); e.target.value=''; });

  /* ───── 원스텝 촬영: 찍기 → 이름/번호 입력 → 자동 저장 ─────
     Ulike 없이 이 화면 안에서 피부 보정 + 이름표 합성 + 파일 저장을 한 번에 처리.
     (진짜 AI 피부보정은 웹에서 재현 불가 → 소프트 블러를 겹쳐 매끈한 느낌만 근사) */
  const CAP = (function(){
    const video=$('capVideo'), photo=$('capPhoto');
    const bottom=$('capBottom'), shutterWrap=$('capShutterWrap');
    const nI=$('capName'), tI=$('capTel'), hintEl=$('capHint');
    let stream=null, facing='environment', shotCanvas=null;

    async function openCam(){
      stopCam();
      video.classList.add('on'); photo.classList.remove('on');
      shutterWrap.classList.remove('hide');
      bottom.classList.remove('on');
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1920} },
          audio:false
        });
        video.srcObject = stream;
      }catch(e){
        alert('카메라를 열 수 없습니다.\n브라우저에 카메라 권한을 허용해주세요.');
        close();
      }
    }
    function stopCam(){
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    }

    /* 촬영: 원본 위에 부드럽게 뭉갠 버전을 겹쳐 피부결을 완화(소프트 글로우) */
    function shoot(){
      const w=video.videoWidth||1080, h=video.videoHeight||1440;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.drawImage(video,0,0,w,h);

      const blur=document.createElement('canvas'); blur.width=w; blur.height=h;
      const bctx=blur.getContext('2d');
      bctx.filter='blur('+Math.round(w*0.012)+'px)';
      bctx.drawImage(video,0,0,w,h);

      ctx.save();
      ctx.globalAlpha=0.5;
      ctx.filter='brightness(1.04) saturate(1.06)';
      ctx.drawImage(blur,0,0,w,h);
      ctx.restore();

      shotCanvas=cv;
      photo.src=cv.toDataURL('image/jpeg',0.92);
      photo.classList.add('on'); video.classList.remove('on');
      shutterWrap.classList.add('hide');
      bottom.classList.add('on');
      stopCam();

      nI.value=''; tI.value=''; hintEl.textContent='';
      renderCapChips();
      setTimeout(()=>nI.focus(),120);
    }

    function renderCapChips(){
      const box=$('capChips'); box.innerHTML='';
      (data.recent||[]).slice(0,8).forEach(r=>{
        const b=document.createElement('button');
        b.className='chip'; b.textContent=r.name||r.tel;
        b.onmousedown=e=>e.preventDefault();
        b.onclick=()=>{ nI.value=r.name||''; tI.value=r.tel||''; };
        box.appendChild(b);
      });
    }

    function capFileBase(){
      const nm=safeSeg(nI.value)||'이름없음';
      const tel=fmtTel(tI.value).replace(/[\\/:*?"<>|\s]/g,'');
      return todayStamp()+'_'+nm+(tel?'_'+tel:'');
    }

    function saveShot(){
      if(!shotCanvas) return;
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      if(!nm && !tel){ hintEl.textContent='이름 또는 전화번호를 입력해주세요'; return; }

      const cv=document.createElement('canvas');
      cv.width=shotCanvas.width; cv.height=shotCanvas.height;
      const ctx=cv.getContext('2d');
      ctx.drawImage(shotCanvas,0,0);

      const w=cv.width, h=cv.height;
      const barH=Math.round(h*0.16);
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(0,h-barH,w,barH);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
      if(nm){
        ctx.font='900 '+Math.round(barH*0.42)+'px "Malgun Gothic",sans-serif';
        ctx.fillText(nm, w/2, h-barH*0.62);
      }
      if(tel){
        ctx.font='800 '+Math.round(barH*0.30)+'px "Malgun Gothic",sans-serif';
        ctx.fillText(tel, w/2, h-barH*0.22);
      }

      cv.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=capFileBase()+'.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);

        pushRecent(nm,tel); save();
        hintEl.textContent='✅ 저장됨: '+capFileBase()+'.jpg';
        setTimeout(openCam, 700);           // 바로 다음 사람 촬영으로
      }, 'image/jpeg', 0.92);
    }

    function open(){
      $('capture').classList.add('on');
      editEl.classList.remove('on');
      keepAwake(true);
      openCam();
    }
    function close(){
      stopCam();
      $('capture').classList.remove('on');
      openEdit();
    }

    $('capShutter').onclick=shoot;
    $('capRetake').onclick=openCam;
    $('capSave').onclick=saveShot;
    $('capClose').onclick=close;
    $('capFlip').onclick=()=>{ facing = facing==='environment' ? 'user' : 'environment'; openCam(); };
    nI.addEventListener('input', ()=>{ if(hintEl.textContent) hintEl.textContent=''; });
    nI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tI.focus(); } });
    tI.addEventListener('input', e=>{ e.target.value=fmtTel(e.target.value); });
    tI.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveShot(); } });

    return { open };
  })();
  $('bCapture').onclick = CAP.open;

  $('bRoom').onclick = ()=>MIRROR.changeRoom();
  $('bCopy').onclick = async ()=>{
    const url=MIRROR.shareUrl();
    try{ await navigator.clipboard.writeText(url); $('bCopy').textContent='복사됨 ✓';
         setTimeout(()=>$('bCopy').textContent='공유 주소 복사',1500); }
    catch(e){ prompt('아래 주소를 복사하세요', url); }
  };

  render();
  keepAwake(true);

  
  // 처음 열 때: 내용이 있으면 버튼 숨김, 비어 있으면 안내를 위해 표시
  if (data.name || data.tel) hideBtns(); else poke();
  MIRROR.start();

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
