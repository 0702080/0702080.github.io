<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS='nametag_v1';

  let data={};
  try{ Object.assign(data, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} };

  /* "폰을 가로로 들어도 세로 유지"는 폰에서만 의미가 있다. PC 모니터는
     거의 항상 가로가 더 길어서(1920x1080 등), screen.width>height 만으로
     판단하면 PC에서 창을 아무리 세로로 만들어도 항상 "가로"로 오인해
     화면이 계속 90도 돌아가버렸다 — 실제로 PC 브라우저에서 발생한 문제.
     그래서 먼저 "이게 폰인가"부터 확인하고, 폰일 때만 screen.width·height
     로 실제 방향을 본다(이 값은 키보드가 올라와도 바뀌지 않아 안전하다). */
  function isPhoneLike(){
    if(navigator.userAgentData && typeof navigator.userAgentData.mobile==='boolean'){
      return navigator.userAgentData.mobile;
    }
    return /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
  }
  const PHONE = isPhoneLike();
  function updateRotateLock(){
    const landscape = PHONE && (screen.width||0) > (screen.height||0);
    document.documentElement.classList.toggle('rot90', landscape);
  }
  updateRotateLock();
  window.addEventListener('orientationchange', updateRotateLock);
  if(screen.orientation && screen.orientation.addEventListener){
    screen.orientation.addEventListener('change', updateRotateLock);
  }

  /* 버튼 누를 때 진동 + "띡" 소리 */
  let actx=null;
  function beep(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      if(!actx) actx=new AC();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime;
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(2200,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.09);
    }catch(e){}
  }
  document.addEventListener('click', e=>{
    if(e.target.closest && e.target.closest('button')){
      try{ if(navigator.vibrate) navigator.vibrate(28); }catch(err){}
      beep();
    }
  }, true);

  /* 눌린 순간 바로 보이게 (짧게 톡 눌러도 확실히 보이도록 잠깐 유지)
     :active 만으로는 폰에서 스치듯 눌렀을 때 거의 안 보인다. */
  document.addEventListener('pointerdown', e=>{
    const b=e.target.closest && e.target.closest('button, .tile');
    if(!b) return;
    b.classList.add('pressing');
    setTimeout(()=>b.classList.remove('pressing'), 200);
  }, true);

  /* 전화번호 자동 하이픈 */
  function fmtTel(v){
    let d=(v||'').replace(/\D/g,'');
    if(!d) return '';
    if(d[0]!=='0' && d.length<=8) d='010'+d;      // 010 생략 입력
    if(d.startsWith('010')){
      const r=d.slice(3,11);
      if(!r) return '010';
      return r.length<=4 ? '010-'+r : '010-'+r.slice(0,4)+'-'+r.slice(4);
    }
    d=d.slice(0,11);
    if(d.length<4) return d;
    if(d.startsWith('02')){
      if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
      if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }
  /* 전화번호를 말로 부를 땐 "공일공에 일이삼사..." 처럼 한글 숫자를 한 자씩
     읽는 경우가 거의 전부라, 음성 인식 결과에 섞인 그 글자들을 먼저 아라비아
     숫자로 바꿔둔다. 관계없는 글자는 그대로 두고, 어차피 fmtTel 이 숫자 외엔
     다 걸러내므로 여기서 지나치게 정교할 필요는 없다. */
  const HANGUL_DIGIT={'공':'0','영':'0','일':'1','이':'2','삼':'3','사':'4','오':'5','육':'6','륙':'6','칠':'7','팔':'8','구':'9'};
  function hangulDigitsToArabic(s){
    return (s||'').split('').map(ch=>HANGUL_DIGIT[ch]!==undefined?HANGUL_DIGIT[ch]:ch).join('');
  }

  function safeSeg(s){
    return (s||'').replace(/[\\/:*?"<>|.]/g,'').replace(/\s+/g,'').trim();
  }
  function stampOf(file){
    // 사진이 찍힌 날짜를 파일명에 사용 (없으면 오늘)
    const d=new Date((file && file.lastModified) || Date.now()), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }
  /* 같은 날짜(사진 찍힌 날 기준) 안에서 몇 번째 사람인지 01,02,03... 매긴다.
     날짜별로 따로 세어둔다 — 갤러리에서 며칠 전 사진이 섞여 들어와도
     오늘 번호가 리셋되지 않도록(예전엔 날짜 하나만 기억해서 01이 중복됐다). */
  function nextCounter(dateStr){
    if(!data.ctr){
      data.ctr={};
      // 옛 방식(날짜 1개만 저장)에서 넘어오는 값 살리기
      if(data.ctrDate && data.ctrN) data.ctr[data.ctrDate]=data.ctrN;
    }
    delete data.ctrDate; delete data.ctrN;
    data.ctr[dateStr]=(data.ctr[dateStr]||0)+1;
    // 날짜가 무한정 쌓이지 않게 최근 60일치만 남긴다
    const days=Object.keys(data.ctr).sort();
    if(days.length>60) days.slice(0, days.length-60).forEach(d=>delete data.ctr[d]);
    save();
    return String(data.ctr[dateStr]).padStart(2,'0');
  }

  /* ───── 벽걸이 태블릿으로 즉시 전송 ─────
     서버가 없으므로 공개 MQTT 중계소를 "우편함"처럼 쓴다.
     방 코드로 만든 열쇠(AES-GCM)로 잠가서 보내므로 중계소에는 암호문만 지나가고,
     같은 코드를 가진 태블릿만 열어볼 수 있다. retain 을 끄기 때문에
     중계소에 데이터가 남지도 않는다. */
  const TV = (function(){
    const BROKER='wss://broker.emqx.io:8084/mqtt';
    const myId=Math.random().toString(36).slice(2,10);
    const te=new TextEncoder(), td=new TextDecoder();
    let client=null, key=null, topic=null, connected=false, code='', onPhoto=null, onXf=null;
    let mqttLoading=null;
    /* connect()를 부르는 곳이 여러 곳이다(자동 재연결, 실패 시 재시도, 버튼으로
       새 코드 입력 등). 이 호출들이 겹치면, 먼저 시작했지만 늦게 끝나는 시도가
       나중에 시작해 먼저 끝난 시도의 상태(코드·열쇠·토픽·소켓)를 덮어써 버려서
       "화면엔 새 태블릿에 연결됐다고 뜨는데 실제로는 옛 태블릿으로 계속 전송되는"
       문제가 생겼다. 세대 번호를 매겨서, 자기 세대가 이미 낡았으면(더 최신 시도가
       있었으면) 공유 상태를 건드리지 않고 조용히 정리만 하고 빠진다. */
    let gen=0;

    /* 라이브러리(330KB)는 실제로 쓸 때만 불러온다 */
    function loadMqtt(){
      if(window.mqtt) return Promise.resolve();
      if(mqttLoading) return mqttLoading;
      mqttLoading=new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='mqtt.min.js'; s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
      return mqttLoading;
    }

    /* 실제 소켓 상태를 본다. 폰이 다른 앱에 다녀오는 사이 연결이 죽어도
       close/error 가 안 불려 connected 가 true 로 남아있는 경우가 있어서,
       "연결됨"이라고 표시해놓고 전송은 실패하는 일이 생겼다. */
    function live(){ return !!(client && (client.connected===undefined ? connected : client.connected)); }

    async function sha(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s))); }
    /* 공유 상태(code/key/topic)를 직접 건드리지 않고 계산만 해서 돌려준다 —
       실제 반영은 connect() 가 자기 세대가 아직 최신일 때만 한 번에 커밋한다. */
    async function setup(c){
      const k=await crypto.subtle.importKey('raw', await sha('nfp-key:'+c), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
      const h=await sha('nfp-topic:'+c);
      const t='nfp/'+[...h].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('');
      return {key:k, topic:t};
    }
    async function encrypt(obj){
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, te.encode(JSON.stringify(obj))));
      const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12);
      let s=''; for(const b of out) s+=String.fromCharCode(b);
      return btoa(s);
    }
    async function decrypt(b64){
      const raw=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, key, raw.slice(12));
      return JSON.parse(td.decode(pt));
    }

    async function connect(c, opts){
      opts=opts||{};
      const myGen=++gen;   // 이 시도의 번호. 진행 중에 gen 이 바뀌면 더 최신 시도가 있었다는 뜻
      onPhoto=opts.onPhoto||null;
      onXf=opts.onXf||null;
      await loadMqtt();
      if(myGen!==gen) return;             // 기다리는 사이 낡아졌다 — 아무 것도 건드리지 않고 끝
      if(!window.mqtt || !crypto.subtle) throw new Error('unsupported');
      const computed=await setup(c);
      if(myGen!==gen) return;             // setup() 은 공유 상태를 안 건드렸으니 그냥 버리면 끝

      // 여기서부터 다음 await 전까지는 동기적으로 한 번에 커밋한다
      code=c; key=computed.key; topic=computed.topic;
      if(client){ try{ client.end(true); }catch(e){} client=null; }
      const newClient=mqtt.connect(BROKER, {
        clientId:'nfp_'+myId, clean:true,
        reconnectPeriod:4000, connectTimeout:8000, keepalive:30
      });
      client=newClient;
      /* 아래 이벤트들은 소켓이 살아있는 동안(자동 재연결 포함) 여러 번 다시 불릴 수
         있다 — 이 시도가 나중에 낡아진 뒤에도 계속 불려서 최신 상태를 덮어쓰지
         않도록 매번 자기 세대가 아직 최신인지 확인한다. */
      newClient.on('connect', ()=>{
        if(myGen!==gen){ try{ newClient.end(true); }catch(e){} return; }
        connected=true;
        if(onPhoto || onXf) newClient.subscribe(topic,{qos:1});
        if(opts.onStatus) opts.onStatus(true);
      });
      newClient.on('close', ()=>{
        if(myGen!==gen) return;
        connected=false; if(opts.onStatus) opts.onStatus(false);
      });
      newClient.on('error', ()=>{
        if(myGen!==gen) return;
        connected=false; if(opts.onStatus) opts.onStatus(false);
      });
      newClient.on('message', async (t,payload)=>{
        if(myGen!==gen || (!onPhoto && !onXf)) return;
        try{
          const o=await decrypt(payload.toString());
          if(!o || o.from===myId) return;
          if(o.type==='xf'){ if(onXf) onXf(o); }
          else if(onPhoto) onPhoto(o);
        }catch(e){}   // 다른 방 메시지거나 복호화 실패 — 조용히 무시
      });
      /* 실제로 붙을 때까지 기다린다(최대 8초). 여기서 바로 돌려주면
         아직 연결도 안 됐는데 "연결됨"으로 보고 곧장 사진을 보내다 실패한다. */
      await new Promise(res=>{
        if(live()) return res();
        let done=false;
        const fin=()=>{ if(done) return; done=true; clearTimeout(t); res(); };
        const t=setTimeout(fin, 8000);
        newClient.once('connect', fin);
      });
      if(myGen!==gen){ try{ newClient.end(true); }catch(e){} }  // 기다리는 사이 낡아졌으면 정리
    }

    /* 확인용이므로 화면에 보일 만큼만 줄여서 보낸다 (전송 1~2초 안에 끝나도록) */
    function shrink(cv, maxPx, q){
      const k=Math.min(1, maxPx/Math.max(cv.width, cv.height));
      if(k>=1) return cv.toDataURL('image/jpeg', q);
      const c2=document.createElement('canvas');
      c2.width=Math.round(cv.width*k); c2.height=Math.round(cv.height*k);
      c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
      return c2.toDataURL('image/jpeg', q);
    }
    async function sendPhoto(canvas, name, tel, opts){
      opts=opts||{};
      if(!live() || !key) return false;
      /* 크게 보기(full)는 화면을 가득 채우므로 더 큰 사진을 보낸다.
         다만 공용 중계소는 한 번에 1MB 까지만 받아준다. 사진은
         데이터URL(base64) → 암호화 → 다시 base64 를 거치면서 데이터URL
         길이의 1.33배로 부푸므로, 데이터URL 자체를 아래 한도 밑으로
         눌러두지 않으면 큰 사진이 조용히 거부된다.
         (한도 60만 자 ≈ 실제 전송 약 800KB) */
      const big=!!opts.full;
      const CAP=big?600000:400000;
      const steps=big ? [[1400,.72],[1150,.66],[900,.6],[700,.55]]
                      : [[900,.7],[640,.6],[480,.5]];
      let img='';
      for(const [px,q] of steps){ img=shrink(canvas,px,q); if(img.length<=CAP) break; }
      try{
        const msg=await encrypt({ img, name, tel, full:big, from:myId, t:Date.now() });
        // qos:1 로 중계소가 받았다는 응답(또는 실패)을 실제로 확인한 뒤 결과를 돌려준다.
        // 응답이 없으면 6초 뒤 실패로 처리해 "보냈다"고 잘못 알리지 않는다.
        return await new Promise(res=>{
          let done=false;
          const t=setTimeout(()=>{ if(!done){ done=true; res(false); } }, 6000);
          client.publish(topic, msg, {qos:1, retain:false}, err=>{
            if(done) return;
            done=true; clearTimeout(t); res(!err);
          });
        });
      }catch(e){ return false; }
    }

    /* 폰에서 핀치/이동한 상태를 태블릿에도 실시간으로 반영하기 위한 가벼운
       메시지. 사진 자체를 다시 보내는 게 아니라 배율(sc)과, 각 기기가 자기
       화면 크기에 맞게 옮길 수 있도록 "테두리까지 이동 가능한 거리 대비
       비율"(fx, fy, -1~1)만 보낸다 — 픽셀 값을 그대로 보내면 폰(세로)과
       태블릿(가로) 화면 비율이 달라 위치가 어긋난다.
       사진 전송과 달리 확인 응답을 기다리지 않는다(qos:0, fire-and-forget) —
       핀치하는 동안 계속 보내는 값이라 하나쯤 놓쳐도 다음 값이 금방 따라오고,
       매번 응답을 기다리면 오히려 화면이 버벅인다. */
    function sendXf(o){
      if(!live() || !key) return;
      encrypt({ type:'xf', sc:o.sc, fx:o.fx, fy:o.fy, from:myId, t:Date.now() })
        .then(msg=>{ try{ client.publish(topic, msg, {qos:0, retain:false}); }catch(e){} })
        .catch(()=>{});
    }

    function makeCode(){
      const DIGITS='0123456789';
      const a=crypto.getRandomValues(new Uint8Array(2));
      let s='TB'; for(let i=0;i<2;i++) s+=DIGITS[a[i]%DIGITS.length];
      return s;
    }
    /* 연결을 진짜로 끊는다. 소켓만 닫는 게 아니라 암호열쇠·토픽까지 버려야
       "연결 끊음"이라고 표시해놓고 예전 태블릿으로 사진이 계속 가는 일이 없다.
       gen 도 올려서, 이 시점에 진행 중이던 connect() 시도가 있었다면 그것도
       낡은 것으로 만들어 뒤늦게 되살아나지 않게 한다. */
    function disconnect(){
      gen++;
      if(client){ try{ client.end(true); }catch(e){} }
      client=null; key=null; topic=null; connected=false; code=''; onPhoto=null; onXf=null;
    }
    return { connect, disconnect, sendPhoto, sendXf, makeCode, isReady:live };
  })();

  /* ───── 오늘 찍은 사진 모아서 한 번에 공유 ─────
     이 화면을 켜둔 세션 동안만 기억한다(앱을 완전히 껐다 켜면 목록은 비워짐).
     사진 파일 자체는 이미 저장할 때마다 다운로드 폴더에 들어가 있으니,
     여기 있는 목록은 "한꺼번에 공유하기용" 임시 모음일 뿐이다. */
  const todaysShots=[];
  /* ───── 오늘 찍은 사진을 앱을 껐다 켜도 남아있게 (IndexedDB) ─────
     localStorage는 문자열만, 용량도 작아서 사진(Blob)엔 안 맞는다. IndexedDB는
     Blob을 그대로 담을 수 있고 용량도 넉넉하다. "오늘" 날짜 것만 불러오고,
     날짜가 지난 예전 기록은 열 때 정리한다 — 실제 사진 파일은 이미 다운로드
     폴더에 안전하게 있으니, 여기 있는 건 순전히 "오늘 찍은 사진" 목록·
     미리보기를 되살리기 위한 사본일 뿐이다. */
  function todayKey(){
    const d=new Date(), p=n=>('0'+n).slice(-2);
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }
  let shotsDbP=null;
  function shotsDb(){
    if(shotsDbP) return shotsDbP;
    shotsDbP=new Promise((res,rej)=>{
      if(!window.indexedDB){ rej(new Error('no idb')); return; }
      const req=indexedDB.open('nfp_shots',1);
      req.onupgradeneeded=()=>{
        const store=req.result.createObjectStore('shots',{keyPath:'id'});
        store.createIndex('date','date',{unique:false});
      };
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
    });
    return shotsDbP;
  }
  async function dbPutShot(rec){
    try{ const db=await shotsDb(); db.transaction('shots','readwrite').objectStore('shots').put(rec); }
    catch(e){}
  }
  async function dbDeleteShot(id){
    try{ const db=await shotsDb(); db.transaction('shots','readwrite').objectStore('shots').delete(id); }
    catch(e){}
  }
  async function dbLoadTodayAndCleanup(){
    try{
      const db=await shotsDb();
      const store=db.transaction('shots','readwrite').objectStore('shots');
      const all=await new Promise((res,rej)=>{
        const r=store.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      });
      const today=todayKey(), todays=[];
      for(const rec of all){
        if(rec.date===today) todays.push(rec);
        else store.delete(rec.id);   // 날짜 지난 기록은 자리만 차지하니 정리
      }
      todays.sort((a,b)=>a.t-b.t);   // 찍은 순서대로
      return todays;
    }catch(e){ return []; }
  }
  /* 사진마다 objectURL을 딱 한 번만 만들어 재사용한다. 예전엔 사진을 찍을 때마다
     그동안 찍은 것 전체를 처음부터 다시 그리면서 이미 만들어둔 URL까지 매번
     새로 만들어(회수도 안 됨) N장이면 URL이 N²/2개씩 쌓이는 누수가 있었다. */
  /* ───── 오늘 찍은 사진 전체화면 보기 — 핀치로 확대/축소, 확대 중엔 끌어서 이동 ─────
     태블릿 확인 화면(#tvStage)의 핀치줌 구현과 같은 방식(포인터 이벤트로
     한 손가락=이동, 두 손가락=핀치)을 그대로 재사용한다. */
  const thumbView=$('thumbView'), thumbTrack=$('thumbTrack');
  const thumbImgPrev=$('thumbImgPrev'), thumbImg=$('thumbImgCur'), thumbImgNext=$('thumbImgNext');
  let tvw_sc=1, tvw_tx=0, tvw_ty=0;
  const TVW_MIN=1, TVW_MAX=6;
  function thumbApplyTf(){
    thumbImg.style.transform='translate('+tvw_tx+'px,'+tvw_ty+'px) scale('+tvw_sc+')';
    thumbSyncXf();
  }
  /* 지금 확대/이동 상태를 태블릿에도 실시간으로 보낸다. 핀치하는 동안
     쉬지 않고 불리므로 90ms 안에 또 부르면 건너뛴다(과도한 전송 방지) —
     단, 손가락을 뗀 순간(force)만은 반드시 최종 상태를 보낸다. */
  let thumbLastXfT=0;
  function thumbSyncXf(force){
    if(!data.tvCode || !TV.isReady()) return;
    const now=Date.now();
    if(!force && now-thumbLastXfT<90) return;
    thumbLastXfT=now;
    const st=thumbView.getBoundingClientRect();
    const w=thumbImg.clientWidth*tvw_sc, h=thumbImg.clientHeight*tvw_sc;
    const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
    TV.sendXf({ sc:tvw_sc, fx: mx>0 ? tvw_tx/mx : 0, fy: my>0 ? tvw_ty/my : 0 });
  }
  function thumbClampPan(){
    const st=thumbView.getBoundingClientRect();
    const w=thumbImg.clientWidth*tvw_sc, h=thumbImg.clientHeight*tvw_sc;
    const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
    tvw_tx=Math.min(mx,Math.max(-mx,tvw_tx));
    tvw_ty=Math.min(my,Math.max(-my,tvw_ty));
  }
  function thumbZoomAt(px,py,next){
    const st=thumbView.getBoundingClientRect();
    const ox=px-st.left-st.width/2, oy=py-st.top-st.height/2;
    const s2=Math.min(TVW_MAX,Math.max(TVW_MIN,next));
    const u=(ox-tvw_tx)/tvw_sc, v=(oy-tvw_ty)/tvw_sc;
    tvw_tx=ox-u*s2; tvw_ty=oy-v*s2; tvw_sc=s2;
    if(tvw_sc<=1.001){ tvw_sc=1; tvw_tx=0; tvw_ty=0; }
    thumbClampPan(); thumbApplyTf();
  }
  function thumbResetZoom(){
    tvw_sc=1; tvw_tx=0; tvw_ty=0;
    thumbImg.style.transition='none';   // 아래로 끌기 취소/삭제 애니메이션이 남겨둔 상태가 있으면 지운다
    thumbImg.style.opacity='';
    thumbApplyTf();
  }
  /* 옆 칸(이전/다음)에 실제로 그 방향의 사진이 있으면 채우고, 없으면
     src 자체를 지운다("" 로 비우면 일부 브라우저가 페이지 자신을 이미지로
     다시 요청해버리는 부작용이 있어 removeAttribute 를 쓴다) — 그래야
     목록 끝에서 당겨도 깨진 이미지가 살짝 비치는 일이 없다. */
  function thumbFillNeighbors(){
    if(thumbViewIndex>0) thumbImgPrev.src=todaysShots[thumbViewIndex-1].displayUrl;
    else thumbImgPrev.removeAttribute('src');
    if(thumbViewIndex<todaysShots.length-1) thumbImgNext.src=todaysShots[thumbViewIndex+1].displayUrl;
    else thumbImgNext.removeAttribute('src');
  }
  function thumbTrackSnapInstant(){
    thumbTrack.classList.add('dragging');      // 트랜지션 없이 즉시 이동
    thumbTrack.style.transform='translateX(-33.3333%)';
    void thumbTrack.offsetWidth;
    thumbTrack.classList.remove('dragging');
  }
  function openThumbView(url){
    thumbImg.src=url;
    thumbResetZoom();               // 새로 열 때마다 항상 원래 크기부터
    thumbTrackSnapInstant();
    thumbView.classList.add('on');
  }
  /* 오늘 찍은 사진 중 i번째를 전체화면으로 열고 태블릿에도 보낸다.
     썸네일 탭·홈 화면 스와이프가 이 하나로 모인다 — "지금 크게 보고 있는
     사진 = 태블릿에 뜬 사진"이라는 규칙을 어디서 열든 똑같이 지키기 위해서다.
     (전체화면 안에서 좌우로 끌어 넘기는 건 아래 드래그-트랙 쪽에서 따로 처리) */
  let thumbViewIndex=-1;
  function openThumbAt(i){
    if(i<0 || i>=todaysShots.length) return;
    thumbViewIndex=i;
    const s=todaysShots[i];
    const thumbEl=document.querySelectorAll('#todayThumbs img')[i];
    thumbFillNeighbors();
    openThumbView(s.displayUrl);
    resendToTv(s, thumbEl);
  }
  /* 실행취소 — 사진을 지워도 곧바로 IndexedDB 에서 지우지 않고 몇 초
     기다린다. 그 사이 "실행취소"를 누르면 목록에 되돌려 넣고, 시간이
     지나거나 다른 사진을 또 지우면(한 번에 하나만 되돌릴 수 있음) 그제서야
     진짜로 지운다. 다운로드 폴더에 이미 저장된 파일은 애초에 손대지
     않으므로 여기서 지우든 되돌리든 상관없다. */
  let undoTimer=null, undoShot=null;
  function finalizePendingDelete(){
    if(!undoShot) return;
    dbDeleteShot(undoShot.removed.id);
    undoShot=null;
  }
  function showUndoToast(removed, atIndex){
    clearTimeout(undoTimer);
    finalizePendingDelete();   // 대기 중이던 이전 삭제가 있으면 이번 삭제로 확정시킨다
    undoShot={removed, atIndex};
    $('undoMsg').textContent=(removed.name||removed.tel||'사진')+' 삭제됨';
    $('undoToast').classList.add('show');
    undoTimer=setTimeout(()=>{
      finalizePendingDelete();
      $('undoToast').classList.remove('show');
    }, 6000);
  }
  async function undoDelete(){
    if(!undoShot) return;
    clearTimeout(undoTimer);
    const {removed, atIndex}=undoShot;
    undoShot=null;
    $('undoToast').classList.remove('show');
    const insertAt=Math.min(atIndex, todaysShots.length);
    todaysShots.splice(insertAt, 0, removed);
    rebuildAllThumbs();
    $('todayWrap').classList.add('show');
    $('todayCount').textContent=todaysShots.length;
    await recomputeAllDisplays();
    refreshAllThumbSrcs();
    openThumbAt(insertAt);
  }
  function rebuildAllThumbs(){
    $('todayThumbs').innerHTML='';
    todaysShots.forEach((s, idx)=>appendTodayThumb(s, idx));
  }
  $('undoBtn').onclick=undoDelete;

  /* 지금 전체화면으로 보고 있는 사진을 "오늘 찍은 사진" 목록에서 지운다.
     다운로드 폴더에 이미 저장된 파일 자체는 브라우저가 건드릴 수 없어서
     그대로 남는다 — 여기서 지우는 건 이 세션 안에서의 목록·미리보기뿐.
     남은 사진들의 번호가 이 삭제로 당겨졌을 수 있으니, 전부 다시 합성해서
     화면(썸네일·전체화면·태블릿)에는 항상 최신 번호가 보이게 한다. */
  async function deleteCurrentThumb(){
    const i=thumbViewIndex;
    if(i<0 || i>=todaysShots.length) return;
    const [removed]=todaysShots.splice(i,1);
    // 되돌리기로 다시 들어올 수 있으니, 회수한 URL 자리는 반드시 비워둔다 —
    // 안 비우면 recomputeAllDisplays() 가 "이미 있다"고 보고 건너뛰어
    // 죽은 URL 그대로 남아 썸네일이 깨진다.
    if(removed.displayUrl) URL.revokeObjectURL(removed.displayUrl);
    removed.displayBlob=null; removed.displayUrl=null;
    const thumbEl=document.querySelectorAll('#todayThumbs img')[i];
    if(thumbEl) thumbEl.remove();
    // 남은 썸네일이 한 칸씩 당겨졌으니 각자의 탭 핸들러도 새 순번으로 다시 건다
    [...document.querySelectorAll('#todayThumbs img')].forEach((el, idx)=>{ el.onclick=()=>openThumbAt(idx); });
    $('todayCount').textContent=todaysShots.length;
    showUndoToast(removed, i);   // 실제 삭제는 미루고 몇 초간 되돌릴 기회를 준다
    if(!todaysShots.length){
      $('todayWrap').classList.remove('show');
      thumbView.classList.remove('on');   // 더 볼 사진이 없으면 전체화면도 닫는다
      return;
    }
    await recomputeAllDisplays();
    refreshAllThumbSrcs();
    openThumbAt(Math.min(i, todaysShots.length-1));   // 남은 사진 중 이어서 보여준다(태블릿도 같이 바뀜)
  }

  /* "오늘 찍은 사진" 목록을 통째로 비운다 — 확인창 없이 바로 지운다(눌렀을
     때 곧바로 끝나야 한다는 요청). 다운로드 폴더에 이미 저장된 파일은
     그대로 남는다. */
  async function clearAllToday(){
    if(!todaysShots.length) return;
    clearTimeout(undoTimer);
    finalizePendingDelete();
    $('undoToast').classList.remove('show');
    for(const s of todaysShots){
      if(s.displayUrl) URL.revokeObjectURL(s.displayUrl);
      dbDeleteShot(s.id);
    }
    todaysShots.length=0;
    $('todayThumbs').innerHTML='';
    $('todayWrap').classList.remove('show');
    $('todayCount').textContent='0';
    thumbView.classList.remove('on');
  }
  $('bClearAll').onclick=clearAllToday;

  const tvwPts=new Map();
  let tvwPanning=false, tvwLastX=0, tvwLastY=0, tvwPinchD=0, tvwPinchS=1;
  let tvwStartX=0, tvwStartY=0, tvwStartSc=1, tvwJustSwiped=false, tvwWasMulti=false;
  let tvwAxisLock=null;         // 한 손가락 드래그의 방향을 한 번 정하면 끝까지 고정: 'h'=옆으로 넘기기, 'v'=아래로 끌어 삭제
  const TVW_DEL_PX=120;         // 이만큼 아래로 끌고 놓으면 삭제, 못 미치면 제자리로 복귀
  let thumbTrackPendingDir=0;   // 손을 뗀 뒤 트랙이 다음/이전 칸으로 이동 중이면 1/-1
  thumbView.addEventListener('pointerdown', e=>{
    try{ thumbView.setPointerCapture(e.pointerId); }catch(err){}
    tvwPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(tvwPts.size===1){
      tvwPanning=true; tvwLastX=e.clientX; tvwLastY=e.clientY;
      tvwStartX=e.clientX; tvwStartY=e.clientY; tvwStartSc=tvw_sc;
      tvwJustSwiped=false;   // 새 손가락질이 시작됐으니 이전 스와이프 흔적은 지운다
      tvwWasMulti=false;     // 완전히 새 손가락질 — 이전 두 손가락 흔적도 지운다
      tvwAxisLock=null;      // 이번 드래그가 옆으로인지 아래로인지 아직 안 정해졌다
      if(tvw_sc<=1.01) thumbTrack.classList.add('dragging');   // 손가락을 바로 따라가게 트랜지션 끔
    }
    else if(tvwPts.size===2){
      tvwPanning=false;
      tvwWasMulti=true;      // 두 손가락을 거쳤다는 걸 기억해 둔다 — 손가락을
                              // 하나씩 떼면 마지막 손가락만 남는 순간이 오는데,
                              // 그걸 새 한 손가락 스와이프로 착각하면 안 된다
      // 한 손가락으로 아래로 끌던 도중 두 번째 손가락이 닿아 핀치로 바뀌는
      // 경우, 아래로-끌기용으로 남겨둔 흐릿한 상태를 지우고 진짜 확대/이동
      // 상태로 되돌린다 — 안 그러면 핀치 중에도 사진이 흐린 채로 남는다.
      tvwAxisLock=null;
      thumbImg.style.transition='none';
      thumbImg.style.opacity='';
      thumbApplyTf();
      const [a,b]=[...tvwPts.values()];
      tvwPinchD=Math.hypot(a.x-b.x,a.y-b.y); tvwPinchS=tvw_sc;
    }
  });
  thumbView.addEventListener('pointermove', e=>{
    if(!tvwPts.has(e.pointerId)) return;
    tvwPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(tvwPts.size===2 && tvwPinchD>0){
      const [a,b]=[...tvwPts.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      thumbZoomAt((a.x+b.x)/2,(a.y+b.y)/2, tvwPinchS*(d/tvwPinchD));
    }else if(tvwPanning && tvw_sc>1.01){
      tvw_tx+=e.clientX-tvwLastX; tvw_ty+=e.clientY-tvwLastY;
      tvwLastX=e.clientX; tvwLastY=e.clientY;
      thumbClampPan(); thumbApplyTf();
    }else if(tvwPanning && tvw_sc<=1.01 && tvwPts.size===1){
      const dx=e.clientX-tvwStartX, dy=e.clientY-tvwStartY;
      if(!tvwAxisLock){
        if(Math.hypot(dx,dy)<8) return;   // 아주 조금만 움직였을 땐 아직 방향을 정하지 않는다(탭과 헷갈리지 않게)
        tvwAxisLock=(dy>0 && dy>Math.abs(dx)*1.2) ? 'v' : 'h';
      }
      if(tvwAxisLock==='v'){
        /* 아래로 끄는 중 — 사진이 손가락을 따라 내려가며 옅어진다.
           위로 끄는 건 이 모드로 들어오지 않는다(아래로만 삭제). */
        const d=Math.max(0,dy);
        thumbImg.style.transition='none';
        thumbImg.style.transform='translateY('+d+'px)';
        thumbImg.style.opacity=Math.max(.15, 1-d/400);
      }else{
        /* 확대 안 된 상태에서 옆으로 끄는 중 — 옆 사진의 이음매(테두리)가
           손가락을 그대로 따라오게 트랙을 실시간으로 옮긴다. 더 넘길 사진이
           없는 방향이면 고무줄처럼 30%만 딸려오게 해서 "여기가 끝"임을 알려준다. */
        let ddx=dx;
        const canNext=thumbViewIndex<todaysShots.length-1, canPrev=thumbViewIndex>0;
        if(ddx<0 && !canNext) ddx*=.3;
        if(ddx>0 && !canPrev) ddx*=.3;
        thumbTrack.style.transform='translateX(calc(-33.3333% + '+ddx+'px))';
      }
    }
  });
  /* 손을 뗀 뒤: 확실히 옆으로(70px 이상, 대각선 아님) 끌었고 그 방향에
     넘길 사진이 있으면 트랙을 한 칸 더 이동시켜 완전히 넘기고, 아니면
     제자리로 돌아온다. 실제 사진 전환(썸네일 갱신·태블릿 전송)은
     이동 애니메이션이 끝난 뒤 transitionend 에서 한다. */
  function thumbEndPt(e){
    const wasLoneFinger=tvwPts.size===1 && tvwStartSc<=1.01 && !tvwWasMulti;
    const endX=e.clientX, endY=e.clientY;
    tvwPts.delete(e.pointerId);
    if(tvwPts.size<2) tvwPinchD=0;
    if(tvwPts.size===1){
      const p=[...tvwPts.values()][0];
      tvwPanning=true; tvwLastX=p.x; tvwLastY=p.y;
    }
    if(tvwPts.size===0){
      tvwPanning=false; thumbSyncXf(true);
      if(wasLoneFinger && tvwAxisLock==='v'){
        /* 아래로 끌다가 손을 뗌 — 충분히 내려갔으면 마저 떨어뜨리며 삭제,
           아니면 원래 자리로 튕겨 돌아온다. 트랙(좌우 캐러셀)은 이 동안
           전혀 움직이지 않았으니 자리를 다시 맞춰줄 필요만 있다. */
        const dy=Math.max(0,endY-tvwStartY);
        thumbTrack.classList.remove('dragging');
        thumbTrack.style.transform='translateX(-33.3333%)';
        thumbImg.style.transition='transform .22s ease, opacity .22s ease';
        if(dy>TVW_DEL_PX){
          tvwJustSwiped=true;   // 손 뗀 뒤 이어지는 click 으로 창이 도로 닫히지 않게
          thumbImg.style.transform='translateY('+(dy+400)+'px)';
          thumbImg.style.opacity='0';
          setTimeout(()=>{
            thumbImg.style.transition='none';
            thumbImg.style.opacity='';
            deleteCurrentThumb();
          }, 220);
        }else{
          thumbImg.style.transform='translate(0px,0px) scale(1)';
          thumbImg.style.opacity='';
          setTimeout(()=>{ thumbImg.style.transition='none'; }, 220);
        }
      }else if(wasLoneFinger){
        const dx=endX-tvwStartX, dy=endY-tvwStartY;
        const isSwipe=Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5;
        const goNext=isSwipe && dx<0 && thumbViewIndex<todaysShots.length-1;
        const goPrev=isSwipe && dx>0 && thumbViewIndex>0;
        thumbTrack.classList.remove('dragging');   // 트랜지션을 켜서 아래 이동이 애니메이션되게
        if(goNext || goPrev){
          tvwJustSwiped=true;
          thumbTrackPendingDir=goNext?1:-1;
          thumbTrack.style.transform=goNext ? 'translateX(-66.6667%)' : 'translateX(0%)';
        }else{
          thumbTrack.style.transform='translateX(-33.3333%)';   // 제자리로 스프링백
        }
      }else{
        thumbTrack.classList.remove('dragging');
        thumbTrack.style.transform='translateX(-33.3333%)';
      }
    }
  }
  thumbView.addEventListener('pointerup', thumbEndPt);
  thumbView.addEventListener('pointercancel', thumbEndPt);
  /* PC 웹에서 마우스 휠로도 확대/축소 — 커서 위치를 기준으로 확대해서(핀치의
     두 손가락 가운데점과 같은 역할) 커서가 가리키던 지점이 그대로 화면에
     남는다. deltaY 크기에 비례해서 배율이 바뀌므로, 마우스 휠 한 칸이든
     트랙패드의 미세한 스크롤이든 자연스러운 속도로 확대/축소된다. */
  thumbView.addEventListener('wheel', e=>{
    e.preventDefault();
    const factor=Math.exp(-e.deltaY*0.0015);
    thumbZoomAt(e.clientX, e.clientY, tvw_sc*factor);
  }, {passive:false});
  thumbTrack.addEventListener('transitionend', e=>{
    if(e.propertyName!=='transform' || !thumbTrackPendingDir) return;
    const dir=thumbTrackPendingDir; thumbTrackPendingDir=0;
    const newIndex=thumbViewIndex+dir;
    thumbViewIndex=newIndex;
    const s=todaysShots[newIndex];
    thumbImg.src=s.displayUrl;
    thumbResetZoom();
    thumbFillNeighbors();
    thumbTrackSnapInstant();       // 겉보기엔 계속 이어서 움직인 것처럼, 속으론 가운데 칸으로 순간 복귀
    resendToTv(s, document.querySelectorAll('#todayThumbs img')[newIndex]);
  });

  // 확대 안 된 상태에서 탭하면 닫힌다. 확대 중엔 끌던 손가락이 실수로
  // 창을 닫아버리지 않게 탭으로 안 닫히게 한다(축소 버튼 대신 다시
  // 핀치로 줄이거나 썸네일을 다시 눌러서 원래 크기로 열면 됨).
  thumbView.onclick=()=>{
    if(tvwJustSwiped){ tvwJustSwiped=false; return; }
    if(tvw_sc>1.01) return;
    thumbView.classList.remove('on');
  };

  // 삭제 버튼은 사진 위에 떠 있는 별도 버튼이라, 눌렀을 때 그 아래
  // 드래그·탭 처리(닫기 등)까지 같이 반응하지 않게 이벤트를 여기서 끊는다.
  $('thumbDelBtn').addEventListener('pointerdown', e=>e.stopPropagation());
  $('thumbDelBtn').addEventListener('click', e=>{
    e.stopPropagation();
    deleteCurrentThumb();
  });

  function appendTodayThumb(s, idx){
    const img=document.createElement('img');
    if(s.displayUrl) img.src=s.displayUrl;   // 합성이 아직 안 끝났으면 잠깐 빈 채로 있다가 곧 채워진다
    img.alt=s.name||s.tel||'';
    img.title='탭하면 크게 보고, 태블릿 화면에도 다시 띄웁니다(전체화면에서 좌우로 훑으면 다른 사진으로 넘어감)';
    img.onclick=()=>openThumbAt(idx);
    $('todayThumbs').appendChild(img);
    return img;
  }
  /* 홈 화면에서 오른쪽→왼쪽으로 크게 훑으면 오늘 찍은 사진 중 마지막 걸
     바로 전체화면으로 연다 — 아래로 스크롤해서 작은 썸네일을 찾아 누르는
     대신 방금 찍은 사진을 빠르게 확인할 수 있게. 버튼 탭과는 안 겹친다
     (일반 탭은 이동 거리가 짧아 70px 문턱을 넘지 않는다). */
  let homeSwipeId=null, homeSwipeStartX=0, homeSwipeStartY=0;
  $('home').addEventListener('pointerdown', e=>{
    homeSwipeId=e.pointerId; homeSwipeStartX=e.clientX; homeSwipeStartY=e.clientY;
  }, {passive:true});
  $('home').addEventListener('pointerup', e=>{
    if(e.pointerId!==homeSwipeId) return;
    homeSwipeId=null;
    const dx=e.clientX-homeSwipeStartX, dy=e.clientY-homeSwipeStartY;
    if(!(dx<-70 && Math.abs(dx)>Math.abs(dy)*1.5)) return;   // 스와이프가 아니면 조용히 무시
    // "사진이 없어서 조용히 아무 일도 안 일어남"과 "손짓 자체가 안 먹힘"을
    // 구분할 수 있게, 사진이 없을 때도 뭔가 인식은 됐다는 걸 보여준다.
    if(!todaysShots.length){ $('homeLog').textContent='오늘 찍은 사진이 아직 없어요'; return; }
    openThumbAt(0);   // 가장 먼저 찍은 사진부터 — 그 뒤로는 좌우로 넘기며 순서대로 보면 됨
  }, {passive:true});
  // 브라우저가 제스처를 도중에 가로채면(뒤로가기 등) pointerup 이 안 오고
  // 이게 대신 온다 — 다음 손가락질을 위해 상태만 정리한다
  $('home').addEventListener('pointercancel', e=>{
    if(e.pointerId===homeSwipeId) homeSwipeId=null;
  }, {passive:true});
  /* 썸네일을 탭하면 그 사진(이미 이름표가 합성된 최종본)을 다시 태블릿/PC 확인
     화면으로 보낸다 — 방금 찍은 사진을 화면에 크게 다시 띄우고 싶을 때 사용 */
  async function resendToTv(shot, thumbEl){
    const bmp = await (window.createImageBitmap
      ? createImageBitmap(shot.displayBlob)
      : new Promise((res,rej)=>{
          const im=new Image();
          im.onload=()=>res(im);
          im.onerror=()=>rej();
          im.src=shot.displayUrl;
        }));
    const cv=document.createElement('canvas');
    cv.width=bmp.width||bmp.naturalWidth; cv.height=bmp.height||bmp.naturalHeight;
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    if(bmp.close) bmp.close();

    thumbEl.classList.add('sending');
    const ok=await sendToTvSmart(cv, shot.name, shot.tel, {full:true});
    thumbEl.classList.remove('sending');
    // 성공했을 때는 문구를 따로 띄우지 않는다 (태블릿 화면에 뜨는 것 자체가 확인이 됨)
    if(!ok) $('homeLog').innerHTML='⚠ 태블릿이 연결되어 있지 않습니다 (📺 태블릿 연결 확인)';
  }
  // recomputeAllDisplays() 로 새로 만든 displayUrl 을 지금 화면에 떠 있는
  // 썸네일 <img> 들에 순서대로 반영한다.
  function refreshAllThumbSrcs(){
    const thumbEls=document.querySelectorAll('#todayThumbs img');
    todaysShots.forEach((s, idx)=>{ if(thumbEls[idx]) thumbEls[idx].src=s.displayUrl; });
  }
  /* id를 넘기면(앱을 다시 열어 예전 기록을 되살리는 경우) 새로 저장하지 않고
     그 id 그대로 쓴다 — 안 넘기면(방금 찍은 사진) 새 id를 만들어 DB에도 남긴다.
     blob 은 이름표가 찍히지 않은 "원본" 사진이다 — 화면에 보여줄 합성본은
     이 함수 안에서 그때그때 새로 만든다. 사진 한 장이 늘면 "오늘 전체 몇 명"
     배지 값이 이미 찍힌 사람들 것도 같이 바뀌므로, 이번 한 장만이 아니라
     todaysShots 전체를 다시 합성한다(다운로드된 파일 자체는 저장 당시
     값으로 이미 고정되어 있어 영향받지 않는다). */
  async function addTodayShot(blob, filename, name, tel, id, t){
    const isNew=!id;
    if(isNew) id=Date.now()+'_'+Math.random().toString(36).slice(2,8);
    if(!t) t=Date.now();   // 되살릴 때는 원래 찍은 시각을 그대로 넘겨받는다(안 넘기면 지금 시각)
    const shot={blob, filename, name, tel, displayBlob:null, displayUrl:null, id, t};
    todaysShots.push(shot);
    appendTodayThumb(shot, todaysShots.length-1);
    $('todayWrap').classList.add('show');
    $('todayCount').textContent=todaysShots.length;
    if(isNew) dbPutShot({id, date:todayKey(), filename, name, tel, blob, t});

    await recomputeAllDisplays();
    refreshAllThumbSrcs();
  }
  // 앱을 다시 열었을 때 오늘 찍은 사진을 그대로 되살린다(태블릿 모드에는 이 목록이 없어서 건너뜀).
  // 한 장씩 addTodayShot 을 부르면 사진마다 전체를 다시 합성하는 게 중첩돼
  // 느려지므로, 전부 밀어넣고 나서 딱 한 번만 다시 합성한다.
  async function restoreTodayShots(){
    const recs=await dbLoadTodayAndCleanup();
    if(!recs.length) return;
    for(const r of recs){
      const shot={blob:r.blob, filename:r.filename, name:r.name, tel:r.tel, displayBlob:null, displayUrl:null, id:r.id, t:r.t};
      todaysShots.push(shot);
      appendTodayThumb(shot, todaysShots.length-1);
    }
    $('todayWrap').classList.add('show');
    $('todayCount').textContent=todaysShots.length;
    await recomputeAllDisplays();
    refreshAllThumbSrcs();
  }
  /* 사진 캔버스에 이름·전화번호를 그린다 — 저장 시(다운로드용, ED.compose())와
     화면 표시용 합성(composeDisplay()) 둘 다 이 함수를 같이 쓴다.
     idx/total 을 주면 순번 알약 배지도 같이 그리는데, 지금은 카톡으로
     보낼 때(stampBatchIndex)만 배지를 쓰므로 이 두 경로에선 안 넘긴다. */
  function drawNameBar(ctx, w, h, nm, tel, idx, total){
    const barH=Math.round(h*0.16);
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(0,h-barH,w,barH);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
    const fs=Math.round(barH*0.32);   // 살짝 작게
    let nmRightEdge=null;   // 이름 글자가 가운데 정렬로 실제 어디까지 뻗는지 — 배지가 이름과 같은 줄에 있어서 거길 피해가게 쓴다
    if(nm){
      ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
      ctx.fillText(nm, w/2, h-barH*0.60);
      nmRightEdge=w/2+ctx.measureText(nm).width/2;
    }
    if(tel){
      ctx.font='900 '+fs+'px "Malgun Gothic",sans-serif';
      ctx.fillText(tel, w/2, h-barH*0.24);
    }
    if(idx && total) drawIndexBadge(ctx, w, h, barH, idx, total, nmRightEdge);
  }
  /* overwrite=true 는 "이미 예전 배지가 찍혀 있는 사진에 새 번호를 덮어쓰는"
     경우다. 이땐 두 가지가 더 필요하다.
       1) 알약을 "99/99"가 들어갈 너비까지는 키운다 — 새 번호가 더 짧아도
          (예: "1/15" 자리에 "1/4") 예전 알약이 옆으로 삐져나오지 않게.
          알약은 늘 오른쪽 끝에 같은 높이로 붙으므로, 더 넓기만 하면 예전
          알약을 완전히 품는다.
       2) 알약 배경을 불투명하게 칠한다 — 평소 쓰는 반투명(.7) 보라색으로
          덮으면 밑에 있던 예전 숫자가 그대로 비쳐 보여서 "1/4" 가 "1/45"
          처럼 읽힌다. */
  function drawIndexBadge(ctx, w, h, barH, idx, total, nmRightEdge, overwrite){
    const text=idx+'/'+total;
    const fs=Math.round(barH*0.20);   // 더 작게
    ctx.font='800 '+fs+'px "Malgun Gothic",sans-serif';
    const textW=ctx.measureText(text).width;
    const padX=Math.round(fs*0.55), padY=Math.round(fs*0.4);
    let boxW=textW+padX*2;
    if(overwrite){
      const coverW=ctx.measureText('99/99').width+padX*2;
      if(coverW>boxW) boxW=coverW;
    }
    const boxH=fs+padY*2;
    const marginX=Math.round(w*0.025);
    const gap=Math.round(w*0.02);
    let x=w-marginX-boxW, y=h-barH*0.60-boxH/2;   // 기본 자리: 이름과 같은 줄(바 위쪽), 우측
    // 이름이 길어서 배지 시작 지점까지 뻗어오면(겹치면), 바 위쪽 밖으로 올려서 피한다
    if(nmRightEdge!=null && nmRightEdge+gap>x){
      y=h-barH-boxH-Math.round(h*0.012);
    }
    const r=boxH/2;
    ctx.fillStyle=overwrite?'rgb(97,37,168)':'rgba(109,40,217,.7)';   // 보라색(덮어쓸 땐 불투명)
    ctx.strokeStyle=overwrite?'rgb(255,255,255)':'rgba(255,255,255,.85)';
    ctx.lineWidth=Math.max(1, Math.round(fs*0.08));
    if(ctx.roundRect){
      ctx.beginPath(); ctx.roundRect(x,y,boxW,boxH,r); ctx.fill(); ctx.stroke();
    }else{
      ctx.fillRect(x,y,boxW,boxH); ctx.strokeRect(x,y,boxW,boxH);
    }
    ctx.fillStyle='#facc15';   // 노란색 글자
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='800 '+fs+'px "Malgun Gothic",sans-serif';
    ctx.fillText(text, x+boxW/2, y+boxH/2+Math.round(fs*0.03));
  }
  /* 앱 안(썸네일·전체화면·태블릿)에 보여줄 합성본을 "원본" 클린 사진에서
     그때그때 새로 만든다 — 저장은 클린 사진만 해두고, 보여줄 때마다 이름·
     번호를 다시 그리기 때문에, 나중에 사진을 지우거나 늘어서 "전체 몇 명"이
     바뀌어도 화면에는 항상 최신 값이 보인다. (이미 다운로드 폴더에 저장된
     파일 자체는 저장하던 순간의 값으로 고정돼 있고 앱이 되돌아가 고칠
     방법이 없다.) */
  async function composeDisplay(cleanBlob, nm, tel, idx, total){
    const bmp = await (window.createImageBitmap
      ? createImageBitmap(cleanBlob)
      : new Promise((res,rej)=>{
          const im=new Image(); const u=URL.createObjectURL(cleanBlob);
          im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
          im.onerror=()=>{ URL.revokeObjectURL(u); rej(); };
          im.src=u;
        }));
    const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d');
    ctx.drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    drawNameBar(ctx, w, h, nm, tel, idx, total);
    const blob=await new Promise(res=>cv.toBlob(res, 'image/jpeg', 0.92));
    return { blob, url: URL.createObjectURL(blob) };
  }
  /* 앱 안(썸네일·전체화면·태블릿)에 보여줄 합성본을 만든다. 순번 배지는
     이제 안 붙이므로(카톡으로 보낼 때만 그 묶음 기준으로 새로 찍는다)
     사진이 늘거나 줄어도 이미 만들어둔 합성본은 그대로 유효하다 — 아직
     안 만든 것만 새로 만든다. */
  async function recomputeAllDisplays(){
    await Promise.all(todaysShots.map(async s=>{
      if(s.displayUrl) return;
      const disp=await composeDisplay(s.blob, s.name, s.tel, null, null);
      s.displayBlob=disp.blob; s.displayUrl=disp.url;
    }));
  }
  /* 갤러리에서 고른 사진에 "이번에 보내는 것 중 N번째 / 전부 몇 장" 배지를
     새로 찍어서 내보낸다.

     예전엔 고른 사진이 "오늘 찍은 어느 사람 것인지" 되찾아서(파일명 파싱,
     내용 해시 비교) 그 사람의 번호를 다시 계산하려 했는데, 실제 안드로이드
     기기에서는 갤러리 앱이 파일명도 바꿔서 주고 사진 자체도 다시 인코딩해
     넘기는 경우가 많아 어느 방법으로도 못 찾아 배지가 아예 안 붙었다.

     그래서 "되찾기"를 아예 그만두고, 고른 순서 그대로 1/N, 2/N, ... 을
     매긴다. 되찾을 게 없으니 갤러리 앱이 파일명이나 내용을 어떻게 바꿔
     넘기든 항상 확실히 동작하고, 받는 쪽에서도 "전부 몇 장 중 몇 번째"가
     바로 보여서 빠진 사진이 있는지 확인하기 좋다. */
  async function decodeToCanvas(file){
    let bmp=null;
    if(window.createImageBitmap){
      // 갤러리 원본은 EXIF 회전 정보가 남아 있을 수 있어, 지원하면 그걸 반영해 편다
      try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
      catch(e){ try{ bmp=await createImageBitmap(file); }catch(e2){} }
    }
    if(!bmp){
      bmp=await new Promise((res,rej)=>{
        const im=new Image(); const u=URL.createObjectURL(file);
        im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
        im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('decode')); };
        im.src=u;
      });
    }
    const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    return cv;
  }
  /* 사진에 이미 예전 배지가 찍혀 있으면 그 자리에 그대로 덮어쓴다
     (drawIndexBadge 의 overwrite 모드 — 넓게 + 불투명하게). */
  async function stampBatchIndex(file, idx, total){
    const cv=await decodeToCanvas(file);
    const w=cv.width, h=cv.height;
    const ctx=cv.getContext('2d');
    drawIndexBadge(ctx, w, h, Math.round(h*0.16), idx, total, null, true);
    const blob=await new Promise(res=>cv.toBlob(res, 'image/jpeg', 0.92));
    return new File([blob], file.name, {type:'image/jpeg'});
  }
  /* "카톡 사진 전송"과 "갤러리 사진 전송"을 버튼 하나로 합쳤다 — 오늘 찍은
     사진이 있든 없든 항상 갤러리에서 사진을 골라 그대로 보낸다. 오늘 찍은
     사진도 이미 다운로드 폴더(갤러리)에 저장돼 있으므로 거기서 같이 고르면
     된다 — "오늘 찍은 사진이 있으면 자동으로 그걸 먼저 보낸다"는 예전
     동작은, 사진이 하나라도 있으면 갤러리 선택 자체가 안 열려서 오히려
     헷갈린다는 피드백을 받고 없앴다.

     갤러리 선택 흐름은 파일 선택창(갤러리 앱)을 한 번 거치고 돌아오면
     방금까지의 사용자 조작 자격이 사라져서, 그 흐름 안에서 바로 share() 를
     불러도 조용히 막힌다(카톡창이 안 뜨는 원인) — 그래서 파일을 고른 뒤
     곧장 보내지 않고 버튼을 "N장 선택됨" 상태로 바꿔, 사용자가 한 번 더
     직접 눌렀을 때(완전히 새로운 조작) share() 를 부른다. */
  let pendingResendFiles=null;
  const bSendPhotos=$('bResendGallery');
  const SEND_PHOTOS_LABEL='사진 카톡 전송';
  $('bResendGallery').onclick=async ()=>{
    if(pendingResendFiles){
      const files=pendingResendFiles;
      pendingResendFiles=null;
      setBtn(bSendPhotos,'📤',SEND_PHOTOS_LABEL);
      const shareData={ files, title:'새가족 사진' };
      try{
        if(navigator.canShare && navigator.canShare(shareData)){
          await navigator.share(shareData);
        }else{
          alert('이 브라우저에서는 여러 장을 한 번에 공유할 수 없습니다.\n갤러리(사진) 앱에서 직접 선택해 카톡으로 보내주세요.');
        }
      }catch(err){}   // 사용자가 공유창을 취소한 경우 등은 조용히 무시
      return;
    }
    $('fResend').click();
  };
  $('fResend').addEventListener('change', async e=>{
    const files=Array.prototype.slice.call(e.target.files||[]).filter(f=>f && f.type.indexOf('image')===0);
    e.target.value='';
    if(!files.length) return;
    setBtn(bSendPhotos,'📤','번호 매기는 중...');
    // 고른 순서 그대로 1/N, 2/N ... 을 새로 찍는다
    const fixed=await Promise.all(files.map(async (f,i)=>{
      try{ return await stampBatchIndex(f, i+1, files.length); }
      catch(err){ return f; }   // 다시 그리다 실패하면 원본이라도 보낸다
    }));
    pendingResendFiles=fixed;
    setBtn(bSendPhotos,'📤',fixed.length+'장 선택됨 · 눌러서 전송');
  });

  /* ───── 사진 편집기 ─────
     기본 카메라 앱이 찍은 사진을 받아 이름·전화번호를 합성해 저장한다.
     (웹 카메라를 직접 쓰면 기본 앱의 1x 광각 렌즈에 접근할 수 없어 화각이
      좁아지는 문제가 있어, 촬영은 전적으로 기본 카메라 앱에 맡긴다.) */
  const ED = (function(){
    const nI=$('edName'), tI=$('edTel'), hintEl=$('edHint');
    const nameWrap=$('edNameWrap'), micBtn=$('edMic'), telWrap=$('edTelWrap'), telMicBtn=$('edTelMic');
    const MAXPX=2400;                       // 긴 변 기준 최대 크기 (용량·속도 절충)
    let baseCanvas=null;                    // 방향까지 바로잡힌 원본
    let queue=[], qi=0;                     // 여러 장 선택했을 때의 처리 대기열
    /* 이름 칸 옆 마이크 — 이름을 직접 타이핑하지 않고 말해서 채운다.
       사진마다(그리고 편집기가 닫힐 때마다) micGen 을 올려서, 사진이 바뀐 뒤에
       뒤늦게 도착한 인식 결과가 엉뚱한 사진의 이름칸에 쓰이지 않게 한다. */
    let micRec=null, micGen=0;
    function micStop(){ micGen++; if(micRec){ try{ micRec.abort(); }catch(e){} micRec=null; } }

    /* EXIF 방향까지 반영해서 이미지를 읽는다 */
    async function loadOriented(file){
      if(window.createImageBitmap){
        try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
        try{ return await createImageBitmap(file); }catch(e){}
      }
      return await new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>res(img);
        img.onerror=rej;
        img.src=URL.createObjectURL(file);
      });
    }

    async function showFile(file){
      micStop();   // 이전 사진에서 켜져 있던 음성 인식이 있으면 끊는다
      const src=await loadOriented(file);
      const sw=src.width, sh=src.height;
      const k=Math.min(1, MAXPX/Math.max(sw,sh));
      const w=Math.round(sw*k), h=Math.round(sh*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(src,0,0,w,h);
      if(src.close) src.close();
      baseCanvas=cv; baseCanvas.__file=file;

      // edStage 는 평소 사진 대신 은은한 배경만 보여주지만, 우측으로 끌면
      // 이 사진 자체가 드러나 보이게 미리 심어둔다(평소엔 투명, 안 보임).
      const stage=$('edStage');
      const prevCanvas=stage.querySelector('canvas');
      if(prevCanvas) prevCanvas.remove();
      baseCanvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;transform-origin:center center;';
      stage.appendChild(baseCanvas);
      $('edBottom').style.transition='none';
      $('edBottom').style.opacity='1';   // 직전에 오른쪽으로 끌다 만 상태가 남아있을 수 있으니 매 사진마다 되돌려둔다
      $('edBottom').style.pointerEvents='';   // 미리보기 중 숨겨서 꺼뒀던 상호작용도 다시 켠다
      edPreviewOn=false;   // 이전 사진에서 ✕ 로 미리보기를 켜둔 채 다음 사진으로 넘어가지 않게
      edJustCancelled=false;   // 예전 취소 스와이프의 흔적이 다음(새) 편집 세션의 첫 탭을 삼켜버리지 않게
      edResetZoom();   // 이전 사진에서 확대해 둔 채로 다음 사진이 시작되지 않게

      nI.value=''; tI.value='';
      hintEl.textContent = queue.length>1 ? (qi+1)+' / '+queue.length+' 장' : '';
      $('editor').classList.add('on');
      // 미리보기 중 스와이프로 다음/이전 사진으로 넘어간 경우(showFile 직후
      // .then(edEnterPreview)가 곧바로 다시 미리보기를 켠다)엔 이 시점에
      // edPreviewOn이 true가 돼 있어야 정상 — 그럴 땐 입력칸이 안 보이므로
      // 포커스를 주면 안 된다(안 그러면 키보드가 뜬다).
      setTimeout(()=>{ if($('editor').classList.contains('on') && !edPreviewOn) nI.focus(); },150);
    }

    function fileBase(){
      const nm=safeSeg(nI.value)||'이름없음';
      const tel=fmtTel(tI.value).replace(/[\\/:*?"<>|\s]/g,'');
      const dateStr=stampOf(baseCanvas&&baseCanvas.__file);
      const n=nextCounter(dateStr);
      return dateStr+'_'+n+'_'+nm+(tel?'_'+tel:'');
    }

    /* 사진 아래쪽에 이름·전화번호를 같은 크기로 합성 */
    function compose(){
      const w=baseCanvas.width, h=baseCanvas.height;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.drawImage(baseCanvas,0,0);
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      // 순번 배지는 여기서 안 붙인다 — 카톡으로 보낼 때 그 묶음 기준으로
      // 그때그때 새로 찍는다(아래 stampBatchIndex). 저장되는 사진 자체엔
      // 이름·전화번호만 들어간다.
      drawNameBar(ctx, w, h, nm, tel, null, null);
      return cv;
    }

    /* 저장이 끝나기 전에 저장 버튼을 또 누르면(급할 때 흔한 연타) 같은 사진이
       두 번 저장되고 번호가 밀리며, 여러 장 처리 중이었다면 그 사이 한 장이
       통째로 건너뛰어진다. 저장이 끝날 때까지 잠가둔다 — 그리고 다음 장이
       실제로 화면에 뜰 때까지도 잠금을 유지해서(예전엔 저장 직후 바로 풀었다),
       그 짧은 전환 구간에 배경 탭·다시 찍기·재입력이 끼어들어 큐가 망가지거나
       화면이 엉뚱하게 다시 열리는 일이 없게 한다. */
    let saving=false;
    /* 저장마다 하나씩 늘어나는 번호. 앞선 저장의 태블릿 전송 결과가 늦게
       도착했을 때, 그 사이 더 최근 저장이 이미 로그를 넘겨받았다면
       엉뚱한(다음) 사진 쪽 로그에 잘못 붙는 일을 막는다. */
    let saveSeq=0;
    function saveShot(){
      if(saving) return;
      if(!baseCanvas) return;
      const nm=nI.value.trim(), tel=fmtTel(tI.value);
      if(!nm && !tel){ hintEl.textContent='이름 또는 전화번호를 입력해주세요'; return; }
      saving=true; $('edSave').disabled=true;
      const mySeq=++saveSeq;

      const name=fileBase()+'.jpg';
      const cleanCanvas=baseCanvas;   // showFile()이 다음 사진으로 baseCanvas 를 바꾸기 전에 미리 붙잡아둔다
      const composed=compose();

      // 벽걸이 태블릿에도 즉시 띄운다 (연결돼 있을 때만)
      const tvSend = sendToTvSmart(composed, nm, tel);

      composed.toBlob(async blob=>{
        if(!blob){
          hintEl.textContent='저장에 실패했습니다. 다시 시도해주세요';
          saving=false; $('edSave').disabled=false;
          return;
        }
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);

        // 실제 저장·전송은 화면 상태와 무관하게 항상 한다 — 입력한 이름·전화가
        // 담긴 사진을 화면 전환 타이밍 때문에 버리면 안 된다.
        // 앱 안(썸네일·전체화면·태블릿)에는 이름표 없는 "원본"을 따로 저장해서,
        // 나중에 사진을 지워 번호가 바뀌어도 그 자리에서 다시 합성해 보여줄 수
        // 있게 한다 — 지금 막 다운로드한 파일은 이미 고정된 번호라 못 바꾼다.
        const cleanBlob=await new Promise(res=>cleanCanvas.toBlob(res, 'image/jpeg', 0.92));
        await addTodayShot(cleanBlob||blob, name, nm, tel);

        if(mySeq===saveSeq){
          $('homeLog').innerHTML='';   // 저장 성공 로그는 화면에 안 띄운다(파일은 그대로 저장됨)
        }
        // 태블릿 전송이 실패했을 때만 알려준다 — 성공은 태블릿 화면에 뜨는 것 자체가 확인이 됨
        tvSend.then(ok=>{
          if(mySeq!==saveSeq) return;   // 그 사이 더 최근 저장이 로그를 넘겨받았다
          if(!ok) $('homeLog').innerHTML='⚠ 태블릿 전송 실패 (📺 태블릿 연결 확인)';
        });

        // 여러 장을 골랐다면 다음 장으로, 아니면 편집기를 닫는다.
        // 다음 장이 실제로 뜬 뒤에야 잠금을 풀어서(await), 그 사이 배경 탭·연타로
        // 큐가 어긋나거나 같은 사진이 중복 저장되는 일을 막는다.
        if(qi+1 < queue.length){
          qi++;
          try{ await showFile(queue[qi]); }
          catch(e){ alert('다음 사진을 불러오지 못했습니다.'); queue=[]; qi=0; close(); return; }
          saving=false; $('edSave').disabled=false;
        }else{
          queue=[]; qi=0; close();
        }
      }, 'image/jpeg', 0.92);
    }

    function close(){
      micStop();
      $('editor').classList.remove('on');
      baseCanvas=null;
      saving=false; $('edSave').disabled=false;   // 어떤 경로로 닫히든 잠금은 반드시 푼다
    }

    async function start(files){
      const list=Array.prototype.slice.call(files||[]).filter(f=>f && f.type.indexOf('image')===0);
      if(!list.length) return;
      queue=list; qi=0;
      try{ await showFile(list[0]); }
      catch(e){ alert('사진을 불러오지 못했습니다.'); close(); }
    }

    $('edSave').onclick=saveShot;
    $('edAgain').onclick=()=>{
      if(saving) return;   // 저장 처리 중엔 무시 — 끝나면 다시 눌러도 늦지 않다
      queue=[]; qi=0; close(); $('fCam').click();
    };
    /* 눌러서 이름·전화번호·다시찍기·저장 입력판을 숨기고, 그 자리에 골라둔
       사진을 전체 크기로 보여준다(오른쪽으로 끌었을 때와 같은 방식). 이미
       미리보기 중일 때 또 누르면(더 갈 데가 없으므로) 대기열째 전부
       취소하고 처음 화면으로 돌아간다 — 미리보기에서 다시 입력 화면으로
       돌아가려면 사진을 탭하면 된다(아래 edStage 탭 처리). */
    let edPreviewOn=false;
    $('edCancelBtn').onclick=()=>{
      if(edPreviewOn){
        queue=[]; qi=0; close();
        return;
      }
      edPreviewOn=true;
      edResetZoom();
      edDropInputFocus();   // 입력칸에 포커스가 남아 있으면 키보드가 계속 떠 있으므로 같이 내린다
      if(baseCanvas){ baseCanvas.style.transition='opacity .2s ease'; baseCanvas.style.opacity='1'; }
      edBottom.style.transition='opacity .2s ease';
      edBottom.style.opacity='0';
      edBottom.style.pointerEvents='none';   // 숨은 이름·전화번호 칸이 사진 터치를 가로채 키보드가 뜨는 일이 없게
    };
    /* 사진을 전체 크기로 볼 때는 어떤 키보드도(폰 기본 숫자 키보드든, 앱이
       그리는 한글 자판이든) 남아 있으면 안 된다. */
    function edDropInputFocus(){
      try{ nI.blur(); tI.blur(); }catch(e){}
      kbKeepOpen();   // 아래에서 바로 닫으므로 예약된 닫기는 취소
      kbShow(null);
    }
    /* 사진을 안 보여주는 대신, 그 배경(입력판 바깥)을 탭하면 저장하지 않고 닫힌다.
       여러 장을 고른 경우엔 "전부 취소"가 아니라 "이 한 장만 건너뛰기"로 동작해서
       나머지 대기 중인 사진까지 같이 사라지지 않게 한다.
       미리보기 중일 때는 뜻이 달라져서, 탭하면 건너뛰지 않고 그냥 입력
       화면으로 돌아간다(✕ 는 그 상태에서 전체 취소 전용이 됐으므로) — 단,
       확대되어 있는 동안은 탭으로 실수로 안 닫히게 막는다. */
    $('edStage').onclick=()=>{
      if(edJustCancelled){ edJustCancelled=false; return; }   // 방금 오른쪽으로 끌어 취소한 뒤 이어지는 탭은 무시
      if(saving) return;   // 저장 처리 중엔 무시
      if(edPreviewOn){
        if(edZ_sc>1.01) return;   // 확대 중엔 탭으로 안 닫힌다(다시 축소하거나 사진을 다시 눌러야 함)
        edPreviewOn=false;
        if(baseCanvas){ baseCanvas.style.transition='opacity .2s ease'; baseCanvas.style.opacity='0'; }
        edBottom.style.transition='opacity .2s ease';
        edBottom.style.opacity='1';
        edBottom.style.pointerEvents='';
        return;
      }
      if(qi+1 < queue.length){
        qi++;
        showFile(queue[qi]).catch(()=>{ alert('다음 사진을 불러오지 못했습니다.'); queue=[]; qi=0; close(); });
      }else{
        queue=[]; qi=0; close();
      }
    };
    /* 오른쪽으로 끌면 사진이 점점 드러나 보이고(이름·전화번호를 입력하지
       않고도 실제 사진을 미리 볼 수 있게) 이름·전화번호 입력판은 반대로
       옅어지며 숨어서, 다 끌었을 때 사진이 가려짐 없이 진짜 전체 크기로
       보인다. 충분히 끌고 놓으면 ✕ 버튼과 같이 대기열째 전부 취소하고
       처음 화면으로 돌아가고, 덜 끌면 둘 다 원래대로 돌아오고 편집은
       그대로 계속된다.

       이미 ✕ 로 미리보기 중일 때는(edPreviewOn) 완전히 다른 제스처
       체계로 바뀐다 — 태블릿 확인 화면의 핀치줌과 같은 방식으로 두 손가락
       핀치·한 손가락 이동(확대 중)·좌우 스와이프(안 확대일 때, 다음/이전
       사진 넘기기)를 모두 처리한다. */
    let edDragId=null, edDragStartX=0, edDragStartY=0, edDragging=false, edJustCancelled=false;
    const ED_REVEAL_PX=140, ED_CANCEL_PX=170, ED_QUEUE_NAV_PX=70;
    const edBottom=$('edBottom');

    // ── 미리보기 중 핀치줌·이동(썸네일 전체화면 보기와 같은 방식) ──
    const edZPts=new Map();
    let edZPanning=false, edZLastX=0, edZLastY=0, edZPinchD=0, edZPinchS=1;
    let edZStartX=0, edZStartY=0, edZStartSc=1, edZWasMulti=false;
    let edZ_sc=1, edZ_tx=0, edZ_ty=0;
    const EDZ_MIN=1, EDZ_MAX=6;
    function edApplyZoomTf(){ if(baseCanvas) baseCanvas.style.transform='translate('+edZ_tx+'px,'+edZ_ty+'px) scale('+edZ_sc+')'; }
    function edClampZoomPan(){
      if(!baseCanvas) return;
      const st=$('edStage').getBoundingClientRect();
      const w=baseCanvas.clientWidth*edZ_sc, h=baseCanvas.clientHeight*edZ_sc;
      const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
      edZ_tx=Math.min(mx,Math.max(-mx,edZ_tx));
      edZ_ty=Math.min(my,Math.max(-my,edZ_ty));
    }
    function edZoomAt(px,py,next){
      const st=$('edStage').getBoundingClientRect();
      const ox=px-st.left-st.width/2, oy=py-st.top-st.height/2;
      const s2=Math.min(EDZ_MAX,Math.max(EDZ_MIN,next));
      const u=(ox-edZ_tx)/edZ_sc, v=(oy-edZ_ty)/edZ_sc;
      edZ_tx=ox-u*s2; edZ_ty=oy-v*s2; edZ_sc=s2;
      if(edZ_sc<=1.001){ edZ_sc=1; edZ_tx=0; edZ_ty=0; }
      edClampZoomPan(); edApplyZoomTf();
    }
    function edResetZoom(){ edZ_sc=1; edZ_tx=0; edZ_ty=0; edApplyZoomTf(); }

    function edEnterPreview(){
      edPreviewOn=true;
      edResetZoom();
      edDropInputFocus();
      if(baseCanvas){ baseCanvas.style.transition='none'; baseCanvas.style.opacity='1'; }
      edBottom.style.transition='none'; edBottom.style.opacity='0';
      edBottom.style.pointerEvents='none';
    }
    $('edStage').addEventListener('pointerdown', e=>{
      if(saving) return;
      if(edPreviewOn){
        try{ $('edStage').setPointerCapture(e.pointerId); }catch(err){}
        edZPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(edZPts.size===1){
          edZPanning=true; edZLastX=e.clientX; edZLastY=e.clientY;
          edZStartX=e.clientX; edZStartY=e.clientY; edZStartSc=edZ_sc;
          edZWasMulti=false;
        }else if(edZPts.size===2){
          edZPanning=false; edZWasMulti=true;
          const [a,b]=[...edZPts.values()];
          edZPinchD=Math.hypot(a.x-b.x,a.y-b.y); edZPinchS=edZ_sc;
        }
        return;
      }
      edDragId=e.pointerId; edDragStartX=e.clientX; edDragStartY=e.clientY; edDragging=false;
      try{ $('edStage').setPointerCapture(e.pointerId); }catch(err){}
    });
    $('edStage').addEventListener('pointermove', e=>{
      if(edPreviewOn){
        if(!edZPts.has(e.pointerId)) return;
        edZPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(edZPts.size===2 && edZPinchD>0){
          const [a,b]=[...edZPts.values()];
          const d=Math.hypot(a.x-b.x,a.y-b.y);
          edZoomAt((a.x+b.x)/2,(a.y+b.y)/2, edZPinchS*(d/edZPinchD));
        }else if(edZPanning && edZ_sc>1.01){
          edZ_tx+=e.clientX-edZLastX; edZ_ty+=e.clientY-edZLastY;
          edZLastX=e.clientX; edZLastY=e.clientY;
          edClampZoomPan(); edApplyZoomTf();
        }
        // 확대 안 된 상태에서 한 손가락 이동은 여기선 아무것도 안 하고
        // 손을 뗄 때(edStageEndDrag)만 방향을 보고 다음/이전 사진으로 넘긴다
        return;
      }
      if(e.pointerId!==edDragId) return;
      const dx=e.clientX-edDragStartX, dy=e.clientY-edDragStartY;
      if(!edDragging){
        if(Math.hypot(dx,dy)<10) return;   // 아직 방향을 정하기엔 너무 조금 움직였다

        edBottom.style.transition='none';
      }
      const t=Math.min(1, dx/ED_REVEAL_PX);
      if(baseCanvas){ baseCanvas.style.transition='none'; baseCanvas.style.opacity=String(t); }
      edBottom.style.opacity=String(1-t);
    });
    function edStageEndDrag(e){
      if(edPreviewOn){

        const endX=e.clientX;
        edZPts.delete(e.pointerId);

        if(edZPts.size===1){
          const p=[...edZPts.values()][0];
          edZPanning=true; edZLastX=p.x; edZLastY=p.y;
        }
        if(edZPts.size===0){
          edZPanning=false;
          if(wasLoneFinger){
            const dx=endX-edZStartX;
            if(dx<-ED_QUEUE_NAV_PX && qi+1<queue.length){
              qi++;
              showFile(queue[qi]).then(edEnterPreview)
                .catch(()=>{ alert('다음 사진을 불러오지 못했습니다.'); queue=[]; qi=0; close(); });
            }else if(dx>ED_QUEUE_NAV_PX && qi>0){

                .catch(()=>{ alert('사진을 불러오지 못했습니다.'); queue=[]; qi=0; close(); });
            }
          }
        }
        return;
      }
      if(e.pointerId!==edDragId) return;
      edDragId=null;
      if(!edDragging) return;
      edDragging=false;
      const dx=e.clientX-edDragStartX;
      if(baseCanvas) baseCanvas.style.transition='opacity .2s ease';
      edBottom.style.transition='opacity .2s ease';
      if(dx>ED_CANCEL_PX){

        edBottom.style.opacity='1';
        edBottom.style.pointerEvents='';

    /* PC 웹에서도 마우스 휠로 미리보기 사진을 확대/축소(썸네일 전체화면

    $('edStage').addEventListener('wheel', e=>{

    /* ───── 앱이 직접 그리는 한글 자판 (두벌식) ─────
       폰 기본 키보드는 웹에서 자판 구성을 바꿀 수 없어서(숫자줄·특수문자·

       "ㄱ"+"ㅏ" 는 "ㄱㅏ" 가 아니라 "가" 가 돼야 하고, 거기에 "ㅁ" 을 더하면

    const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    // 두 모음/두 자음이 합쳐지는 짝 (ㅗ+ㅏ=ㅘ, ㄹ+ㄱ=ㄺ 등)

    const JONG_COMB={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
    // 지울 때 되돌리려고 합쳐진 짝을 거꾸로도 찾을 수 있게 해둔다

    Object.keys(JUNG_COMB).forEach(k=>{ JUNG_SPLIT[JUNG_COMB[k]]=[k[0],k[1]]; });
    Object.keys(JONG_COMB).forEach(k=>{ JONG_SPLIT[JONG_COMB[k]]=[k[0],k[1]]; });

    /* ── 천지인 방식 ──

    const CJ_CONS={
      k1:['ㄱ','ㅋ','ㄲ'], k2:['ㄴ','ㄹ'],     k3:['ㄷ','ㅌ','ㄸ'],
      k4:['ㅂ','ㅍ','ㅃ'], k5:['ㅅ','ㅎ','ㅆ'], k6:['ㅈ','ㅊ','ㅉ'],
      k7:['ㅇ','ㅁ'],
      /* 두벌식(가나다 배열)용 자음 — 같은 키를 거듭 누르면 다음 글자로
         바뀐다. 차례는 "이름에 자주 나오는 것부터" 로 잡았다. ㅅ 키가
         ㅅ→ㅈ→ㅊ→ㅆ→ㅉ 인 것도 그래서다(ㅆ·ㅉ 은 이름에 거의 안 쓰여

      q1:['ㄱ','ㄲ','ㅋ'], q2:['ㄴ'],          q3:['ㄷ','ㄸ','ㅌ'], q4:['ㄹ'],
      q5:['ㅁ'],          q6:['ㅂ','ㅃ','ㅍ'],
      q7:['ㅅ','ㅈ','ㅊ','ㅆ','ㅉ'],           q8:['ㅇ','ㅎ']
    };
    /* 두벌식C 모음 — 거듭 누르면 다음 모음이 된다(ㅗ→ㅛ, ㅏ→ㅐ→ㅑ→ㅒ).
       ㅐ·ㅔ 는 따로 키도 있지만 ㅏ·ㅓ 키에서 두 번째로도 나오게 해 뒀다 —
       이름에는 ㅑ·ㅕ 보다 ㅐ·ㅔ 가 훨씬 자주 나오므로(재·세·태·혜) 두 번
       만에 닿게 한 것이다. 손을 아래줄 ㅐ·ㅔ 키로 옮겨도 물론 된다.
       ㅗ 키도 마찬가지로 ㅗ→ㅛ→ㅜ→ㅠ 넉 자를, ㅣ 키는 ㅣ→ㅡ 를 낸다.
       ㅜ·ㅡ 전용 키는 그대로 두었으니 손을 옮기든 그 자리에서 더 누르든
       둘 다 된다. 다만 "의" 처럼 ㅡ 와 ㅣ 를 잇대는 글자는 ㅡ 전용 키를
       써야 한다 — ㅣ 를 세 번 누르면 합쳐지지 않고 차례가 ㅣ 로 돌아온다.
       겹모음 합치기(ㅗ+ㅏ=ㅘ)는 다른 키를 눌렀을 때 그대로 동작한다. */
    const QW_VOW={
      v1:['ㅣ','ㅡ'], v2:['ㅏ','ㅐ','ㅑ','ㅒ'], v3:['ㅓ','ㅔ','ㅕ','ㅖ'],
      v4:['ㅗ','ㅛ','ㅜ','ㅠ'],
      v5:['ㅜ','ㅠ'], v6:['ㅡ'], v7:['ㅐ','ㅒ'], v8:['ㅔ','ㅖ']
    };
    /* 지울 때 되돌릴 짝 — 거듭 눌러 바뀐 모음은 한 단계만 되돌린다
       ("요"에서 지우면 "오", 통째로 사라지면 안 된다). */
    const QW_DEVOW={'ㅑ':'ㅏ','ㅕ':'ㅓ','ㅛ':'ㅗ','ㅠ':'ㅜ','ㅒ':'ㅐ','ㅖ':'ㅔ'};
    const CJ_VOW={
      'ㅣ':'ㅣ', 'ㅡ':'ㅡ', 'ㅡㅣ':'ㅢ',
      'ㅣㆍ':'ㅏ', 'ㅣㆍㆍ':'ㅑ', 'ㅣㆍㅣ':'ㅐ', 'ㅣㆍㆍㅣ':'ㅒ',
      'ㆍㅣ':'ㅓ', 'ㆍㅣㅣ':'ㅔ', 'ㆍㆍㅣ':'ㅕ', 'ㆍㆍㅣㅣ':'ㅖ',
      'ㆍㅡ':'ㅗ', 'ㆍㆍㅡ':'ㅛ', 'ㆍㅡㅣ':'ㅚ', 'ㆍㅡㅣㆍ':'ㅘ', 'ㆍㅡㅣㆍㅣ':'ㅙ',
      'ㅡㆍ':'ㅜ', 'ㅡㆍㆍ':'ㅠ', 'ㅡㆍㅣ':'ㅟ', 'ㅡㆍㆍㅣ':'ㅝ', 'ㅡㆍㆍㅣㅣ':'ㅞ'
    };
    /* 아직 모음이 안 된 중간 조각도 이어붙일 수 있어야 한다 — 예를 들어
       "ㆍㆍ" 자체는 모음이 아니지만 "ㆍㆍㅣ"(ㅕ) 로 가는 길목이라, 여기서
       끊어버리면 ㅕ·ㅛ 를 아예 못 친다. 그래서 완성된 모음뿐 아니라

    const CJ_PREFIX=new Set();
    Object.keys(CJ_VOW).forEach(k=>{ for(let i=1;i<=k.length;i++) CJ_PREFIX.add(k.slice(0,i)); });
    /* 지울 때 되돌릴 짝 — 같은 모음 키를 두 번 눌러 획을 더한 것들은

       떼면 "ㆍㆍ" 같은 어중간한 상태가 남아 보기 이상해진다. */
    const CJ_DESTROKE={
      'ㅣㆍㆍ':'ㅣㆍ', 'ㆍㆍㅣ':'ㆍㅣ', 'ㆍㆍㅡ':'ㆍㅡ', 'ㅡㆍㆍ':'ㅡㆍ',

    };

       · 모음은 길게 줘도 잃는 게 없다. 한글은 음절 사이에 반드시 자음이

    /* ── 꾹 누르면 나오는 성씨 ──

       글자부터는 지금까지처럼 자모만 나온다 — 늘 붙어 있지 않으니 화면이

    const KB_SURNAME={
      q1:['김','강','고','권','구','곽'],
      q5:['문','민','명','마','모'],
      q6:['박','배','백','변','방','반'],
      q2:['남','노','나'],
      q3:['도','태'],
      q4:['류','라'],
      /* ㅅ 키에는 ㅈ·ㅊ 이, ㅇ 키에는 ㅎ 이 함께 들어 있어서 성씨가 유난히
         많다. 한 줄에 여섯 칸이 한계(320px 폰 기준)라 인구가 많은 순으로
