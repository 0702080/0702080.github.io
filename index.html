      q7:['최','정','조','장','신','서'],
      q8:['이','윤','임','오','한','황']
    };
    const CJ_HOLD=1200;        // 자음
    const CJ_HOLD_VOWEL=1600;  // 모음

    let kbBase='', kbCho=-1, kbJung=-1, kbJong=0;
    let kbVowSeq='';                       // 지금 만들고 있는 모음의 ㅣㆍㅡ 조각들
    let kbCycKey=null, kbCycStep=0, kbCycPos=null, kbCycTimer=null;
    function kbCycStop(){ if(kbCycTimer){ clearTimeout(kbCycTimer); kbCycTimer=null; } kbCycKey=null; kbCycPos=null; }
    function kbCycArm(){
      if(kbCycTimer) clearTimeout(kbCycTimer);
      kbCycTimer=setTimeout(()=>{ kbCycTimer=null; kbCycKey=null; kbCycPos=null; }, CJ_HOLD);
    }
    // 아직 모음이 안 된 조각(ㆍ, ㆍㆍ)은 그대로 보여줘서 눌린 게 보이게 한다
    function kbPending(){ return (kbJung<0 && kbVowSeq && !CJ_VOW[kbVowSeq]) ? kbVowSeq : ''; }
    function kbComposed(){
      if(kbCho>=0 && kbJung>=0) return String.fromCharCode(0xAC00+(kbCho*21+kbJung)*28+kbJong);
      if(kbCho>=0) return CHO[kbCho]+kbPending();
      if(kbJung>=0) return JUNG[kbJung];
      return kbPending();
    }
    function kbRender(){
      nI.value=kbBase+kbComposed();
      nI.dispatchEvent(new Event('input',{bubbles:true}));
      if(kbTarget==='name') nameSaySoon();   // 손을 멈추면 읽어준다
    }
    function kbFlush(){ kbBase+=kbComposed(); kbCho=-1; kbJung=-1; kbJong=0; kbVowSeq=''; }
    function kbResetFrom(v){ kbBase=v||''; kbCho=-1; kbJung=-1; kbJong=0; kbVowSeq=''; kbCycStop(); }
    /* 마이크나 새 사진 시작처럼 자판을 거치지 않고 값이 바뀌었으면, 조립
       중이던 상태를 버리고 현재 값에서 다시 시작한다(안 그러면 다음 타건에
       옛 글자가 되살아난다). */
    function kbSync(){ if(nI.value!==kbBase+kbComposed()) kbResetFrom(nI.value); }

    function kbCons(keyId){
      kbSync();
      const cyc=CJ_CONS[keyId];
      if(!cyc) return;
      // 같은 키를 이어 눌렀으면 그 자리에서 다음 글자로 바꾼다
      if(kbCycKey===keyId && kbCycPos){
        const list = kbCycPos==='jong' ? cyc.filter(j=>JONG.indexOf(j)>0) : cyc;
        /* 글자가 하나뿐인 키(ㄴ·ㄹ·ㅁ)는 거듭 눌러도 바뀔 게 없다. 그런 키를
           또 눌렀다면 "김민" 의 ㅁㅁ, "한나" 의 ㄴㄴ 처럼 받침을 놓고 다음
           글자를 치려는 것이다. 아래로 내려보내 새 글자로 받는다.
           이 갈래가 없을 때는 두 번째 타건이 삼켜져 "기민"·"하나" 가 됐다. */
        if(list.length>1){
          kbCycStep=(kbCycStep+1)%list.length;
          const j=list[kbCycStep];
          if(kbCycPos==='cho') kbCho=CHO.indexOf(j); else kbJong=JONG.indexOf(j);
          kbCycArm(); kbRender(); return;
        }
        kbCycStop();
      }
      const j=cyc[0];
      if(kbJung<0 && kbVowSeq) kbVowSeq='';   // 덜 만든 모음 조각은 버린다
      if(kbCho>=0 && kbJung>=0){
        if(kbJong===0 && JONG.indexOf(j)>0){ kbJong=JONG.indexOf(j); kbCycPos='jong'; }
        else if(kbJong>0){
          const comb=JONG_COMB[JONG[kbJong]+j];
          if(comb){ kbJong=JONG.indexOf(comb); kbCycPos=null; }
          else{ kbFlush(); kbCho=CHO.indexOf(j); kbCycPos='cho'; }
        }
        else{ kbFlush(); kbCho=CHO.indexOf(j); kbCycPos='cho'; }
      }else{
        if(kbCho>=0 || kbJung>=0) kbFlush();
        kbCho=CHO.indexOf(j); kbCycPos='cho';
      }
      kbCycKey=keyId; kbCycStep=0; kbCycArm();
      kbRender();
    }
    function kbVowel(part){         // part 는 'ㅣ' | 'ㆍ' | 'ㅡ'
      kbSync();
      kbCycStop();                  // 모음을 누르면 자음 바꾸기는 끝난다
      // 받침이 있으면 그 받침이 다음 글자의 첫소리로 넘어간다: "감"+ㅏ → "가마"
      if(kbCho>=0 && kbJung>=0 && kbJong>0){
        const jc=JONG[kbJong], sp=JONG_SPLIT[jc];
        const moved = sp ? sp[1] : jc;
        kbJong = sp ? JONG.indexOf(sp[0]) : 0;
        kbFlush();
        kbCho=CHO.indexOf(moved);
        kbVowSeq=part; kbJung = CJ_VOW[part] ? JUNG.indexOf(CJ_VOW[part]) : -1;
        kbRender(); return;
      }
      // 만들던 모음에 조각을 하나 더 붙일 수 있으면 붙인다
      if(kbVowSeq && CJ_PREFIX.has(kbVowSeq+part)){
        kbVowSeq+=part;
        kbJung = CJ_VOW[kbVowSeq] ? JUNG.indexOf(CJ_VOW[kbVowSeq]) : -1;
        kbRender(); return;
      }
      // 더 못 붙이면 지금 글자를 확정하고 새로 시작한다
      if(kbVowSeq){ kbFlush(); }
      kbVowSeq=part;
      kbJung = CJ_VOW[part] ? JUNG.indexOf(CJ_VOW[part]) : -1;
      kbRender();
    }
    /* ㅏ·ㅓ·ㅐ·ㅔ·ㅗ·ㅜ 처럼 따로 키를 둔 모음. 평소엔 그 모음의 천지인
       조각을 차례로 넣는 것과 똑같이 동작해서, 뒤이어 조각을 눌렀을 때
       ㅘ·ㅐ 같은 겹모음이 그대로 만들어진다.
       같은 키를 한 번 더 누르면 획이 하나 더 붙은 모음이 된다
       (ㅓ→ㅕ, ㅏ→ㅑ, ㅗ→ㅛ, ㅜ→ㅠ, ㅐ→ㅒ, ㅔ→ㅖ).
       단 받침이 이미 붙어 있으면 그 받침이 다음 글자로 넘어가야 하므로
       (＂간＂+ㅏ = ＂가나＂) 획 더하기로 새지 않게 kbJong 을 같이 본다. */
    function kbVowelDirect(seq, seq2){
      kbSync(); kbCycStop();
      if(seq2 && kbJong===0 && kbVowSeq===seq){
        kbVowSeq=seq2;
        kbJung = CJ_VOW[seq2] ? JUNG.indexOf(CJ_VOW[seq2]) : -1;
        kbRender();
        return;
      }
      for(const p of seq) kbVowel(p);
    }
    /* ── 두벌식 ──
       자모를 그대로 하나씩 받는다. 겹모음(ㅗ+ㅏ=ㅘ)·겹받침(ㄹ+ㄱ=ㄺ)을 합치고,
       받침 뒤에 모음이 오면 그 받침이 다음 글자의 첫소리로 넘어간다. */
    function kbJamo(ch){
      kbSync(); kbCycStop();
      const vi=JUNG.indexOf(ch);
      if(vi>=0){
        if(kbCho>=0 && kbJung<0){ kbJung=vi; }
        else if(kbCho>=0 && kbJung>=0 && kbJong>0){
          const jc=JONG[kbJong], sp=JONG_SPLIT[jc];
          const moved = sp ? sp[1] : jc;
          kbJong = sp ? JONG.indexOf(sp[0]) : 0;
          kbFlush();
          kbCho=CHO.indexOf(moved); kbJung=vi; kbJong=0;
        }
        else if(kbJung>=0){
          const comb=JUNG_COMB[JUNG[kbJung]+ch];
          if(comb){ kbJung=JUNG.indexOf(comb); }
          else{ kbFlush(); kbJung=vi; }
        }
        else{ kbFlush(); kbJung=vi; }
      }else{
        const ci=CHO.indexOf(ch);
        if(kbCho>=0 && kbJung>=0){
          if(kbJong===0){
            const ji=JONG.indexOf(ch);
            if(ji>0){ kbJong=ji; } else { kbFlush(); kbCho=ci; }
          }else{
            const comb=JONG_COMB[JONG[kbJong]+ch];
            if(comb){ kbJong=JONG.indexOf(comb); }
            else{ kbFlush(); kbCho=ci; }
          }
        }else{ kbFlush(); kbCho=ci; }
      }
      kbRender();
    }

    /* 두벌식 모음 키 — 처음 누르면 그 모음을, 곧바로 또 누르면 다음
       겹모음으로 바꾼다(ㅗ→ㅛ). 다른 키를 누르거나 잠깐 쉬면 확정돼서
       "오오" 처럼 같은 모음이 연달아 나오는 것도 칠 수 있다. */
    let kbVCycKey=null, kbVCycStep=0, kbVCycTimer=null;
    function kbVCycStop(){ if(kbVCycTimer){ clearTimeout(kbVCycTimer); kbVCycTimer=null; } kbVCycKey=null; }
    function kbVCycArm(){
      if(kbVCycTimer) clearTimeout(kbVCycTimer);
      kbVCycTimer=setTimeout(()=>{ kbVCycTimer=null; kbVCycKey=null; }, CJ_HOLD_VOWEL);
    }
    function kbQwVowel(keyId){
      kbSync();
      const cyc=QW_VOW[keyId];
      if(!cyc) return;
      if(kbVCycKey===keyId && cyc.length>1 && kbJung>=0 && JUNG[kbJung]===cyc[kbVCycStep]){
        kbVCycStep=(kbVCycStep+1)%cyc.length;
        kbJung=JUNG.indexOf(cyc[kbVCycStep]);
        kbVCycArm(); kbRender(); return;
      }
      kbJamo(cyc[0]);          // 첫 타건은 평소대로(겹모음 합치기·받침 넘김 포함)
      kbVCycKey=keyId; kbVCycStep=0; kbVCycArm();
    }

    /* 나중에 넣은 것부터 되돌린다 — 받침 → 모음 조각 → 첫소리 → 앞 글자.
       받침을 모음보다 먼저 봐야 한다("영" 에서 지우면 "여"가 돼야지,
       모음 조각을 먼저 깎아 받침이 통째로 사라지면 안 된다). */
    function kbBack(){
      kbSync(); kbCycStop();
      // 모음 키를 거듭 눌러 바꿔둔 중이면, 그 키의 차례를 한 칸 되돌린다.
      // ㅒ 는 ㅐ 키로도 ㅏ 키로도 나올 수 있어서, 어느 키로 만들었는지를
      // 봐야 "얘→야" 인지 "얘→애" 인지 맞게 정해진다.
      const vKey=kbVCycKey, vStep=kbVCycStep;
      kbVCycStop();
      if(kbJong>0){
        const sp=JONG_SPLIT[JONG[kbJong]];
        kbJong = sp ? JONG.indexOf(sp[0]) : 0;
      }else if(kbVowSeq){                 // 모음은 획 하나씩 되돌린다
        const wasVowel=!!CJ_VOW[kbVowSeq];
        const de=CJ_DESTROKE[kbVowSeq];
        if(de){ kbVowSeq=de; }            // ㅕ→ㅓ 처럼 덧붙인 획만 뗀다
        else{
          kbVowSeq=kbVowSeq.slice(0,-1);
          // 온전한 모음이었다면 어중간한 조각에서 멈추지 않고 모음까지 간다
          if(wasVowel) while(kbVowSeq && !CJ_VOW[kbVowSeq]) kbVowSeq=kbVowSeq.slice(0,-1);
        }
        kbJung = (kbVowSeq && CJ_VOW[kbVowSeq]) ? JUNG.indexOf(CJ_VOW[kbVowSeq]) : -1;
      }else if(kbJung>=0){
        // 두벌식: 겹모음은 한 겹씩(ㅘ→ㅗ), 거듭 눌러 바뀐 모음은 한 단계(ㅛ→ㅗ)
        const cur=JUNG[kbJung], sp=JUNG_SPLIT[cur];
        const cyc = vKey ? QW_VOW[vKey] : null;
        if(sp) kbJung=JUNG.indexOf(sp[0]);
        else if(cyc && vStep>0 && cyc[vStep]===cur){
          kbJung=JUNG.indexOf(cyc[vStep-1]);
          // 이어서 또 누르면 그 자리에서 계속 오갈 수 있게 차례를 살려둔다
          kbVCycKey=vKey; kbVCycStep=vStep-1; kbVCycArm();
        }
        else if(QW_DEVOW[cur]) kbJung=JUNG.indexOf(QW_DEVOW[cur]);
        else kbJung=-1;
      }else if(kbCho>=0){
        kbCho=-1;
      }else{
        kbBase=kbBase.slice(0,-1);
      }
      kbRender();
    }

    const kbd=$('kbd');
    const kbPop=$('kbPop');   // 초기화 때 kbApplyMode 가 이미 쓰므로 여기서 잡아둔다
    /* ── 자판 고르기(천지인 / 두벌식) ──
       고른 값은 기억해 둔다. 바꿀 때는 조립 중이던 글자를 확정해서 두
       방식의 상태가 섞이지 않게 한다. */
    let kbMode = (data.kbMode==='qw' || data.kbMode==='qc') ? data.kbMode : 'cj';
    /* 원래 두벌식에만 있는 ⇧ — 한 글자만 적용되고 바로 풀린다 */
    let kbShift=false;
    function kbPaintShift(){
      $('kbdQW').querySelectorAll('button[data-k]').forEach(b=>{
        const sk=b.getAttribute('data-sk');
        b.textContent=(kbShift && sk) ? sk : b.getAttribute('data-k');
      });
      const sh=$('kbdQW').querySelector('button[data-fn="shift"]');
      if(sh) sh.classList.toggle('on', kbShift);
    }
    /* 자판은 지금 어느 칸을 쓰고 있는지에 따라 달라진다 —
       이름 칸이면 한글 자판(고른 방식), 전화번호 칸이면 숫자판. */
    let kbTarget=null;   // 'name' | 'tel' | null
    function kbApplyMode(){
      const nameOn = kbTarget==='name';
      $('kbdCJ').hidden = !(nameOn && kbMode==='cj');
      $('kbdQW').hidden = !(nameOn && kbMode==='qw');
      $('kbdQC').hidden = !(nameOn && kbMode==='qc');
      $('kbdNum').hidden = kbTarget!=='tel';
      $('kbdPick').querySelectorAll('button').forEach(b=>{
        b.classList.toggle('on', b.getAttribute('data-kb')===kbMode);
      });
      kbShift=false; kbPaintShift(); kbPopHide();
    }
    kbPaintShift();
    kbApplyMode();
    $('kbdPick').addEventListener('pointerdown', e=>{ e.preventDefault(); });
    $('kbdPick').addEventListener('click', e=>{
      const b=e.target.closest('button');
      if(!b) return;
      const m=b.getAttribute('data-kb');
      if(!m || m===kbMode) return;
      kbSync(); kbCycStop(); kbFlush(); kbRender();   // 조립 중이던 글자는 확정하고 넘어간다
      kbMode=m; data.kbMode=m; save();
      if(kbTarget) kbShow(kbTarget);   // 자판 높이가 달라졌으니 입력판 위치를 다시 잡는다
      else kbApplyMode();
    });
    /* 자판이 화면 아래를 차지하므로, 떠 있는 동안엔 가운데 있던 입력판을
       자판 바로 위로 올려 가려지지 않게 한다. */
    function kbShow(target){
      kbTarget = target || null;
      kbd.hidden = !kbTarget;
      if(!kbTarget){ kbCycStop(); kbVCycStop(); kbPopHide(); if(kbShift){ kbShift=false; kbPaintShift(); } }
      kbApplyMode();
      const eb=$('edBottom');
      if(kbTarget){
        eb.style.top='auto';
        eb.style.bottom=(kbd.offsetHeight+22)+'px';   // 입력판과 자판 사이 여백
        eb.style.transform='translateX(-50%)';
      }else{
        eb.style.top=''; eb.style.bottom=''; eb.style.transform='';
      }
    }
    /* 이름→전화번호로 넘어갈 때 잠깐 둘 다 포커스가 없는 순간이 생긴다.
       그때 자판이 깜빡 닫혔다 열리지 않게, 닫기는 한 박자 미뤘다가
       그 사이 다른 칸이 포커스를 받으면 취소한다. */
    let kbHideTimer=null;
    function kbHideSoon(){ clearTimeout(kbHideTimer); kbHideTimer=setTimeout(()=>kbShow(null), 0); }
    function kbKeepOpen(){ clearTimeout(kbHideTimer); kbHideTimer=null; }
    /* ── 꾹 눌러 고르기 ──
       두벌식C 처럼 한 키가 여러 글자를 내는 자판에서, 키를 꾹 누르면 그
       글자들이 위에 펼쳐진다. 몇 번 눌러야 하는지 세지 않고 바로 찍어
       넣을 수 있고, 그 키가 뭘 낼 수 있는지도 한눈에 보인다. */
    const KB_LONG=400;                       // 꾹 누름으로 치는 시간(ms)
    let kbPopTimer=null, kbPopFired=false;
    let kbPopPtrId=null, kbPopHover=null;    // 꾹 누른 채 끌어서 고르는 중인 손가락
    function kbPopHide(){ kbPop.hidden=true; kbPop.innerHTML=''; }
    function kbPopShow(btn, sur, list){
      kbPop.innerHTML='';
      const add=(ch,cls)=>{
        const b=document.createElement('button');
        b.type='button';
        b.className=cls;        // 자판 키와 색이 달라야 고르는 판인 게 바로 보인다
        b.setAttribute('data-pick', ch);
        b.textContent=ch;
        kbPop.appendChild(b);
      };
      (sur||[]).forEach(ch=>add(ch,'kbPick kbPickSur'));
      if(sur && sur.length && list.length){
        const br=document.createElement('span');
        br.className='kbPopBreak';
        kbPop.appendChild(br);
      }
      list.forEach(ch=>add(ch,'kbPick'));
      kbPop.style.width='auto';
      kbPop.hidden=false;
      /* 두 줄 중 긴 쪽에 맞춰 폭을 못박는다. 안 그러면 절대위치 상자가 남은
         자리를 다 차지해서(가로 접기라 최대폭이 한 줄 기준으로 잡힌다) 판이
         내용보다 넓어지고 오른쪽이 휑하게 빈다. */
      const cols=Math.max((sur||[]).length, list.length);
      const cell=kbPop.querySelector('button');
      if(cell){
        const cst=getComputedStyle(kbPop);
        const gap=parseFloat(cst.columnGap||cst.gap)||6;
        const inner=cols*cell.offsetWidth + (cols-1)*gap;
        // width 가 테두리·안쪽여백까지 포함하는 셈법이면 그만큼 더해 준다.
        // 안 더하면 칸 하나가 밀려나 "김강고권구 / 곽" 처럼 세 줄이 됐다.
        const extra = cst.boxSizing==='border-box'
          ? (parseFloat(cst.paddingLeft)||0)+(parseFloat(cst.paddingRight)||0)
            +(parseFloat(cst.borderLeftWidth)||0)+(parseFloat(cst.borderRightWidth)||0)
          : 0;
        kbPop.style.width=(inner+extra+1)+'px';   // 반올림 여유 1px
      }
      // 눌린 키 바로 위에, 자판 폭을 벗어나지 않게 놓는다
      const kr=btn.getBoundingClientRect(), pr=kbd.getBoundingClientRect();
      const pw=kbPop.offsetWidth;
      let left=kr.left-pr.left+kr.width/2-pw/2;
      left=Math.max(4, Math.min(left, pr.width-pw-4));
      kbPop.style.left=left+'px';
      kbPop.style.top=(kr.top-pr.top-kbPop.offsetHeight-8)+'px';
    }
    // 자판을 눌러도 이름 칸의 포커스가 풀리지 않게 한다(풀리면 자판이 닫힌다)
    /* 손가락이 짚은 글자를 찾는다. 정확히 그 위가 아니어도, 판보다 위로
       올라갔거나 좌우로 조금 빗나간 정도면 가장 가까운 글자로 쳐준다 —
       손가락은 굵고 짚는 점이 손톱 끝과 달라서 딱 맞히기 어렵다.
       아직 누른 키 위에 있으면(판 아래) 고른 게 아니다. */
    function kbPopOptionAt(x,y){
      const el=document.elementFromPoint(x,y);
      const direct=el && el.closest ? el.closest('#kbPop button[data-pick]') : null;
      if(direct) return direct;
      const pr=kbPop.getBoundingClientRect();
      if(y>pr.bottom+6 || y<pr.top-60) return null;
      /* 판이 두 줄이 될 수 있으므로 가로만 보면 안 된다 — 칸 테두리까지의
         가로·세로 거리를 함께 재서 가장 가까운 칸을 고른다. 세로로 빗나간
         것은 더 엄하게 봐야 윗줄·아랫줄이 헷갈리지 않는다. */
      let best=null, bestD=Infinity;
      kbPop.querySelectorAll('button[data-pick]').forEach(b=>{
        const r=b.getBoundingClientRect();
        const dx = x<r.left ? r.left-x : (x>r.right ? x-r.right : 0);
        const dy = y<r.top  ? r.top-y  : (y>r.bottom ? y-r.bottom : 0);
        const d = dx + dy*2;
        if(d<bestD){ bestD=d; best=b; }
      });
      return bestD<=28 ? best : null;
    }
    /* 판에서 고른 것을 넣는다. 성씨는 통글자(가~힣)라 조립기에 넣지 않고
       그대로 붙인다 — 자모로 쪼개 넣으면 앞 글자의 받침으로 붙는 등 어긋난다. */
    function kbPopPut(ch){
      kbPopHide(); kbCycStop(); kbVCycStop();
      if(ch>='가' && ch<='힣'){ kbSync(); kbFlush(); kbBase+=ch; kbRender(); }
      else kbJamo(ch);
    }
    function kbPopSetHover(el){
      if(el===kbPopHover) return;
      if(kbPopHover) kbPopHover.classList.remove('hot');
      kbPopHover=el;
      if(kbPopHover) kbPopHover.classList.add('hot');
    }
    kbd.addEventListener('pointerdown', e=>{
      e.preventDefault();
      clearTimeout(kbPopTimer); kbPopFired=false; kbPopSetHover(null);
      const b=e.target.closest('button');
      if(!b) return;
      // 판에 있는 글자를 누르는 중이면 그대로 둔다 — 고르는 참이다
      if(b.hasAttribute('data-pick')) return;
      /* 자판 키를 눌렀는데 판이 열려 있다면 앞서 띄워 둔 판이다(손을 떼도
         남겨 두므로). 닫고 이 키의 차례로 넘어간다 — 예전엔 여기서 그냥
         돌아가 버려서, ㄱ 을 꾹 눌러 판을 본 뒤에는 ㄴ·ㄷ 를 아무리 꾹
         눌러도 성씨가 안 나왔다. */
      if(!kbPop.hidden) kbPopHide();
      const id=b.getAttribute('data-qc')||b.getAttribute('data-qv');
      const list=id ? (CJ_CONS[id]||QW_VOW[id]) : null;
      if(!list) return;
      // 성씨는 이름 칸이 아직 비었을 때만 — 곧 성을 치려는 참이라는 뜻이다
      const sur=(kbTarget==='name' && !nI.value && id) ? KB_SURNAME[id] : null;
      // 성씨까지 합쳐 두 칸이 안 되면 펼칠 게 없다(ㄴ·ㄹ·ㅁ 처럼 글자가 하나뿐인 키)
      if(list.length + (sur?sur.length:0) < 2) return;
      kbPopPtrId=e.pointerId;
      // 손가락을 판 위로 끌고 가도 계속 따라오게 붙잡아 둔다
      try{ b.setPointerCapture(e.pointerId); }catch(err){}
      kbPopTimer=setTimeout(()=>{ kbPopFired=true; kbPopShow(b, sur, list); }, KB_LONG);
    });
    /* 판이 펼쳐진 뒤 손가락을 떼지 않고 그대로 끌면, 지금 짚고 있는 글자가
       도드라진다. 손가락을 붙잡아 둔 상태라 좌표로 무엇을 짚었는지 찾는다. */
    kbd.addEventListener('pointermove', e=>{
      if(e.pointerId!==kbPopPtrId || kbPop.hidden) return;
      kbPopSetHover(kbPopOptionAt(e.clientX, e.clientY));
    });
    kbd.addEventListener('pointerup', e=>{
      clearTimeout(kbPopTimer);
      if(e.pointerId!==kbPopPtrId) return;
      kbPopPtrId=null;
      // 뗀 자리를 한 번 더 확인한다 — 끌던 도중 pointermove 가 끊겨도
      // 뗀 지점이 글자 위라면 그 글자를 골라준다
      if(!kbPop.hidden) kbPopSetHover(kbPopOptionAt(e.clientX, e.clientY) || kbPopHover);
      // 끌어서 글자를 짚은 채 뗐으면 그 글자를 넣는다
      if(!kbPop.hidden && kbPopHover){
        const ch=kbPopHover.getAttribute('data-pick');
        kbPopSetHover(null);
        kbPopPut(ch);
        kbPopFired=true;   // 뒤따라오는 클릭이 글자를 또 넣지 않게
      }
      // 아무 데도 안 짚고 뗐으면 판은 그대로 둔다 — 그 다음에 눌러서 골라도 된다
    });
    kbd.addEventListener('pointercancel', e=>{
      clearTimeout(kbPopTimer);
      if(e.pointerId===kbPopPtrId){ kbPopPtrId=null; kbPopSetHover(null); }
    });
    kbd.addEventListener('click', e=>{
      const b=e.target.closest('button');
      if(!b || !kbd.contains(b)) return;
      // 펼쳐진 판에서 글자를 골랐다 — 그 글자를 그대로 넣는다
      const pick=b.getAttribute('data-pick');
      if(pick){ kbPopPut(pick); return; }
      // 꾹 눌러 판을 연 그 손가락의 클릭은 글자를 넣지 않는다
      if(kbPopFired){ kbPopFired=false; return; }
      if(!kbPop.hidden) kbPopHide();   // 판이 열린 채 다른 키를 누르면 닫고 그대로 진행
      const fn=b.getAttribute('data-fn');
      if(fn==='shift'){ kbShift=!kbShift; kbPaintShift(); return; }
      if(fn==='back'){ kbBack(); return; }
      if(fn==='clear'){ kbResetFrom(''); kbRender(); nameSayReset(''); return; }
      // 숫자판으로 이어진다. focus() 만 믿지 않고 직접 띄운다 — 포커스 이벤트가
      // 안 오는 경우가 있어서 숫자판이 안 뜨는 일이 있었다.
      if(fn==='next'){ nameSayNow(true); kbKeepOpen(); tI.focus(); kbShow('tel'); return; }
      // ── 전화번호 숫자판 ──
      if(fn==='numback'){ speak('이전'); telSetDigits(telDigits().slice(0,-1)); return; }
      if(fn==='numclear'){ speak('전체 지움'); telSetDigits(''); return; }
      const nd=b.getAttribute('data-n');
      if(nd){ speak(nd); telSetDigits(telDigits()+nd); return; }
      const cj=b.getAttribute('data-cj');
      if(cj){ kbCons(cj); return; }
      const v=b.getAttribute('data-v');
      if(v){ kbVowel(v); return; }
      const vs=b.getAttribute('data-vseq');
      if(vs){ kbVowelDirect(vs, b.getAttribute('data-vseq2')); return; }
      // ── 두벌식C(가나다 배열 + 멀티탭) ──
      const qc=b.getAttribute('data-qc');
      if(qc){ kbVCycStop(); kbCons(qc); return; }
      const qv=b.getAttribute('data-qv');
      if(qv){ kbQwVowel(qv); return; }
      // ── 원래 두벌식(자모를 그대로 받는다) ──
      const k=b.getAttribute('data-k');
      if(k){
        const sk=b.getAttribute('data-sk');
        kbVCycStop();
        kbJamo((kbShift && sk) ? sk : k);
        if(kbShift){ kbShift=false; kbPaintShift(); }   // 시프트는 한 글자만
      }
    });
    /* 숫자판은 화면에 보이는 "010-1234-5678" 이 아니라 숫자만 따로 다룬다 —
       그래야 지울 때 하이픈에 걸리지 않고 한 자씩 깔끔히 지워진다.
       모양 맞추기(fmtTel)는 기존 input 처리기가 그대로 해준다. */
    /* 숫자판을 누를 때마다 그 숫자를 소리로 읽어준다 — 전화번호를 불러주는
       사람과 맞춰보기 좋다. 빨리 여러 번 누르면 앞의 소리를 끊고 방금 누른
       것만 읽는다(안 끊으면 줄줄이 밀려서 한참 뒤처진다).
       음성 기능이 없는 기기에서는 조용히 넘어간다. */
    const TTS = window.speechSynthesis || null;
    let ttsVoice=null;
    function pickVoice(){
      if(!TTS) return;
      const vs=TTS.getVoices()||[];
      ttsVoice = vs.find(v=>/^ko/i.test(v.lang)) || null;
    }
    if(TTS){
      pickVoice();
      if(typeof TTS.addEventListener==='function') TTS.addEventListener('voiceschanged', pickVoice);
    }
    function speak(text){
      if(!TTS || !window.SpeechSynthesisUtterance) return;
      try{
        TTS.cancel();
        const u=new SpeechSynthesisUtterance(String(text));
        u.lang='ko-KR'; u.rate=1.15; u.volume=1;
        if(ttsVoice) u.voice=ttsVoice;
        TTS.speak(u);
      }catch(e){}
    }

    /* ── 이름 읽어주기 ──
       촬영 현장에서는 찍히는 사람 얼굴을 보면서 이름을 치게 된다. 화면을
       안 봐도 맞게 들어갔는지 귀로 확인할 수 있게, 다 친 이름을 읽어준다.
       숫자판이 숫자를 읽어주는 것과 같은 결이다.

       타건이 멈춘 뒤에 읽는다. 한 글자씩 읽으면 같은 키를 거듭 눌러 글자를
       바꾸는 동안(ㅅ→ㅈ→ㅊ) 아직 확정도 안 된 글자를 계속 읽어대서
       시끄럽다. 그래서 차례가 살아 있는 동안에는 읽지 않고 짧게 되물으며
       기다린다 — 차례가 끝나자마자 읽으므로 늦어져도 0.25초 안쪽이다. */
    const NAME_SAY_WAIT=800;    // 손을 뗀 뒤 이만큼 조용하면 읽는다
    const NAME_SAY_RETRY=250;   // 아직 차례가 살아 있을 때 되물어보는 간격
    let nameSayTimer=null, nameSaid='';
    function nameSaySoon(ms){
      clearTimeout(nameSayTimer);
      nameSayTimer=setTimeout(nameSayNow, ms||NAME_SAY_WAIT);
    }
    /* 읽어준 말을 기억해 두고 같은 말을 두 번 읽지 않는다. 새 사람으로
       넘어가거나 이미 적힌 이름에 포커스가 갔을 때는 이걸 지금 값으로
       맞춰 둬서, 치지도 않은 이름을 읽지 않게 한다. */
    function nameSayReset(v){ clearTimeout(nameSayTimer); nameSayTimer=null; nameSaid=v||''; }
    /* force: "다음" 을 누른 때처럼 더 기다릴 까닭이 없을 때. 이름을 다
       썼다는 뜻이므로 차례가 살아 있어도 화면에 보이는 그대로 읽는다. */
    function nameSayNow(force){
      clearTimeout(nameSayTimer); nameSayTimer=null;
      if(!force && (kbCycKey || kbVCycKey)){ nameSaySoon(NAME_SAY_RETRY); return; }  // 아직 바뀌는 중
      const cur=(nI.value||'').trim();
      if(!cur || cur===nameSaid) return;
      nameSaid=cur; speak(cur);
    }
    function telDigits(){ return (tI.value||'').replace(/\D/g,''); }
    function telSetDigits(d){
      tI.value=d;
      tI.dispatchEvent(new Event('input',{bubbles:true}));
    }
    nI.addEventListener('focus', ()=>{ kbKeepOpen(); kbResetFrom(nI.value); nameSayReset(nI.value); kbShow('name'); });
    nI.addEventListener('blur', kbHideSoon);
    tI.addEventListener('focus', ()=>{ kbKeepOpen(); kbShow('tel'); });
    tI.addEventListener('blur', kbHideSoon);

    /* 아이폰 사파리엔 이 API 자체가 없다 — 그런 폰에서는 버튼이 아예 안 나타나서
       지금처럼 손으로 입력하면 되고, 안드로이드(크롬 계열)에서만 마이크가 뜬다.
       이름·전화번호 두 마이크가 인식 상태(micRec/micGen)를 공유해서, 한쪽이
       듣고 있을 때 다른 쪽을 누르면(동시에 둘 다 들을 순 없으므로) 우선
       듣던 쪽을 멈춘다 — 두 세션이 동시에 떠서 서로 결과를 덮어쓰는 일을 막는다. */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    function startMic(btn, applyResult){
      if(micRec){ micStop(); return; }   // 듣는 중에 다시 누르면(같은 버튼이든 다른 버튼이든) 그만 듣는다
      const myGen=++micGen;
      let rec;
      try{ rec=new SR(); }catch(e){ return; }
      micRec=rec;
      rec.lang='ko-KR'; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onstart=()=>{ btn.classList.add('listening'); };
      rec.onresult=ev=>{
        if(myGen!==micGen) return;   // 그 사이 사진이 바뀌었거나 편집기가 닫혔다
        const text=(ev.results[0][0].transcript||'').trim();
        if(text) applyResult(text);
      };
      rec.onerror=ev=>{ if(myGen===micGen && ev.error==='not-allowed') hintEl.textContent='마이크 권한이 필요해요'; };
      rec.onend=()=>{ btn.classList.remove('listening'); if(micRec===rec) micRec=null; };
      try{ rec.start(); }catch(e){ btn.classList.remove('listening'); micRec=null; }
    }
    if(SR && micBtn){
      micBtn.hidden=false;
      nameWrap.classList.add('hasMic');
      micBtn.addEventListener('click', ()=>startMic(micBtn, text=>{
        nI.value=text;
        if(hintEl.textContent.indexOf('입력')>=0) hintEl.textContent='';
      }));
    }
    if(SR && telMicBtn){
      telMicBtn.hidden=false;
      telWrap.classList.add('hasMic');
      telMicBtn.addEventListener('click', ()=>startMic(telMicBtn, text=>{
        tI.value=fmtTel(hangulDigitsToArabic(text));
      }));
    }

    return { start };
  })();

  function legacyCopy(text){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);

    if(!v) return;
    if(!data.ment.length || data.ment[0].cat!=='내가 추가한 멘트'){
      data.ment.unshift({cat:'내가 추가한 멘트', items:[]});
    }
    data.ment[0].items.unshift(v);
    save();
    MENT_FLAT=mentFlat();
    $('mentNewInput').value='';
    renderMentList();
  }
  $('bMent').onclick=()=>{
    renderMentList();
    $('mentModal').classList.add('on');
    // 자동 포커스를 주면 모달이 열리자마자 키보드가 확 튀어나와 화면을 절반쯤
    // 가려버린다. 직접 입력칸을 눌렀을 때만 키보드가 뜨게 자동 포커스는 안 준다.
  };
  $('mentAddBtn').onclick=addMent;
  $('mentNewInput').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); addMent(); }
  });
  $('mentModal').onclick=e=>{
    if(e.target.id==='mentModal') $('mentModal').classList.remove('on');
  };
  $('mentClose').onclick=()=>$('mentModal').classList.remove('on');

  $('bCopyUrl').onclick=async ()=>{
    const url='https://0702080.github.io/';
    // 아이콘 버튼이라 안에 글자를 못 띄우니, 결과는 homeLog 에 잠깐 보여준다
    const flash=(msg)=>{
      $('homeLog').textContent=msg;
      setTimeout(()=>{ if($('homeLog').textContent===msg) $('homeLog').textContent=''; }, 1800);
    };

    try{
      await navigator.clipboard.writeText(url);
      flash('앱 주소가 복사됐어요 ✓');
      return;
    }catch(e){}

    if(legacyCopy(url)){ flash('앱 주소가 복사됐어요 ✓'); return; }

    try{ prompt('아래 주소를 길게 눌러 복사하세요', url); }
    catch(e){ $('homeLog').textContent='주소: '+url; }
  };

  $('fCam').addEventListener('change', e=>{ ED.start(e.target.files); e.target.value=''; });
  $('fPick').addEventListener('change', e=>{ ED.start(e.target.files); e.target.value=''; });


  /* ───── 폰: 태블릿과 짝 맺기 (최초 1회) ───── */
  const isTvMode = location.hash.toLowerCase().indexOf('tv')>=0;
  if(!isTvMode) restoreTodayShots();

  function tvStatus(){
    const btn=$('bTvLink');
    if(!data.tvCode){ setBtn(btn,'📺','태블릿'); return; }
    setBtn(btn,'📺',(TV.isReady()?'✓ ':'연결 중… ')+data.tvCode);
  }
  async function tvConnectPhone(){
    if(!data.tvCode) return;
    try{
      await TV.connect(data.tvCode, { onStatus:tvStatus });   // 폰은 받지 않고 보내기만
    }catch(e){}
    tvStatus();
  }
  /* 화면이 꺼졌다 켜지거나(잠금), 다른 앱(카메라 등)에 다녀오면
     와이파이/모바일 연결이 끊겼다가 이벤트 없이 죽어있는 경우가 있어
     화면이 다시 보일 때마다 연결을 한 번 더 확인/재연결한다 */
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState!=='visible' || isTvMode || !data.tvCode) return;
    if(TV.isReady()) return;      // 멀쩡한 연결을 끊고 다시 붙으면 그 사이 전송이 실패한다
    tvConnectPhone();
  });
  /* 전송 시점에 연결이 이미 끊겨 있으면(버튼 표시가 실제와 어긋난 경우 포함)
     한 번 재연결을 시도한 뒤 다시 보낸다 — 그래도 안 되면 그때 실패로 알린다 */
  async function sendToTvSmart(canvas, nm, tel, opts){
    if(!data.tvCode) return false;      // 짝을 끊어놨으면 절대 보내지 않는다
    let ok = await TV.sendPhoto(canvas, nm, tel, opts).catch(()=>false);
    if(!ok && data.tvCode){
      await tvConnectPhone();
      if(TV.isReady()) ok = await TV.sendPhoto(canvas, nm, tel, opts).catch(()=>false);
    }
    return ok;
  }
  $('bTvLink').onclick=()=>{
    let v;
    try{
      v=prompt('태블릿 화면에 떠 있는 코드를 입력하세요.\n(연결을 끊으려면 비워두고 확인)', data.tvCode||'');
    }catch(e){ return; }
    if(v===null) return;
    const c=(v||'').trim().toUpperCase();
    data.tvCode=c||''; save();
    if(!c){ TV.disconnect(); setBtn($('bTvLink'),'📺','태블릿'); return; }
    tvConnectPhone();
  };
  // 태블릿 모드에서는 아래 startTvMode() 가 따로 연결하므로 여기서 연결하지 않는다
  // (둘 다 연결하면 서로 상대의 연결을 끊어버려 사진이 안 넘어감)
  if(!isTvMode){ if(data.tvCode) tvConnectPhone(); else tvStatus(); }

  /* ───── 태블릿 모드 (#tv 로 열었을 때) ───── */
  async function startTvMode(){
    document.documentElement.classList.add('tvmode');   // 가로 강제회전 CSS 예외
    document.getElementById('home').style.display='none';
    $('tv').classList.add('on');
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

    // 방 코드는 이 태블릿에 계속 저장해 둔다 (매번 바뀌면 폰을 다시 연결해야 하므로).
    // 다만 예전 형식(GDB988 같은 랜덤 6자)으로 저장된 코드는 새 형식(TB98)이
    // 아니므로 한 번만 새로 만든다 — 그 뒤엔 폰에서 새 코드를 다시 입력해야 함.
    if(!data.tvCode || !/^TB\d{2}$/.test(data.tvCode)){ data.tvCode=TV.makeCode(); save(); }
    $('tvCode').textContent=data.tvCode;

    /* 코드를 눌러 복사 — PC에서 복사해 폰으로 붙여넣기 쉽게 */
    $('tvCode').onclick=async ()=>{
      const note=$('tvCopied');
      const flash=m=>{ note.textContent=m; setTimeout(()=>{ note.textContent=''; }, 2000); };
      try{
        await navigator.clipboard.writeText(data.tvCode);
        flash('복사됨 ✓');
        return;
      }catch(e){}
      if(legacyCopy(data.tvCode)){ flash('복사됨 ✓'); return; }
      // 복사가 막힌 환경 — 드래그로 직접 선택할 수 있게 통째로 선택해 준다
      try{
        const r=document.createRange(); r.selectNodeContents($('tvCode'));
        const s=getSelection(); s.removeAllRanges(); s.addRange(r);
        flash('길게 눌러 복사하세요');
      }catch(e2){}
    };

    /* ───── 사진 확대·이동 (마우스 휠 / 손가락 핀치 / 드래그) ───── */
    const stage=$('tvStage'), img=$('tvImg');
    let sc=1, tx=0, ty=0;
    const MIN=1, MAX=6;

    function applyTf(){
      img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
      img.classList.toggle('zoomed', sc>1.01);
      $('tvPct').textContent=Math.round(sc*100)+'%';
      // 확대해서 보는 동안에는 자동으로 사라지지 않게 멈춘다
      if(sc>1.01) holdClear(); else armClear();
    }
    function clampPan(){
      const st=stage.getBoundingClientRect();
      const w=img.clientWidth*sc, h=img.clientHeight*sc;
      const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
      tx=Math.min(mx,Math.max(-mx,tx));
      ty=Math.min(my,Math.max(-my,ty));
    }
    /* 화면상의 한 점을 기준으로 확대 (그 점이 제자리에 머물도록) */
    function zoomAt(px,py,next){
      const st=stage.getBoundingClientRect();
      const ox=px-st.left-st.width/2, oy=py-st.top-st.height/2;
      const s2=Math.min(MAX,Math.max(MIN,next));
      const u=(ox-tx)/sc, v=(oy-ty)/sc;
      tx=ox-u*s2; ty=oy-v*s2; sc=s2;
      if(sc<=1.001){ sc=1; tx=0; ty=0; }
      clampPan(); applyTf();
    }
    function resetZoom(){ sc=1; tx=0; ty=0; applyTf(); }
    /* 폰에서 온 배율·위치를 반영한다. fx/fy 는 "테두리까지 이동 가능한
       거리 대비 비율"이라 이 태블릿 화면 크기에 맞는 실제 이동 거리로
       다시 계산해야 한다(화면 비율이 폰과 다르므로 픽셀 값을 그대로
       쓰면 어긋난다). 사진이 아직 안 떠 있으면(다른 사진 전송이 늦어지는
       중 등) 무시한다. */
    function applyRemoteXf(o){
      if(!$('tvShow').classList.contains('on')) return;
      sc=Math.min(MAX,Math.max(MIN,o.sc||1));
      const st=stage.getBoundingClientRect();
      const w=img.clientWidth*sc, h=img.clientHeight*sc;
      const mx=Math.max(0,(w-st.width)/2), my=Math.max(0,(h-st.height)/2);
      tx=(o.fx||0)*mx; ty=(o.fy||0)*my;
      clampPan(); applyTf();
    }

    const shown=()=>$('tvShow').classList.contains('on');

    stage.addEventListener('wheel', e=>{
      if(!shown()) return;
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, sc*(e.deltaY<0 ? 1.15 : 1/1.15));
    }, {passive:false});

    // 두 번 누르면 확대 ↔ 원래대로
    stage.addEventListener('dblclick', e=>{
      if(!shown()) return;
      if(sc>1.01) resetZoom(); else zoomAt(e.clientX,e.clientY,2.5);
    });

    // 포인터로 끌어서 이동 + 손가락 두 개로 핀치 확대
    const pts=new Map();
    let panning=false, lastX=0, lastY=0, pinchD=0, pinchS=1;
    stage.addEventListener('pointerdown', e=>{
      if(!shown()) return;
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}   // 캡처 실패해도 계속 진행
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===1){ panning=true; lastX=e.clientX; lastY=e.clientY; img.classList.add('dragging'); }
      else if(pts.size===2){
        panning=false; img.classList.remove('dragging');
        const [a,b]=[...pts.values()];
        pinchD=Math.hypot(a.x-b.x,a.y-b.y); pinchS=sc;
      }
    });
    stage.addEventListener('pointermove', e=>{
      if(!pts.has(e.pointerId)) return;
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2 && pinchD>0){
        const [a,b]=[...pts.values()];
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        zoomAt((a.x+b.x)/2,(a.y+b.y)/2, pinchS*(d/pinchD));
      }else if(panning && sc>1.01){
        tx+=e.clientX-lastX; ty+=e.clientY-lastY;
        lastX=e.clientX; lastY=e.clientY;
        clampPan(); applyTf();
      }
    });
    function endPt(e){
      pts.delete(e.pointerId);
      if(pts.size<2) pinchD=0;
      /* 두 손가락으로 확대한 뒤 한 손가락만 떼는 건 아주 흔한 동작이다.
         남은 손가락 위치를 기준점으로 삼아 이동을 이어받지 않으면
         화면이 먹통이 된 것처럼 느껴진다. */
      if(pts.size===1){
        const p=[...pts.values()][0];
        panning=true; lastX=p.x; lastY=p.y;
        img.classList.add('dragging');
      }
      if(pts.size===0){ panning=false; img.classList.remove('dragging'); }
    }
    stage.addEventListener('pointerup', endPt);
    stage.addEventListener('pointercancel', endPt);

    $('tvIn').onclick =()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc*1.4); };
    $('tvOut').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, sc/1.4); };
    $('tvFit').onclick=resetZoom;

    /* ───── 표시 / 자동 비우기 ───── */
    let clearT=null;
    function armClear(){
      clearTimeout(clearT);
      if(!$('tvShow').classList.contains('on')) return;
      clearT=setTimeout(()=>{
        $('tvShow').classList.remove('on');
        $('tv').classList.remove('full');
        $('tvIdle').style.display='';
        img.src='';
        sc=1; tx=0; ty=0;
        img.style.transform=''; img.classList.remove('zoomed');
        $('tvPct').textContent='100%';
      }, 15000);
    }
    function holdClear(){ clearTimeout(clearT); }

    function showPhoto(o){
      clearTimeout(clearT);
      // 폰에서 썸네일을 눌러 보낸 사진(full)은 화면 전체를 채워서 보여준다
      $('tv').classList.toggle('full', !!o.full);
      img.src=o.img;
      sc=1; tx=0; ty=0; applyTf();      // 새 사진은 항상 원래 크기부터
      $('tvIdle').style.display='none';
      $('tvShow').classList.add('on');
      armClear();
    }
    /* 크게 보기에서 빠져나오기 — 버튼 또는 Esc */
    function exitFull(){ $('tv').classList.remove('full'); resetZoom(); armClear(); }
    $('tvEsc').onclick=exitFull;
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') exitFull(); });
    try{
      await TV.connect(data.tvCode, {
        onPhoto: showPhoto,
        onXf: applyRemoteXf,
        onStatus: ok=>{ $('tvDot').textContent = ok ? '● 연결됨' : '○ 연결 중…'; }
      });
    }catch(e){
      $('tvDot').textContent='연결할 수 없음 (인터넷 확인)';
    }
    /* 화면 꺼짐 방지 — 브라우저는 화면이 한 번 가려지면(잠금·다른 화면 전환)
       이 잠금을 스스로 풀어버리고, 돌아와도 자동으로 복구해주지 않는다.
       그래서 화면이 다시 보일 때마다 직접 다시 걸어줘야 한다. */
    let wakeSentinel=null;
    async function keepAwake(){
      try{
        if(!('wakeLock' in navigator)) return;
        if(wakeSentinel && !wakeSentinel.released) return;
        wakeSentinel=await navigator.wakeLock.request('screen');
      }catch(e){}
    }
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible') keepAwake();
    });
    keepAwake();
  }
  if(isTvMode) startTvMode();

  /* 새 버전을 올려도 폰 웹앱이나 벽걸이 화면처럼 계속 켜둔 채로 쓰면
     새로고침을 안 하는 한 예전 코드가 계속 돌아간다(서비스워커는
     "새로 열 때" 최신 파일을 주는 것이지, 이미 열려서 돌고 있는
     페이지의 스크립트를 바꿔주진 않는다). 그래서 주기적으로 서버의
     실제 버전을 확인해서, 태블릿 화면은 한가할 때(사진 안 띄운 상태)
     스스로 새로고침하고, 폰은 배너로 눌러서 새로고침하게 안내한다. */
  const CUR_VER = ((document.querySelector('h1 span')||{}).textContent||'').trim();
  function showUpdateBanner(){
    if($('updateBanner')) return;
    const b=document.createElement('div');
    b.id='updateBanner';
    b.textContent='🔄 새 버전이 있습니다 — 눌러서 새로고침';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;'+
      'background:#3a2f42;color:#fff;text-align:center;padding:14px;'+
      'font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.25)';
    b.onclick=()=>location.reload();
    document.body.appendChild(b);
  }
  async function checkForUpdate(){
    if(!CUR_VER) return;
    try{
      const res=await fetch(location.pathname+'?_c='+Date.now(), {cache:'no-store'});
      const html=await res.text();
      const m=html.match(/<h1>[\s\S]*?<span[^>]*>([^<]+)<\/span>/);
      const newVer=m?m[1].trim():'';
      if(!newVer || newVer===CUR_VER) return;
      if(isTvMode){
        if(!$('tvShow').classList.contains('on')) location.reload();
        // 사진이 떠 있으면 다음 확인(1분 뒤) 때 다시 시도 — 대기 화면으로 돌아가면 새로고침됨
      }else{
        showUpdateBanner();
      }
    }catch(e){}
  }
  setInterval(checkForUpdate, 60000);

  /* 진입 애니메이션이 끝나면 클래스를 떼어낸다 — animation-fill-mode:both 를
     그대로 두면 그 뒤로 버튼을 눌러도(:active/.pressing) transform 이 계속
     애니메이션 값에 눌려서 눌림 효과가 하나도 안 보이게 된다.
     animationend 가 못 불릴 수도 있어(탭이 백그라운드였다가 돌아온 경우 등)
     타임아웃으로도 한 번 더 확실히 떼어낸다. */
  document.querySelectorAll('#home .enter').forEach(el=>{
    const clear=()=>{ el.classList.remove('enter'); el.style.animationDelay=''; };
    el.addEventListener('animationend', clear, {once:true});
    setTimeout(clear, 900);
  });

  /* 서비스워커: 온라인이면 항상 최신본, 오프라인이면 캐시본 */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  /* 세로 고정: 앱(홈 화면 아이콘)으로 실행 중이면 manifest 의 orientation:"portrait"
     로 자동 고정된다. 혹시 지원 안 되는 상황을 대비해 API로도 한 번 더 시도.
     (태블릿 확인 화면은 가로로 걸 수 있으므로 고정하지 않는다) */
  if(!isTvMode){
    try{
      if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
    }catch(e){}
  }
})();
</script>
